name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 정적 파일 모으기 + 캐시 무효화 버전 주입
        run: |
          mkdir _site
          cp -r index.html style.css favicon.svg src vendor docs _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" _site/index.html
          if grep -q "__BUILD__" _site/index.html; then
            echo "::error::index.html에 치환되지 않은 __BUILD__가 남아 있습니다"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
