name: Export

# Exports the game for every platform on every pull request and push to main, the same way a
# release does (tools/export.sh), so a broken export shows up in review rather than on release
# day. Meant to be a required status check. The builds are kept for a week as workflow artifacts.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Any `permissions:` block replaces the default token scopes, so grant per job.
permissions: {}

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  export:
    name: Export
    # macOS exports every platform, and gives the Mac build a proper ad-hoc signature with its own
    # codesign.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The font is a submodule: Itrium Pixel, shared by the games.
          submodules: true
      - name: Download Godot
        run: |
          curl --fail --location --silent --show-error --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      # The export templates are over a gigabyte, so they're kept between runs; the key is the
      # Godot version, so a new Godot fetches new templates.
      - name: Restore the export templates
        id: templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Application Support/Godot/export_templates
          key: godot-export-templates-${{ env.GODOT_VERSION }}
      - name: Download the export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --silent --show-error --output templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          folder="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$folder"
          unzip -q templates.tpz -d "$RUNNER_TEMP/templates"
          mv "$RUNNER_TEMP/templates/templates/"* "$folder/"
      - name: Export every platform
        run: tools/export.sh build/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builds
          path: build/release/
          retention-days: 7
          if-no-files-found: error
