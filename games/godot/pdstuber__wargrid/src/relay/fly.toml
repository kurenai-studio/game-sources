app = "wargrid-relay"
primary_region = "fra"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # Ten 3v3 rooms (user, 2026-11-08) plus probes; caps a connection flood on one machine.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 60
    hard_limit = 70

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
