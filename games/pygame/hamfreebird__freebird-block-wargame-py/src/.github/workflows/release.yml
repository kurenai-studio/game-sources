name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（形如 v1.1.0）"
        required: true

env:
  # Windows 运行器的 stdout 默认是 cp1252 管道，无法输出中文 →
  # 统一强制 UTF-8（脚本内部也有兜底，此处为双保险）
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  # CI 运行器没有声卡：SDL 若访问真实音频设备会刷出大量 ALSA 报错。
  # 配合 dummy 驱动与禁播放开关，音效逻辑仍被完整测试，只是不真正发声。
  SDL_AUDIODRIVER: dummy
  SDL_VIDEODRIVER: dummy
  BLOCKWARGAME_NO_AUDIO: "1"

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 构建安装包
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1
          else
            bash packaging/build_linux.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: packaging/dist/
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 整理发布附件
        run: |
          ls -lh artifacts/*/ || true
          cp -v artifacts/*/* artifacts/ 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## 方块兵棋 ${{ github.ref_name }}

            现代战争方块兵棋，Python + pygame 实现。

            | 附件 | 平台 | 说明 |
            |---|---|---|
            | `fangkuai-bingqi-windows-x64.zip` | Windows | 免安装，解压即玩 |
            | `fangkuai-bingqi-linux-x86_64.tar.gz` | Linux | 解压后运行 `run.sh` |
            | `fangkuai-bingqi-portable.pyz` | 全平台 | 零依赖便携版（需系统已装 Python 与 pygame） |
            | `fangkuai-bingqi-source.zip` | 全平台 | 源码包 |

            ### 运行要求
            - 免安装版：Windows 10+ / 主流 x86_64 Linux 桌面
            - 便携版：Python 3.10+ 且 `pip install pygame-ce`
