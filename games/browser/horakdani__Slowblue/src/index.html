       * different were the quiet ones. Which is not a hypothetical - this class
       * was written for that finding and then left off the element for four
       * commits, and the panel in the meantime was exactly the stack of lozenges
       * it describes, each one 62px wide in a 46px column and hanging over the
       * drawer's own right edge.
       *
       * So on is a hairline and off is dimmer still, and what carries the state is
       * the row itself - a named layer with a lit fader against a grey one. The
       * exception is what should be visible, not the rule.
       *
       * ## The ring is a pseudo-element because the target is not the chip
       *
       * Everything in this shell that a finger is asked for measures `--reach` on
       * its short side, and that is 44 - about twice the height this chip wants to
       * be. Both used to be true of the same box and the box won: the chip grew to
       * 44 and turned into the lozenge above. Drawing the ring on `::before`
       * separates the two questions. The button is a 46x44 target; the ring inside
       * it is 46x24, and the twenty pixels of quiet glass above it still answer a
       * thumb.
       *
       * The glass is all above because the ring stands on the row's foot rather
       * than in the middle of its target, which is what puts it on the fader's
       * line - see `--ring`. The word moves with it: the top padding is what is
       * left of the target once the ring has had its share, so ON is centred in
       * the ring and not in the box the ring hangs in.
       */
      .ui-audio-toggle {
        /* Out of the flow and into the gutter the row keeps clear for it, so that
           the row's one in-flow child is the name and the name can have the whole
           width. Nothing here ellipsises any more - not `Sinking bubbles`, not
           `The ring of silence` - and the rule under it is the same length in
           every row whatever it is called. */
        position: absolute;
        top: 0;
        right: 0;
        width: var(--chip);
        min-width: 0;
        height: var(--reach);
        min-height: var(--reach);
        padding: calc(var(--reach) - var(--ring)) 0 0;
        border: none;
        border-radius: 0;
        background: transparent;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.12em;
        /* letter-spacing hangs a gap off the last letter; half of it back on the
           front is what actually centres a tracked-out word. */
        text-indent: 0.12em;
      }
      .ui-audio-toggle::before {
        content: '';
        position: absolute;
        /* Standing on the row's foot, not centred in the target: half of it is
           above the fader's line and half below, which is what "in line with the
           slider" means for a thing that is taller than a line. */
        inset: auto 0 0;
        /* `*` in this file does not reach pseudo-elements, and a content-box ring
           is 26 tall for a 24 that has to be halved against the rule. */
        box-sizing: border-box;
        height: var(--ring);
        border: 1px solid rgba(140, 210, 245, 0.14);
        border-radius: 12px;
      }
      .ui-mix .ui-audio-toggle {
        /* The floor tier, for the same reason the muted label is on it: OFF is a
           resting state of this panel now, not only a state somebody chose. */
        color: var(--ink-3);
      }
      /* `.ui-switch.on` fills, and it out-specifies the class above by a whole
         selector - so the fill has to be turned off where it is most visible
         rather than left to the base rule. Without this the chip is a 46x44 blue
         slab with a 46x24 hairline drawn across the middle of it. */
      .ui-mix .ui-audio-toggle.on {
        background: transparent;
        color: var(--ink-2);
      }
      .ui-mix .ui-audio-toggle.on::before {
        border-color: rgba(140, 210, 245, 0.3);
      }
      @media (hover: hover) {
        .ui-mix .ui-audio-toggle:hover,
        .ui-mix-close:hover {
          color: #eafcff;
        }
        .ui-mix .ui-audio-toggle:hover::before,
        .ui-mix-close:hover::before {
          border-color: rgba(160, 226, 255, 0.5);
        }
      }
      /* The master switch is the lid on the mixer rather than its first track:
         brighter, wider, no fader, and a plane of its own under it. */
      .ui-mix .ui-setting {
        min-height: var(--reach);
        padding: 0;
        border-bottom: none;
      }
      .ui-audio-master .ui-setting-label {
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--ink);
      }
      /* The one switch in the drawer that is still filled when it is on, and the
         same 44px-target-around-a-smaller-pill trick as the chip above. It is
         allowed the fill because it is the exception the chips are quiet for:
         there is one of it, and what it says is whether any of this is audible. */
      .ui-mix .ui-audio-master .ui-switch {
        position: relative;
        width: 60px;
        min-width: 0;
        height: var(--reach);
        min-height: var(--reach);
        padding: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-indent: 0.14em;
      }
      .ui-mix .ui-audio-master .ui-switch::before {
        content: '';
        position: absolute;
        /* (44 - 26) / 2 */
        inset: 9px 0;
        border: 1px solid rgba(140, 210, 245, 0.24);
        border-radius: 13px;
      }
      .ui-mix .ui-audio-master .ui-switch.on::before {
        border-color: rgba(160, 226, 255, 0.48);
        background: rgba(52, 148, 190, 0.32);
      }
      .ui-corner {
        position: fixed;
        z-index: 6;
        top: calc(var(--safe-t) + 10px);
        right: calc(var(--safe-r) + 10px);
        width: var(--reach);
        height: var(--reach);
        border-radius: 22px;
        border: 1px solid rgba(150, 210, 240, 0.2);
        background: rgba(6, 22, 38, 0.45);
        color: var(--ink-2);
        font-size: 11px;
        letter-spacing: 1px;
        cursor: pointer;
      }
      /* The mixer button sits under the pause button rather than beside it: the
         top-right corner is where a thumb rests, and two targets side by side
         there is one mis-tap away from pausing a run somebody was enjoying.
         Ten under the inset, then the pause button, then eight of air. */
      .ui-corner-mix {
        top: calc(var(--safe-t) + 10px + var(--reach) + 8px);
        font-size: 17px;
        line-height: 1;
      }
      /* The icon is the whole face of the button, so it centres itself and runs
         at full strength rather than the 0.75 an inline label icon sits at. */
      .ui-corner-mix {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ui-ico-mix {
        width: 19px;
        height: 19px;
        opacity: 1;
      }
      /* The slash rides on the icon and is only shown while everything is muted,
         so the corner says "silent" without being opened. */
      .ui-ico-mix .slash {
        display: none;
      }
      .ui-corner-mix.muted .ui-ico-mix .slash {
        display: inline;
      }
      /* One reason for the slash, and it is the player's own switch. A launch
         waiting on its first gesture is silent too, and drawing it here was a
         mistake worth leaving a line about: a crossed-out speaker on the opening
         screen reads as a game that ships muted, which is the opposite of what it
         is. That state is handled where it belongs - in what the press does. See
         `Shell.silent`. */
      .ui-corner-mix.muted {
        color: var(--ink-3);
      }
      .ui-corner-mix.on {
        background: rgba(52, 148, 190, 0.42);
        border-color: rgba(160, 226, 255, 0.5);
        color: var(--ink);
      }
      /* Off-run there is no pause button above it, so it takes the corner itself
         rather than floating 58px down with nothing over it. It is a mute there
         and not a drawer - see the click handler in `Shell.ts` - and this is the
         only outward sign of that: same face, same corner, one job each side of
         a run. */
      .ui-corner-mix.solo {
        top: calc(var(--safe-t) + 10px);
      }

      /* --- the in-game mixer drawer ---
         Not a dialog and not a pause screen. The *water* is held while it is open
         (`mixHold` in main.ts) and the bed goes on playing, because the only way
         to set a level is to hear it and the only way to take your time over one
         is to know nothing is eating your shoal while you do. */
      /*
       * The card hugs what is in it.
       *
       * It used to be pinned top *and* bottom, which made it a column the height of
       * the screen whatever it had to say - a slab down one side of the water, with
       * the last two rows of a ten-row list hanging off the end of it. Anchored at
       * the top with a ceiling on how tall it may get, it is a card: five layers in
       * act I make a shorter one than six in act III, and both of them end where
       * their last row does.
       *
       * The scrollport is `.ui-mix-list` and not the card, which is the other half
       * of the same idea. Nothing the game ships reaches it on a phone with room -
       * but a 568px screen with a six-layer bed does now that a row is a finger
       * tall, and a text-scaling setting can turn any list into a long one. What
       * scrolls is the list; what never does is the masthead, so the name of the
       * station and the way out of the panel are on the glass at every scroll
       * position.
       */
      .ui-mix {
        position: fixed;
        z-index: 6;
        /* Clear of both corner buttons: the inset, two of them, and the air
           between and below. */
        top: calc(var(--safe-t) + 10px + 2 * var(--reach) + 16px);
        right: calc(var(--safe-r) + 10px);
        /* ...and it ends where its last row does, or here, whichever comes first.
           `bottom` is what made this a slab: with both edges pinned the card is
           the height of the screen whatever it has to say. Same arithmetic, read
           as a ceiling instead of an anchor - the top offset above, plus the
           gutter the bottom edge used to sit on.

           Two declarations because they answer different questions on a phone:
           `vh` is the tall viewport, measured with the browser's toolbars gone,
           and a fixed card is laid out against the short one. `dvh` is the short
           one, and it is the second line so that a browser without it keeps the
           old answer rather than none. */
        max-height: calc(100vh - var(--safe-t) - var(--safe-b) - 2 * var(--reach) - 36px);
        max-height: calc(100dvh - var(--safe-t) - var(--safe-b) - 2 * var(--reach) - 36px);
        /* The fallback width is what is left of the glass, not what is left of
           the viewport: `100vw` includes both cutouts under `viewport-fit=cover`,
           so a drawer pinned to the right inset and sized against the raw width
           has its far edge under the left one. */
        width: min(320px, calc(100vw - var(--safe-l) - var(--safe-r) - 20px));
        display: flex;
        flex-direction: column;
        padding: 0 14px 8px;
        border: 1px solid rgba(140, 210, 245, 0.18);
        border-radius: 18px;
        background: rgba(3, 16, 29, 0.9);
        backdrop-filter: blur(9px);
        color: var(--ink);
        text-align: left;
      }
      /*
       * The masthead: a plane, not two rows.
       *
       * What this panel is and whether any of it is audible are a different kind
       * of question from what the whale is doing, and they used to be drawn like
       * the same kind - a title, a rule, a switch, a rule, and then the list, all
       * of it on one flat sheet with the eye given nothing to hold on to. It is
       * its own surface now: full-bleed to the card's edges, a shade lighter than
       * what it sits on, and closed off with a line. Two planes, and everything
       * below the line is a level.
       */
      .ui-mix-top {
        flex: 0 0 auto;
        /* Out to the card's own edges, under its corners. The radius is the
           card's minus its border, or the fill draws a bright hairline across
           each top corner where the two curves disagree. */
        margin: 0 -14px 4px;
        padding: 4px 14px 8px;
        border-bottom: 1px solid rgba(140, 210, 245, 0.2);
        border-radius: 17px 17px 0 0;
        background: rgba(16, 42, 66, 0.62);
      }
      /* The one thing in the card that is allowed to be taller than the card. */
      .ui-mix-list {
        flex: 1 1 auto;
        /* A flex item's floor is its content, so without this the list refuses to
           be shorter than ten rows and takes the card past its ceiling instead of
           scrolling inside it. */
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        touch-action: pan-y;
      }
      .ui-mix-list::-webkit-scrollbar {
        width: 3px;
      }
      .ui-mix-list::-webkit-scrollbar-thumb {
        border-radius: 2px;
        background: rgba(140, 210, 245, 0.3);
      }
      .ui-mix-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .ui-mix.hidden {
        display: none;
      }
      /* `min-height` is a border-box number here, like everywhere else in this
         file: a finger for the close, and the air it stands in. The rule under the
         head went with the masthead - two lines three pixels apart, one under the
         title and one under the master switch, were a boxed heading rather than a
         header. */
      .ui-mix-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: var(--reach);
      }
      .ui-mix-title {
        margin: 0;
        font-size: 15px;
        font-weight: 300;
        letter-spacing: 0.16em;
        color: var(--ink);
      }
      /* The way out, in the corner of the panel it belongs to rather than at the
         bottom of the list it is under. Where it used to be - a full-width pill
         after the last track - it was the one control that moved every time the
         act changed the number of layers, and on a scrolling panel it was the one
         control you had to scroll to find. */
      .ui-mix-close {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--reach);
        height: var(--reach);
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--ink-3);
        cursor: pointer;
      }
      /* The ring is 30px and the target is 44, drawn the same way the state chips
         are: the border on a pseudo-element, so how big this looks and how big it
         is stop being one number. It was 30 of both, and the census called it the
         second-smallest live control in the shell. */
      .ui-mix-close::before {
        content: '';
        position: absolute;
        /* (44 - 30) / 2 */
        inset: 7px;
        border: 1px solid rgba(140, 210, 245, 0.22);
        border-radius: 50%;
      }
      .ui-mix-close:active {
        transform: translateY(1px);
      }
      .ui-mix-close svg {
        width: 11px;
        height: 11px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      /*
       * What a short screen gives up, and what it does not.
       *
       * It used to be the row. Four tiers of `--row` - 40, 36, 32, 28 - traded a
       * mixer you could see all of against a fader you could hit, and the trade
       * was settled the wrong way round: on a 320x568 the drag target for a level
       * was 92x28. The row is `--reach` on every screen now, and the thing that
       * gives instead is the air around the headings and the card's own padding,
       * which nobody is being asked to hit.
       *
       * Past that the list scrolls, which is a thing this panel is allowed to do
       * now that CLOSE is in the masthead rather than under the last track.
       */
      @media (max-height: 700px) {
        .ui-section-title {
          margin: 8px 0 2px;
        }
      }
      @media (max-height: 620px) {
        .ui-mix {
          padding: 0 12px 6px;
        }
        .ui-mix-top {
          margin: 0 -12px 2px;
          padding: 2px 12px 4px;
        }
        .ui-section-title {
          margin: 5px 0 1px;
        }
      }
      /* ...and on a narrow one the chip's gutter closes up a little. There used to
         be a second rule here taking width off the fader so that a layer called
         "The ring of silence" was still called that rather than "The ring of s…":
         the name has the whole row now, so the fader and the label have stopped
         being two things bidding for the same 290 pixels. */
      @media (max-width: 340px) {
        .ui-audio-track {
          --chip: 42px;
          padding-right: calc(var(--chip) + 8px);
        }
        .ui-audio-track::after,
        .ui-audio-track input[type='range'] {
          right: calc(var(--chip) + 8px);
        }
      }
      /* --- debug panel (dev / ?debug=1 only) --- */
      .slowblue-debug {
        position: fixed;
        top: var(--safe-t);
        right: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: flex-end;
        font:
          500 11px ui-monospace,
          monospace;
        color: #cdeaff;
      }
      .slowblue-debug.enabled {
        display: flex;
      }
      .slowblue-debug-toggle {
        margin: 6px;
        width: 34px;
        height: 34px;
        border-radius: 17px;
        border: 1px solid rgba(160, 220, 255, 0.25);
        background: rgba(6, 24, 40, 0.7);
        color: #cdeaff;
        font-size: 16px;
      }
      .slowblue-debug-body {
        display: none;
        flex-direction: column;
        gap: 6px;
        width: min(96vw, 360px);

        overflow-y: auto;

        background: rgba(4, 16, 28, 0.92);
        border: 1px solid rgba(120, 200, 255, 0.18);

      }

        font:
          500 11px ui-monospace,

      }
      .slowblue-debug-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .slowblue-debug-controls button {
        background: rgba(20, 52, 78, 0.9);
        color: #d6f2ff;
        border: 1px solid rgba(140, 210, 255, 0.2);
        border-radius: 5px;
        padding: 4px 6px;
        font:
          500 11px ui-monospace,
          monospace;
      }
      /* The row the whole iPad measurement is taken through, and the only part of this
         panel worked by a finger rather than a mouse: 44px because it is tapped
         mid-run, on the device the number is about, between ten-second stretches of
         play. The lit one is the rung the ladder is being held at. */
      .slowblue-debug-pins {
        align-items: center;
        gap: 6px;
      }
      .slowblue-debug-pins button {
        min-width: 46px;
        min-height: 44px;
      }
      .slowblue-debug-controls button.on {
        background: rgba(64, 156, 208, 0.95);
        border-color: rgba(205, 240, 255, 0.6);

      .slowblue-debug-seed {
        width: 92px;
        background: rgba(2, 12, 22, 0.9);
        color: #d6f2ff;

        border-radius: 5px;
        padding: 3px 5px;
        font:
          500 11px ui-monospace,
          monospace;
      }
      .slowblue-debug-check {
        display: inline-flex;
        align-items: center;
        gap: 3px;

        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .slowblue-debug-row {
        display: grid;
        grid-template-columns: 116px 1fr 54px;
        align-items: center;
        gap: 4px;
      }
      .slowblue-debug-row input[type='range'] {
        width: 100%;
        accent-color: #58d7ff;
      }
      .slowblue-debug-val {
        text-align: right;
        color: #8fd0ef;
      }
      .slowblue-debug-note {
        color: #6b93ad;
        padding-top: 2px;
      }

      /* --- admin surface (dev / ?admin=1 only) ---
         A full-screen sheet rather than a corner drawer: it is a list of twelve
         stations, sixty-odd sections and thirty sounds, and every one of them has
         to be a 44px touch target on the phone the game is being felt on. */
      .slowblue-admin-toggle {
        position: fixed;
        z-index: 10;
        top: calc(var(--safe-t) + 6px);
        left: calc(var(--safe-l) + 6px);
        width: 34px;
        height: 34px;
        border-radius: 17px;
        border: 1px solid rgba(160, 220, 255, 0.25);
        background: rgba(6, 24, 40, 0.7);
        color: #cdeaff;
        font:
          600 13px/1 ui-monospace,
          monospace;
      }
      .slowblue-admin-toggle.on {
        background: rgba(52, 148, 190, 0.5);
        color: #f0fdff;
      }
      .slowblue-admin {
        position: fixed;
        inset: 0;
        z-index: 11;
        display: none;
        flex-direction: column;
        padding: calc(var(--safe-t)) 0 calc(var(--safe-b));
        background: rgba(2, 11, 20, 0.97);
        color: #cdeaff;
        font:
          500 12px/1.4 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      .slowblue-admin.open {
        display: flex;
      }
      .slowblue-admin-tabs {
        display: flex;
        gap: 2px;
        padding: 6px 6px 4px;
        border-bottom: 1px solid rgba(120, 200, 255, 0.16);
      }
      .slowblue-admin-tab {
        flex: 1;
        min-height: 38px;
        border-radius: 6px;
        border: 1px solid rgba(140, 210, 255, 0.16);
        background: transparent;
        color: rgba(190, 226, 245, 0.6);
        font:
          700 10px/1 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.12em;
      }
      .slowblue-admin-tab.on {
        background: rgba(52, 148, 190, 0.32);
        border-color: rgba(160, 226, 255, 0.45);
        color: #eafcff;
      }
      .slowblue-admin-close {
        width: 38px;
        min-height: 38px;
        border-radius: 6px;
        border: 1px solid rgba(140, 210, 255, 0.16);
        background: transparent;
        color: rgba(190, 226, 245, 0.7);
        font-size: 18px;
      }
      .slowblue-admin-status {
        padding: 5px 10px;
        color: rgba(147, 255, 203, 0.75);
        font:
          500 10px/1.4 ui-monospace,
          monospace;
        border-bottom: 1px solid rgba(120, 200, 255, 0.1);
      }
      .slowblue-admin-body {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 6px 6px 24px;
      }
      .slowblue-admin-acts {
        display: flex;
        gap: 4px;
        margin: 4px 0 8px;
      }
      .slowblue-admin-act {
        flex: 1;
        min-height: 34px;
        border-radius: 6px;
        border: 1px solid rgba(140, 210, 255, 0.16);
        background: transparent;
        color: rgba(190, 226, 245, 0.6);
        font:
          700 10px/1 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.1em;
      }

        border-color: rgba(160, 226, 255, 0.42);
        color: #eafcff;
      }
      .slowblue-admin-group {
        margin: 12px 2px 4px;
        color: rgba(182, 225, 246, 0.5);
        font:
          700 9px/1.4 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .slowblue-admin-row {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        align-items: baseline;
        gap: 2px 8px;
        width: 100%;
        min-height: 52px;
        margin-bottom: 3px;
        padding: 8px 10px;
        text-align: left;
        border-radius: 8px;
        border: 1px solid rgba(140, 210, 245, 0.14);
        background: rgba(9, 32, 52, 0.55);
        color: #dcf4ff;
        font: inherit;
      }
      .slowblue-admin-row.compact {
        min-height: 44px;
        padding: 6px 10px;
      }
      .slowblue-admin-row.sound {
        grid-template-columns: 1fr auto;
      }
      .slowblue-admin-row.muted {
        opacity: 0.45;
      }
      .slowblue-admin-row:active {
        background: rgba(52, 148, 190, 0.34);
      }
      .slowblue-admin-index {
        color: rgba(147, 255, 203, 0.8);
        font:
          700 11px/1.3 ui-monospace,
          monospace;
      }
      .slowblue-admin-name {
        font-size: 13px;
        color: #eafcff;
      }
      .slowblue-admin-meta {
        color: rgba(190, 226, 245, 0.55);
        font:
          500 10px/1.3 ui-monospace,
          monospace;
        text-align: right;
      }
      .slowblue-admin-sub {
        grid-column: 2 / -1;
        color: rgba(190, 226, 245, 0.5);
        font-size: 10.5px;
      }
      .slowblue-admin-slider {
        display: grid;
        grid-template-columns: 116px 1fr 34px;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 8px;
        color: rgba(206, 238, 255, 0.75);
      }
      .slowblue-admin-slider input[type='range'] {
        width: 100%;
        accent-color: #58c8ed;
      }
      .slowblue-admin-val {
        text-align: right;
        color: rgba(190, 226, 245, 0.55);
        font:
          500 10px/1 ui-monospace,
          monospace;
      }
      .slowblue-admin-warn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 4px 0;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 190, 120, 0.28);
        color: rgba(255, 214, 160, 0.85);
        font-size: 11px;
      }
      .slowblue-admin-btn {
        min-height: 32px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(255, 190, 120, 0.35);
        background: transparent;
        color: rgba(255, 214, 160, 0.9);
        font:
          600 11px/1 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      .slowblue-admin-tab:focus-visible,
      .slowblue-admin-act:focus-visible,
      .slowblue-admin-row:focus-visible,
      .slowblue-admin-close:focus-visible,
      .slowblue-admin-btn:focus-visible,
      .slowblue-admin-toggle:focus-visible,
      .slowblue-admin-slider input:focus-visible {
        outline: 2px solid #7fdcff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="safe-probe"></div>
    <div id="stage"><canvas id="game"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
