name: Update SDK

# Copies addons/horizon_sdk from a horizOn-SDK-Godot release tag.
# horizOn-SDK-Godot sends the update-sdk dispatch after a release.
# addons/horizon_sdk/horizon_config.tres (API key) is gitignored, so the
# empty config that ships with the SDK is never committed.

on:
  repository_dispatch:
    types: [update-sdk]
  workflow_dispatch:
    inputs:
      version:
        description: SDK version, for example 1.7.2 (empty = latest release)
        required: false

permissions:
  contents: write

env:
  SDK_REPO: ProjectMakersDE/horizOn-SDK-Godot

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SDK release
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view -R "$SDK_REPO" --json tagName -q .tagName)
            VERSION="${VERSION#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SDK version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout example project
        uses: actions/checkout@v4

      - name: Checkout SDK at release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          ref: v${{ steps.sdk.outputs.version }}
          path: sdk-source
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Replace SDK files
        run: |
          rm -rf addons/horizon_sdk
          cp -r sdk-source/addons/horizon_sdk addons/horizon_sdk

      - name: Record and verify complete official SDK provenance
        run: |
          python3 tests/pin_sdk_source.py --sdk-source sdk-source --tag "v${{ steps.sdk.outputs.version }}"
          # Official UID companions must remain tracked despite the project's *.uid ignore rule.
          git add --force addons/horizon_sdk config/official-sdk/horizon_config.tres.example SDK-SOURCE.json
          python3 tests/verify_sdk_source.py --sdk-source sdk-source

      - name: Cleanup
        run: rm -rf sdk-source

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify native import, gameplay and SDK compatibility before committing
        env:
          GODOT_BIN: godot
        run: |
          python3 tests/run_checks.py
          python3 tests/run_feature_lab_checks.py

      - name: Commit and push
        env:
          VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "SDK is already at v${VERSION}"
          else
            git commit -m "chore(sdk): update horizOn SDK to v${VERSION}"
            git push
          fi
