# Builds the self-contained desktop archives for a version tag and publishes
# them as a GitHub Release.
#
# Runs on Windows rather than Linux on purpose: construo cross-builds every
# target by downloading a JDK per platform, and that path is only proven from
# Windows here. The macOS archive it produces has never been launched on a Mac,
# so it ships untested as well as unsigned -- see the release notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # Never publish a build that cannot pass its own tests.
      - name: Check
        shell: bash
        run: ./gradlew core:check lwjgl3:check

      - name: Build distributables
        shell: bash
        run: ./gradlew lwjgl3:packageWinX64 lwjgl3:packageMacM1

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: lwjgl3/build/construo/dist/*.zip
          generate_release_notes: true
          body: |
            Self-contained builds — each bundles its own trimmed JDK, so **no Java
            installation is required**.

            | Platform | File |
            |---|---|
            | Windows (x64) | `Scoundrel-winX64.zip` |
            | macOS (Apple Silicon) | `Scoundrel-macM1.zip` |

            ## Before you download

            **Both builds are unsigned**, so the first launch shows a warning: on Windows
            choose **More info → Run anyway**; on macOS right-click the app and choose
            **Open**.

            **The macOS build has never been launched on a Mac.** It is cross-built on a
            Windows runner from a downloaded macOS JDK — this job proves it packages, not
            that it runs. Treat it as untested rather than merely unsigned. Reports either
            way are welcome.

            There is no mid-game save or resume; a run is a single sitting, by design.

            The full list is under
            [Known limitations](https://github.com/tomerba6/scoundrel-game/blob/main/CHANGELOG.md#known-limitations)
            in the changelog, and
            [CHANGELOG.md](https://github.com/tomerba6/scoundrel-game/blob/main/CHANGELOG.md)
            has what changed.
