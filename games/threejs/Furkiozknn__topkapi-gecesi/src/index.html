<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Topkapı Gecesi</title>
<meta name="description" content="A 3D stealth game at night in an Ottoman palace: put the Spoon-maker's Diamond back before dawn. Claude Game Arena, built by Claude Opus 5.5.">
<style>
/* Dark lacquer and gold filigree: night blue #0B1D3A, moonlight #9DB4FF, lantern #FFB547, gold #C9A227 */
:root{
  --bg:#07122a; --ink:#f4ecda; --ink2:#bcc6de; --gold:#C9A227; --gold2:#e8c75c; --gold3:#f6e2a0; --blue:#9DB4FF; --red:#ff8a80; --green:#8fd07a; --amber:#FFB547;
  --lac:#0b1d3a; --lac2:#081530; --line:rgba(201,162,39,.5); --line2:rgba(201,162,39,.22);
  --lacquer:radial-gradient(130% 90% at 20% -10%,rgba(157,180,255,.13),rgba(157,180,255,0) 55%),linear-gradient(180deg,#112650 0%,#0b1d3a 48%,#081530 100%);
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px); --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;
  touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 95% at 50% 45%,rgba(2,6,18,0) 55%,rgba(2,6,18,.55) 100%)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.serif{font-family:Georgia,"Times New Roman",serif}
svg{display:block}
b,.num{font-variant-numeric:tabular-nums}

/* lacquer surfaces: .glass is the plain lacquer, .lac adds gold filigree corners */
.glass,.lac{background:var(--lacquer);border:1px solid var(--line);border-radius:6px;
  box-shadow:inset 0 0 0 3px rgba(5,12,30,.85),inset 0 0 0 4px var(--line2),0 12px 34px rgba(0,0,0,.5)}
.lac{background:var(--fil-tl) top 3px left 3px/34px 34px no-repeat,var(--fil-tr) top 3px right 3px/34px 34px no-repeat,
  var(--fil-bl) bottom 3px left 3px/34px 34px no-repeat,var(--fil-br) bottom 3px right 3px/34px 34px no-repeat,var(--lacquer)}
.lac.sm{background:var(--fil-tl) top 2px left 2px/20px 20px no-repeat,var(--fil-tr) top 2px right 2px/20px 20px no-repeat,
  var(--fil-bl) bottom 2px left 2px/20px 20px no-repeat,var(--fil-br) bottom 2px right 2px/20px 20px no-repeat,var(--lacquer)}

/* top bar: three lacquer cartouches instead of one glass strip */
.topbar{position:fixed;top:calc(8px + var(--sa-t));left:calc(8px + var(--sa-l));right:calc(8px + var(--sa-r));display:flex;align-items:flex-start;gap:10px;z-index:20;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--gold2);white-space:nowrap;min-height:54px;padding:4px 16px 4px 8px}
.brand svg{width:38px;height:38px}
.brand span{font-size:19px;letter-spacing:.03em;text-shadow:0 1px 0 #000}
.stats{flex:0 1 auto;margin:0 auto;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink2);min-width:0;min-height:54px;padding:6px 28px;border-radius:28px}
.stats b{color:var(--ink);font-weight:700}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st svg{width:20px;height:20px;color:var(--gold2)}
.st b.warn{color:var(--red)}
.sep{width:6px;height:6px;transform:rotate(45deg);background:var(--gold);opacity:.8}
.acts{display:flex;gap:2px;padding:4px}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--gold3);font-weight:700;font-size:13px;letter-spacing:.04em}
.ibtn:hover{background:rgba(201,162,39,.12);border-color:var(--line)}
.ibtn svg{width:22px;height:22px}
.stars{display:inline-flex;gap:3px;vertical-align:middle}
.stars svg{width:20px;height:20px}
.stars svg,.bigstars svg,.mstars svg{fill:transparent;stroke:rgba(232,199,92,.45);stroke-width:1.5}
.stars svg.on,.bigstars svg.on,.mstars svg.on{fill:var(--gold2);stroke:var(--gold3);filter:drop-shadow(0 0 4px rgba(232,199,92,.45))}
.stars svg.lost{stroke:rgba(236,106,94,.75)}
@media (min-width:761px) and (max-width:1020px){.brand span{display:none}.brand{padding:4px 8px}.stats{gap:12px;padding:6px 18px}}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;gap:6px}
  .brand{min-height:48px;padding:4px 8px}
  .brand span{display:none}
  .stats{order:3;flex-basis:100%;gap:10px;font-size:13px;justify-content:space-around;min-height:44px;padding:4px 10px;border-radius:22px}
  .sep{display:none}
  .acts{margin-left:auto}
}

/* objectives (scrollable max-height to prevent landscape clipping) */
.objs{position:fixed;right:calc(8px + var(--sa-r));top:calc(78px + var(--sa-t));width:264px;max-height:50vh;overflow-y:auto;padding:12px 14px 10px;z-index:18;font-size:13.5px}
.objs h4,.vis h4{margin:0 0 6px;font:700 11px Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);text-align:center}
.orow{display:flex;align-items:center;gap:8px;padding:4px 2px;line-height:1.25}
.orow svg{width:20px;height:20px;flex:0 0 20px;color:var(--ink2)}
.orow.done{opacity:.6}.orow.done svg{color:var(--green)}
.orow.act{color:var(--ink)}.orow.act svg{color:var(--gold2)}
.orow.opt{border-top:1px solid var(--line2);margin-top:2px;padding-top:6px;color:var(--ink2)}
.orow.fail{opacity:.55}.orow.fail svg{color:var(--red)}
@media (max-width:760px){.objs{top:calc(116px + var(--sa-t));width:min(58vw,240px);font-size:13px;padding:8px 10px}.objs h4{display:none}.orow:not(.act){display:none}}
@media (max-height:520px){.objs{top:calc(70px + var(--sa-t));width:220px;font-size:12.5px;padding:8px 10px}.objs h4{display:none}.orow:not(.act){display:none}}

/* detection meter: an almond eye whose lids open with how visible you are */
.vis{position:fixed;left:calc(8px + var(--sa-l));bottom:calc(8px + var(--sa-b));padding:10px 14px 10px;z-index:19;width:244px}
.eyerow{display:flex;align-items:center;gap:10px}
.eye{width:92px;height:50px;flex:0 0 92px;overflow:visible;transition:filter .2s}
.eye .lid{transition:transform .14s ease-out}
.eye #eye-iris{transition:fill .2s}
.vis.lit .eye{filter:drop-shadow(0 0 7px rgba(255,181,71,.75))}
.vis.hid .eye{filter:drop-shadow(0 0 5px rgba(143,208,122,.5))}
.vtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.vtext b{font:700 16px Georgia,serif;color:var(--ink)}
.vis.lit .vtext b{color:var(--amber)} .vis.hid .vtext b{color:var(--green)}
.vtext span{font-size:13px;color:var(--ink2)}
.tools{display:flex;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line2);font-size:13px;color:var(--ink2);align-items:center}
.tools span{display:inline-flex;align-items:center;gap:5px}
.tools svg{width:18px;height:18px;color:var(--gold2)}
.dashbar{width:40px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;display:inline-block;box-shadow:inset 0 0 0 1px var(--line2)}
.dashbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold3))}
@media (max-width:760px){.vis{width:200px;padding:8px 10px;bottom:calc(150px + var(--sa-b))}.eye{width:70px;height:38px;flex-basis:70px}.tools{gap:8px}.vtext b{font-size:15px}}
@media (max-height:520px) and (pointer:coarse){.vis{bottom:calc(8px + var(--sa-b));left:calc(170px + var(--sa-l));width:196px;padding:8px 10px}.eye{width:70px;height:38px;flex-basis:70px}.vtext b{font-size:15px}}
/* phone landscape: compact objectives (below the measured top bar, --tbh set from JS) and a compact meter that stays
   between the stick (left, ~150px) and the button grid (right, ~218px) */
@media (max-height:500px) and (orientation:landscape){
  .objs{top:calc(var(--tbh, calc(70px + var(--sa-t))) + 6px);width:min(210px,34vw);max-height:calc(100vh - var(--tbh, 70px) - 170px - var(--sa-b));overflow-y:auto;font-size:12px;padding:5px 8px}
  .objs .orow{padding:2px}
  .vis{left:calc(158px + var(--sa-l));bottom:calc(6px + var(--sa-b));width:auto;max-width:calc(100vw - 384px - var(--sa-l) - var(--sa-r));padding:5px 8px}
  .vis h4{display:none}
  .eye{width:52px;height:28px;flex-basis:52px}
  .eyerow{gap:6px}.vtext b{font-size:13.5px}.vtext span{font-size:11.5px}
  .tools{gap:8px;margin-top:4px;padding-top:4px;font-size:12px}
}
/* phone portrait: the top bar wraps to two (sometimes three) rows, so drop the objectives below its measured bottom */
@media (max-width:760px) and (orientation:portrait){.objs{top:calc(var(--tbh, calc(116px + var(--sa-t))) + 8px)}}

/* interaction prompt, note card, toasts */
.prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--sa-b));padding:9px 18px;font-size:15px;font-weight:600;z-index:19;display:flex;align-items:center;gap:10px;pointer-events:none;border-radius:24px}
.prompt kbd{font:700 13px ui-monospace,Consolas,monospace;border:1px solid var(--gold);border-radius:5px;padding:2px 8px;color:var(--gold3);background:rgba(201,162,39,.12)}
@media (pointer:coarse){.prompt kbd{display:none}.prompt{bottom:calc(190px + var(--sa-b))}}
@media (pointer:coarse) and (max-width:760px){.prompt{bottom:calc(272px + var(--sa-b))}}
.note{position:fixed;left:50%;bottom:calc(84px + var(--sa-b));transform:translateX(-50%) rotate(-1deg);width:min(92vw,440px);padding:16px 22px 14px;z-index:24;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,#f8ecd0,#e6cd98);color:#3a2614;border-radius:4px;box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 0 30px rgba(140,90,30,.25);border:1px solid #b8913f;animation:nin .35s ease-out;font-family:Georgia,serif}
.note::after{content:'';position:absolute;right:16px;top:-12px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d9483a,#8a1a14 70%);box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 0 0 3px rgba(255,255,255,.12)}
.note h5{margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#7a4a1a}
.note p{margin:0;font-size:16px;line-height:1.45}
@keyframes nin{from{opacity:0;transform:translateX(-50%) translateY(16px) rotate(2deg)}}
@media (pointer:coarse){.note{bottom:calc(230px + var(--sa-b))}}
@media (pointer:coarse) and (max-width:760px){.note{bottom:calc(318px + var(--sa-b))}}
.toasts{position:fixed;top:calc(80px + var(--sa-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:25;pointer-events:none;width:max-content;max-width:min(92vw,520px)}
@media (max-width:760px){.toasts{top:calc(122px + var(--sa-t));left:calc(8px + var(--sa-l));transform:none;align-items:flex-start;max-width:calc(100vw - 260px)}}
.toast{padding:8px 16px 8px 14px;border-radius:20px;font-weight:600;font-size:14.5px;animation:tin .22s ease-out;text-align:center;display:flex;align-items:center;gap:10px}
.toast::before{content:'';flex:0 0 8px;width:8px;height:8px;transform:rotate(45deg);background:var(--gold2);box-shadow:0 0 6px rgba(232,199,92,.6)}
.toast.good::before{background:var(--green);box-shadow:0 0 6px rgba(143,208,122,.6)} .toast.bad::before{background:var(--red);box-shadow:0 0 6px rgba(236,106,94,.6)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (max-width:760px){.toast{font-size:13.5px;padding:6px 12px;text-align:left}}

/* touch controls */
.touch{position:fixed;inset:auto 0 0 0;height:0;z-index:21}
.stick{position:fixed;left:calc(18px + var(--sa-l));bottom:calc(18px + var(--sa-b));width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(11,29,58,.35),rgba(11,29,58,.7));border:1px solid var(--line);box-shadow:inset 0 0 0 5px rgba(5,12,30,.6),inset 0 0 0 6px var(--line2);touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f0d27a,#a8811a);border:2px solid var(--gold3);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.tbtns{position:fixed;right:calc(14px + var(--sa-r));bottom:calc(16px + var(--sa-b));display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:8px}
.tb{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--lacquer);box-shadow:inset 0 0 0 3px rgba(5,12,30,.8),inset 0 0 0 4px var(--line2),0 4px 12px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink);touch-action:none;padding:0}
.tb svg{width:24px;height:24px;color:var(--gold2)}
.tb.on{background:radial-gradient(circle at 40% 35%,#6a5418,#2a2008);border-color:var(--gold3)}
.tb.big{border-color:var(--gold2);box-shadow:inset 0 0 0 3px rgba(5,12,30,.8),inset 0 0 0 4px rgba(232,199,92,.55),0 4px 12px rgba(0,0,0,.45)}

/* overlays */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,10,26,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:30;padding:12px;overflow:auto}
.overlay.clear{background:rgba(4,10,26,.15);backdrop-filter:none;-webkit-backdrop-filter:none}
.panel{padding:24px 28px;width:min(94vw,470px);max-height:calc(100vh - 24px);overflow:auto}
.panel.wide{width:min(96vw,960px)}
.panel h2{margin:0 0 14px;font-size:25px;color:var(--gold2);font-family:Georgia,serif;font-weight:700;letter-spacing:.02em;text-align:center}
.panel h2::after{content:'';display:block;height:12px;margin:8px auto 0;width:min(100%,220px);background:var(--divider) center/contain no-repeat}
.rhead h2,.endbox h2{text-align:left}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{min-height:46px;padding:0 20px;border-radius:5px;border:1px solid var(--line);background:linear-gradient(180deg,#16305e,#0c1c3a);color:var(--ink);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 2px rgba(5,12,30,.6);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--gold2);background:linear-gradient(180deg,#1d3a70,#10244a)}
.btn:active{transform:translateY(1px)}
.btn svg{width:20px;height:20px;color:var(--gold2)}
.btn.primary{background:linear-gradient(180deg,#f6dc8a 0%,#d4ae3a 42%,#a8811a 100%);border-color:var(--gold3);color:#1d1304;text-shadow:0 1px 0 rgba(255,240,200,.55);
  box-shadow:inset 0 0 0 2px rgba(120,80,10,.35),inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px rgba(201,162,39,.22)}
.btn.primary svg{color:#1d1304}
.btn.primary:hover{background:linear-gradient(180deg,#fae6a4 0%,#e0bc48 42%,#b88e20 100%)}
.btn:disabled{opacity:.45;cursor:default}
.btn.w{width:100%}
label.sl{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
label.sl span{width:96px}
input[type=range]{flex:1;accent-color:var(--gold);height:44px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:rgba(5,12,30,.5)}
.seg button{min-height:44px;min-width:64px;padding:0 14px;border:0;background:transparent;font-weight:700}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:linear-gradient(180deg,#f0d27a,#c9a227);color:#1d1304}
.lbl{width:96px;font-size:14px;color:var(--ink2)}
.footer{margin-top:16px;font-size:12.5px;color:var(--ink2);text-align:center}
.footer a{color:var(--gold2);text-decoration:none}
.footer a:hover{text-decoration:underline}

/* title: the card sits to the left so the moonlit palace stays visible */
#title{justify-content:flex-start;padding-left:max(5vw,16px);background:linear-gradient(90deg,rgba(3,8,22,.72) 0%,rgba(3,8,22,.38) 42%,rgba(3,8,22,0) 68%);backdrop-filter:none;-webkit-backdrop-filter:none}
.title{text-align:center;width:min(94vw,470px)}
.title .logo{width:120px;height:120px;margin:0 auto 6px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
.title h1{margin:0;font-size:48px;letter-spacing:.02em;line-height:1.05;font-family:Georgia,serif;
  background:linear-gradient(180deg,#fff4c8 0%,#e8c75c 48%,#b08a22 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(201,162,39,.35))}
.title .sub{margin:4px 0 6px;color:var(--blue);font:italic 16px Georgia,serif}
.title .orn{height:14px;margin:4px auto 10px;width:240px;background:var(--divider) center/contain no-repeat}
.title .how{font-size:14px;color:var(--ink2);margin:0 0 16px;line-height:1.55}
.title .best{font-size:14px;margin:14px 0 0;color:var(--ink)}
#loadmsg{color:var(--ink2);font-size:14px;margin:6px 0;min-height:18px}
@media (max-width:760px){#title{justify-content:center;padding-left:12px;background:rgba(3,8,22,.45)}}
@media (max-height:640px){.title .logo{width:76px;height:76px}.title h1{font-size:36px}.title .how{display:none}}

/* palace map */
.mapwrap{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media (max-width:780px){.mapwrap{grid-template-columns:1fr}}
.pmap{position:relative;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:#0b1d3a;box-shadow:inset 0 0 0 3px rgba(5,12,30,.7)}
.pmap svg{width:100%;height:auto}
.mnode{cursor:pointer}
.mnode circle.c{fill:#0b1d3a;stroke:var(--gold);stroke-width:2}
.mnode.done circle.c{fill:#1c3a2a;stroke:var(--green)}
.mnode.sel circle.c{fill:var(--gold2);stroke:#fff6d0;stroke-width:3}
.mnode.sel text{fill:#1c1405}
.mnode.lock{opacity:.45;cursor:default}
.mnode text{fill:var(--ink);font:700 15px Georgia,serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mnode:focus-visible circle.c{stroke:#fff;stroke-width:4}
.brief h3{margin:0;font-size:22px;font-family:Georgia,serif;color:var(--ink)}
.brief .part{font:700 12px Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
.brief p{font-size:14.5px;line-height:1.55;color:var(--ink2);margin:8px 0}
.brief ul{margin:0 0 10px;padding:10px 0 0;list-style:none;font-size:14px;border-top:1px solid var(--line2)}
.brief li{display:flex;gap:8px;align-items:center;padding:3px 0}
.brief li svg{width:20px;height:20px;flex:0 0 20px;color:var(--gold2)}
.mstars{display:inline-flex;gap:2px}
.mstars svg{width:16px;height:16px}
/* responsive mission grid so buttons never crush below 44px */
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:4px;margin-top:8px}
.mlist button{min-height:44px;border-radius:4px;border:1px solid var(--line2);background:rgba(5,12,30,.5);font:700 15px Georgia,serif;padding:0}
.mlist button.sel{background:linear-gradient(180deg,#f0d27a,#c9a227);color:#1c1405;border-color:var(--gold3)}
.mlist button:disabled{opacity:.55;color:var(--ink2)}

/* result + end */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sa-b));width:min(96vw,600px);z-index:30}
.sheet .panel{width:100%;padding:18px 22px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rhead h2{margin:0;font-size:25px}
.rhead h2::after{display:none}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:34px;height:34px}
.rsub{font-size:14px;color:var(--ink2);margin:4px 0 8px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.kv div{padding:8px;border-radius:4px;background:rgba(5,12,30,.45);border:1px solid var(--line2);text-align:center}
.kv b{display:block;font:700 20px Georgia,serif;color:var(--gold2)}
.kv span{font-size:12px;color:var(--ink2)}
.slist{font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:4px;margin:4px 0 10px}
.slist div{display:flex;gap:8px;align-items:center}
.slist svg{width:18px;height:18px;flex:0 0 18px}
.slist .y{color:var(--ink)} .slist .y svg{color:var(--green)} .slist .n svg{color:var(--red)}
.rec{color:var(--green);font-weight:700;text-align:center;margin:4px 0}
@media (max-width:760px){.kv{grid-template-columns:1fr 1fr}}
.endbox{position:fixed;left:50%;bottom:calc(16px + var(--sa-b));transform:translateX(-50%);width:min(96vw,620px);z-index:31;text-align:center}
.endbox h2{font-size:34px;margin:0 0 6px;text-align:center}
.endbox p{color:var(--ink);line-height:1.55;margin:6px 0 12px;font-size:15px}
.fade{position:fixed;inset:0;background:#05070f;opacity:0;pointer-events:none;z-index:28;transition:opacity .5s}
.fade.on{opacity:.85}
.redflash{position:fixed;inset:0;pointer-events:none;z-index:17;box-shadow:inset 0 0 120px 30px rgba(226,60,50,0);transition:box-shadow .25s}
.redflash.on{box-shadow:inset 0 0 140px 40px rgba(226,60,50,.45)}
.redflash.sus{box-shadow:inset 0 0 120px 26px rgba(255,181,71,.28)}

/* a11y: disable transitions & animations under reduced motion */
@media (prefers-reduced-motion: reduce){
  .fade, .redflash { transition: none !important; }
  .note { animation: none !important; }
}

#dbg{position:fixed;left:8px;top:calc(70px + var(--sa-t));font:12px/1.4 ui-monospace,Consolas,monospace;color:#9f9;background:rgba(0,0,0,.65);padding:6px 8px;white-space:pre;pointer-events:none;z-index:60;border-radius:6px;max-width:92vw;overflow:hidden}
#dbg .err{color:#f66}

// ---------------------------------------------------------------------------
// Level parsing, light, line of sight
// ---------------------------------------------------------------------------
function parse(D, idx) {
  const rows = D.map, h = rows.length, w = rows[0].length, N = w * h;
  const L = { idx, D, w, h, N, ch: new Array(N), solid: new Uint8Array(N), tall: new Uint8Array(N), gwalk: new Uint8Array(N),
    floor: new Array(N).fill(null), moon: new Float32Array(N), vaseAt: new Int16Array(N).fill(-1), hideAt: new Int16Array(N).fill(-1),
    lights: [], hides: [], vases: [], items: [], cps: [], water: [], start: null, exit: null, pedestal: null, part: D.part };
  const cx = c => (c + 0.5) * CELL;
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const i = r * w + c, ch = rows[r][c] || ' ', T = TILE[ch] || TILE['.'];
    L.ch[i] = ch; L.solid[i] = T.solid; L.tall[i] = T.tall; L.floor[i] = T.floor;
    const x = cx(c), z = cx(r);
    if (T.light) { const LD = LIGHT[T.light]; L.lights.push({ i, x, z, kind: T.light, r: LD.r, str: LD.str, snuff: LD.snuff }); }
    if (T.hide) { L.hideAt[i] = L.hides.length; L.hides.push({ i, x, z, kind: T.hide }); }
    if (T.vase) { L.vaseAt[i] = L.vases.length; L.vases.push({ i, x, z }); }
    if (T.cp) L.cps.push({ i, x, z });
    if (T.water) L.water.push(i);
    if (ch === 'P') L.start = { i, x, z };
    if (ch === 'X') L.exit = { i, x, z };
    if (ch === '^') L.pedestal = { i, x, z };
    if (ch === '!') L.items.push({ i, x, z, kind: 'clue', n: L.items.filter(o => o.kind === 'clue').length });
    if (ch === 'b') L.items.push({ i, x, z, kind: 'bulb' });
    if (ch === 'n') L.items.push({ i, x, z, kind: 'letter' });
  }
  // cells without their own floor (props, items, start) take the most common neighbour floor
  const def0 = D.part === 0 ? 'stone' : D.part === 1 ? 'carpet' : 'marble';

    case 'play': AUTO.t = 0.5; break;
    case 'result': {
      AUTO.t = 0.8; const R = G.S.result;
      BOTLOG.push({ m: G.idx + 1, ok: R.ok, t: +R.time.toFixed(1), stars: R.stars.map(Number).join(''), alerts: R.alerts, caught: R.caught, plans: G.bot ? G.bot.plans : 0 });
      if (R.ok) { if (G.idx >= NM - 1) openEnd(); else nextMission(); }
      else if (++AUTO.tries < 3) startMission(G.idx); else openEnd();
      break;
    }
    case 'end': AUTO.done = true; break;
  }
}

// ---------------------------------------------------------------------------
// Update loop, debug, state export
// ---------------------------------------------------------------------------
function update(dt) {
  G.time += dt;
  if (FLAG.auto && G.ready) autoUpdate(dt);
  const S = G.S; if (!S) return;
  if (G.screen === 'play' && !G.paused) {
    G.acc += dt * (G.simming ? 1 : G.speed); let n = 0;
    while (G.acc >= C.DT && n < 12) {
      const I = G.bot ? C.botInput(S, G.bot) : readInput(S);
      C.step(S, I); handleEvents(S); G.acc -= C.DT; n++;
      if (S.over) break;
    }
    if (n >= 12) G.acc = 0;
    if (S.over) { G.resultT += dt; if (G.resultT > 1.4) showResult(); }
  } else if (G.screen === 'title' || G.screen === 'map' || G.screen === 'end') {
    // the palace keeps breathing behind the menus: guards patrol, nobody is there to see
    G.acc += dt; let n = 0; const I0 = { mx: 0, mz: 0 };
    while (G.acc >= C.DT && n < 4) { S.respawnT = 1; C.step(S, I0); S.events.length = 0; G.acc -= C.DT; n++; }
    if (S.t > 200) { S.t = 0; }
  }
}
if (FLAG.debug) {
  $('dbg').hidden = false;
  try { const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info'); DBG.gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'unknown'; } catch (e) { DBG.gpu = '?'; }
}
window.topkapi = {};
function exportState() {
  const S = G.S;
  Object.assign(window.topkapi, {
    screen: G.screen, mission: G.screen === 'play' || G.screen === 'result' ? G.idx + 1 : 0, paused: G.paused, time: S ? +S.t.toFixed(1) : 0,
    player: S ? { x: +S.p.x.toFixed(2), z: +S.p.z.toFixed(2), vis: +S.p.vis.toFixed(2), gait: S.p.gait, hidden: S.p.hidden >= 0, pebbles: S.pebbles } : null,
    guards: S ? S.guards.map(g => ({ type: g.type, state: g.state, sus: +g.sus.toFixed(2) })) : [], clues: S ? S.clues + '/' + S.need : '',
    result: S && S.result ? { ok: S.result.ok, time: +S.result.time.toFixed(1), stars: S.result.stars } : null,
    stars: Array.from({ length: NM }, (_, i) => starsOf(i)), totalStars: totalStars(), done: Array.from({ length: NM }, (_, i) => !!PROG.done[i]),
    bot: { auto: FLAG.auto, done: AUTO.done, log: BOTLOG.slice() }, fps: DBG.fps, drawCalls: DBG.calls, triangles: DBG.tris, gpu: DBG.gpu,
    errors: window.__errs.slice(), assets: ASSETS, quality: SET.quality, lang: SET.lang,
  });
}
window.topkapiSim = (seconds) => {
  G.simming = true; const n = Math.round(seconds * 60);
  for (let i = 0; i < n; i++) { update(1 / 60); if (FLAG.auto && AUTO.done) break; }
  G.simming = false; exportState(); return window.topkapi;
};
window.topkapiDebug = { G, C, startMission, openMap, openEnd, showResult, togglePause, openSettings, setQuality, PROG, toTitle, WORLD, CAM };
function debugText() {
  const e = window.__errs, S = G.S;
  $('dbg').innerHTML = `fps ${DBG.fps}  calls ${DBG.calls}  tris ${DBG.tris}\n${DBG.gpu}\nscreen ${G.screen}  mission ${G.screen === 'play' ? G.idx + 1 : '-'}  t ${S ? S.t.toFixed(0) : 0}  vis ${S ? S.p.vis.toFixed(2) : 0}\nbot ${FLAG.auto ? BOTLOG.length + ' runs' : 'off'} ${AUTO.done ? 'DONE' : ''}  stars ${totalStars()}` +
    (e.length ? `\n<span class="err">${e.slice(-4).map(s => String(s).replace(/</g, '&lt;')).join('\n')}</span>` : '\nerrors 0');
}

// boot
buildSurroundings();
applySky('night', 0);
setTitleScene();
if (SET.quality === 'low') setQuality('low');
applyTexts(); auVolumes();
hideAll(); show('title', true);
function ready() {
  if (G.ready) return; G.ready = true; $('loadmsg').textContent = ''; $('b-play').disabled = false;
  if (FLAG.mission >= 1 && FLAG.mission <= NM && !FLAG.auto) startMission(FLAG.mission - 1);
  else if (FLAG.screen === 'map') openMap(); else if (FLAG.screen === 'end') openEnd();
  if (FLAG.sim > 0) window.topkapiSim(FLAG.sim);
  if (!FLAG.auto && G.screen === 'title') $('b-play').focus();
}
$('loadmsg').textContent = t('loading', { n: 1, m: 2 });
try { renderer.compileAsync(scene, camera).then(() => { $('loadmsg').textContent = t('loading', { n: 2, m: 2 }); setTimeout(ready, 120); }, ready); } catch (e) { ready(); }
setTimeout(ready, 6000);
window.__loaded = true;
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.hidden) return;
  update(dt);
  render(dt);
  updateHUD(dt);
  updateAudio(dt);
  DBG.frames++; DBG.ft += dt; if (DBG.ft >= 0.5) { DBG.fps = Math.round(DBG.frames / DBG.ft); DBG.frames = 0; DBG.ft = 0; exportState(); if (FLAG.debug) debugText(); }
}
requestAnimationFrame(frame);
</script>
</body>
