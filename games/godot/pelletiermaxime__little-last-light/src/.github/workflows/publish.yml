name: Build and publish game

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an active publication before starting another one.
concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore Godot and export templates
        id: godot-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}-release-v1

      - name: Install Godot and matching export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -O "$base/$editor"
          curl --fail --location --retry 3 -O "$base/$templates"
          curl --fail --location --retry 3 -O "$base/SHA512-SUMS.txt"
          # Verify both downloads against the official release checksums.
          grep -F " $editor" SHA512-SUMS.txt | sha512sum --check --strict
          grep -F " $templates" SHA512-SUMS.txt | sha512sum --check --strict
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates"
          unzip -q "$editor" -d godot-editor
          install -m 755 "godot-editor/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          unzip -q "$templates" \
            templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe \
            templates/web_nothreads_release.zip \
            -d godot-templates
          mv godot-templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Add Godot to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check release versioning
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'

      - name: Import and export all platforms
        id: version
        env:
          LEADERBOARD_API_URL: ${{ vars.LEADERBOARD_API_URL }}
          LEADERBOARD_SITE_URL: ${{ vars.LEADERBOARD_SITE_URL }}
        run: bash scripts/build-release.sh

      - name: Upload desktop downloads
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-downloads
          path: export/downloads/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload release metadata
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-metadata
          path: export/release/
          if-no-files-found: error

      - name: Upload web build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-build
          path: export/web
          include-hidden-files: true
          if-no-files-found: error

  leaderboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: leaderboard/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: leaderboard
      - run: pnpm check
        working-directory: leaderboard
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: leaderboard
      - run: pnpm test:browser
        working-directory: leaderboard

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, leaderboard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: desktop-downloads
          path: downloads

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-metadata
          path: metadata

      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" downloads/* --clobber
            # Preserve editorial corrections to already published notes.
          else
            gh release create "$tag" downloads/* \
              --target "$COMMIT" \
              --title "$tag" \
              --notes-file metadata/notes.md \
              --latest
          fi

  record-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-metadata
          path: metadata

      - name: Record published version and changelog on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          published_at="$(gh release view "$RELEASE_TAG" --json publishedAt --jq .publishedAt)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Recompute against fresh main if another merge wins the push race.
          # Only this disposable runner checkout is reset; main is never force-pushed.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/prepare-release.py --record-published metadata/publication.json --published-at "$published_at"
            git add project.godot CHANGELOG.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore(release): record $RELEASE_TAG [skip ci]"
            # GITHUB_TOKEN pushes do not trigger another workflow run.
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not record release metadata on main after three attempts.' >&2
          exit 1

  itch:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ITCH_TARGET != ''
    needs: [build, leaderboard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-build
          path: web-build

      - name: Check itch.io configuration and web export
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo '::error::Set the BUTLER_API_KEY Actions secret before enabling ITCH_TARGET.'
            exit 1
          fi
          test -s web-build/index.html
          test -s web-build/index.wasm
          test -s web-build/index.pck

      - name: Install Butler
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" version

      - name: Publish browser build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/butler/butler" push web-build "$ITCH_TARGET:html5" \
            --userversion "$RELEASE_VERSION"

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, leaderboard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: https://pelletiermaxime.github.io/little-last-light-demo/
    steps:
      - name: Check out public demo repository
        uses: actions/checkout@v7.0.1
        with:
          repository: pelletiermaxime/little-last-light-demo
          ref: main
          path: site
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}

      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-build
          path: web-build

      - name: Publish web export to the public demo
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          test -s web-build/index.html
          test -s web-build/index.wasm
          test -s web-build/index.pck
          rsync -a --delete --exclude='.git/' --exclude='README.md' web-build/ site/
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Deploy $RELEASE_TAG"
            git push origin main
          fi
