name: Build Releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pygame pyinstaller Pillow

      - name: Convert icon to icns
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Write PyInstaller spec
        run: |
          cat > GamesCollection.spec << 'SPEC'
          # -*- mode: python ; coding: utf-8 -*-
          import glob
          datas = [(f, '.') for f in glob.glob('*.py')]
          datas += [(f, '.') for f in glob.glob('*.txt')]
          datas.append(('icon.png', '.'))
          datas.append(('icon.bmp', '.'))
          datas.append(('app.manifest', '.'))
          a = Analysis(['menu.py'], pathex=[], binaries=[],
              datas=datas, hiddenimports=['pygame', 'game_runtime', 'highscores'],
              hookspath=[], runtime_hooks=[], excludes=[])
          pyz = PYZ(a.pure)
          exe = EXE(pyz, a.scripts, [], exclude_binaries=True,
              name='GamesCollection', icon='icon.icns',
              console=False, windowed=True)
          coll = COLLECT(exe, a.binaries, a.zipfiles, a.datas,
              name='GamesCollection')
          app = BUNDLE(coll, name='GamesCollection.app',
              icon='icon.icns',
              bundle_identifier='com.scottvedder.gamescollection')
          SPEC

      - name: Create icon.bmp for pygame window icon
        run: sips -s format bmp icon.png --out icon.bmp

      - name: Build Mac app
        run: pyinstaller GamesCollection.spec

      - name: Create DMG background
        run: |
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          W, H = 600, 400
          # Mid-blue background — dark enough to look good, light enough for icons
          img  = Image.new('RGB', (W, H), (45, 50, 90))
          draw = ImageDraw.Draw(img)
          # Subtle grid dots for texture
          for x in range(0, W, 30):
              for y in range(0, H, 30):
                  draw.ellipse((x-1, y-1, x+1, y+1), fill=(60, 66, 110))
          # Arrow pointing from app icon (x=150) to Applications (x=450)
          ax, ay = 290, 195
          draw.polygon([(ax,ay-12),(ax+60,ay),(ax,ay+12),(ax+10,ay+4),
                         (ax+10,ay+4),(ax+10,ay-4),(ax,ay-12)],
                       fill=(100, 160, 255))
          # "Drag to Applications" text below arrow
          font = ImageDraw.ImageDraw
          draw.text((230, 225), "Drag to Applications", fill=(160, 190, 255))
          img.save('dmg_background.png')
          PYEOF

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg             --volname "Games Collection"             --volicon "icon.icns"             --window-pos 200 120             --window-size 600 400             --icon-size 128             --icon "GamesCollection.app" 150 185             --hide-extension "GamesCollection.app"             --app-drop-link 450 185             --background "dmg_background.png"             "Games-Collection.dmg"             "dist/GamesCollection.app"

      - name: Upload Mac release asset
        uses: softprops/action-gh-release@v2
        with:
          files: Games-Collection.dmg

  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pygame pyinstaller Pillow

      - name: Write PyInstaller spec
        shell: python
        run: |
          import glob
          datas = [(f, '.') for f in glob.glob('*.py')]
          datas += [(f, '.') for f in glob.glob('*.txt')]
          datas.append(('icon.png', '.'))
          datas.append(('icon.bmp', '.'))
          datas.append(('app.manifest', '.'))
          datas_str = repr(datas)
          spec = f"""# -*- mode: python ; coding: utf-8 -*-
          a = Analysis(['menu.py'], pathex=[], binaries=[],
              datas={datas_str}, hiddenimports=['pygame', 'game_runtime', 'highscores'],
              hookspath=[], runtime_hooks=[], excludes=[])
          pyz = PYZ(a.pure)
          exe = EXE(pyz, a.scripts, [], exclude_binaries=True,
              name='GamesCollection', icon='icon.png',
              console=False, windowed=True,
              manifest='app.manifest')
          coll = COLLECT(exe, a.binaries, a.zipfiles, a.datas,
              name='GamesCollection')
          """
          open('GamesCollection.spec', 'w').write(spec)

      - name: Create icon.bmp for pygame window icon
        shell: python
        run: |
          from PIL import Image
          Image.open("icon.png").convert("RGB").save("icon.bmp")

      - name: Build Windows app
        run: pyinstaller GamesCollection.spec

      - name: Install NSIS
        run: |
          choco install nsis -y
          # Refresh PATH so makensis is found in subsequent steps
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Convert icon to ico
        shell: python
        run: |
          from PIL import Image
          img = Image.open('icon.png').convert('RGBA')
          # Create ico with multiple sizes for best Windows display
          sizes = [(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]
          imgs  = [img.resize(s, Image.LANCZOS) for s in sizes]
          imgs[0].save('icon.ico', format='ICO', sizes=sizes,
                       append_images=imgs[1:])
          print("icon.ico created")

      - name: Write NSIS installer script
        shell: python
        run: |
          # Read version from tag (e.g. v1.0 -> 1.0)
          import os
          tag = os.environ.get('GITHUB_REF_NAME', 'v1.0')
          version = tag.lstrip('v')
          nsis = f"""
          !include "MUI2.nsh"

          Name "Games Collection"
          OutFile "GamesCollection-setup.exe"
          InstallDir "$PROGRAMFILES64\\GamesCollection"
          InstallDirRegKey HKLM "Software\\GamesCollection" "Install_Dir"
          RequestExecutionLevel admin

          !define MUI_ABORTWARNING
          !define MUI_ICON "icon.ico"
          !define MUI_UNICON "icon.ico"

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES

          !insertmacro MUI_LANGUAGE "English"

          VIProductVersion "{version}.0.0"
          VIAddVersionKey "ProductName" "Games Collection"
          VIAddVersionKey "FileDescription" "Games Collection Installer"
          VIAddVersionKey "FileVersion" "{version}"

          Section "Games Collection" SecMain
            SetOutPath "$INSTDIR"
            File /r "dist\\GamesCollection\\*.*"
            WriteRegStr HKLM "Software\\GamesCollection" "Install_Dir" "$INSTDIR"
            WriteUninstaller "$INSTDIR\\Uninstall.exe"
            CreateDirectory "$SMPROGRAMS\\Games Collection"
            CreateShortcut "$SMPROGRAMS\\Games Collection\\Games Collection.lnk" "$INSTDIR\\GamesCollection.exe"
            CreateShortcut "$SMPROGRAMS\\Games Collection\\Uninstall.lnk" "$INSTDIR\\Uninstall.exe"
            CreateShortcut "$DESKTOP\\Games Collection.lnk" "$INSTDIR\\GamesCollection.exe"
          SectionEnd

          Section "Uninstall"
            Delete "$INSTDIR\\Uninstall.exe"
            RMDir /r "$INSTDIR"
            Delete "$SMPROGRAMS\\Games Collection\\Games Collection.lnk"
            Delete "$SMPROGRAMS\\Games Collection\\Uninstall.lnk"
            RMDir "$SMPROGRAMS\\Games Collection"
            Delete "$DESKTOP\\Games Collection.lnk"
            DeleteRegKey HKLM "Software\\GamesCollection"
          SectionEnd
          """
          open('installer.nsi', 'w').write(nsis)
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Build installer
        run: |
          # Use full path as fallback in case PATH refresh didn't take
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsis) {
            & $nsis installer.nsi
          } else {
            makensis installer.nsi
          }

      - name: Upload Windows installer
        uses: softprops/action-gh-release@v2
        with:
          files: GamesCollection-setup.exe
