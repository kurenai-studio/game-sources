@font-face { font-family: 'Patrick Hand'; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/patrickhand-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Patrick Hand'; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/patrickhand-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  --accent: #B84F10; --accent-hi: #D2641C; --gold: #E6C27A; --cream: #FAF3E6; --ink: #FAF3E6; --ink-dim: #E4D8C0; --ink-mute: #C2B79F;
  --board: #26332D; --board-hi: #31423A; --wood: #8A5A2B; --wood-d: #4A2E18; --paper: #FBF5E8;
  --tint1: rgba(250, 243, 230, 0.07); --tint2: rgba(250, 243, 230, 0.12); --tint3: rgba(250, 243, 230, 0.2);
  --glass: var(--board); --line: rgba(250, 243, 230, 0.2); --star-off: rgba(250, 243, 230, 0.22);
  --good: #9ED67A; --bad: #FF8C73; --info: #E6C27A; --radius: 12px; --hudH: 56px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; --display: 'Patrick Hand', 'Segoe Print', 'Comic Sans MS', cursive;
  --mono: ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2A150C; color: var(--ink); font-family: var(--font); -webkit-tap-highlight-color: transparent; }
body { touch-action: none; user-select: none; -webkit-user-select: none; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
button, select, input { font: inherit; color: inherit; }
svg[viewBox] { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
svg.arrow { width: 12px; height: 12px; }
.hidden { display: none !important; }

/* chalkboard: the default surface of every menu, with a wooden frame */
.glass {
  background:
    radial-gradient(90px 40px at 18% 12%, rgba(255, 255, 255, .05), transparent 70%),
    radial-gradient(140px 60px at 80% 88%, rgba(255, 255, 255, .04), transparent 70%),
    linear-gradient(160deg, var(--board-hi), var(--board) 55%, #1F2B26);
  border: 4px solid var(--wood); border-radius: var(--radius);
  box-shadow: 0 0 0 2px var(--wood-d), inset 0 0 0 2px rgba(0, 0, 0, .35), inset 0 0 36px rgba(0, 0, 0, .35), 0 12px 26px rgba(20, 8, 2, .5);
}
/* baker paper: receipts and notes, torn zig-zag bottom edge */
.glass.paper {
  --ink: #3B2412; --ink-dim: #5A4029; --ink-mute: #7A5F42; --gold: #8A4A0C; --line: rgba(59, 36, 18, .22); --good: #2F6B2A; --bad: #A62B17; --info: #8A4A0C;
  --tint1: rgba(59, 36, 18, .06); --tint2: rgba(59, 36, 18, .1); --tint3: rgba(59, 36, 18, .18); --star-off: rgba(59, 36, 18, .18);
  color: var(--ink); border: 0; border-radius: 6px 6px 0 0;
  background: repeating-linear-gradient(0deg, transparent 0 27px, rgba(44, 95, 138, .09) 27px 28px), linear-gradient(180deg, #FFFAEE, var(--paper) 40%, #F5EBD4);
  box-shadow: none; filter: drop-shadow(0 8px 12px rgba(20, 8, 2, .45));
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%;
  padding-bottom: 24px;
}
.glass.paper::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--crust, #B5651D) 0 14px, #2C5F8A 14px 28px); opacity: .85; pointer-events: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 9px 11px 10px 12px; border: 2px solid rgba(250, 243, 230, .55); background: var(--tint1); cursor: pointer; font-weight: 700; font-size: 15px; white-space: nowrap; transition: background .15s, transform .08s, border-color .15s; }
.btn:hover { background: var(--tint3); border-color: var(--gold); }
.btn:active { transform: translateY(1px); }
.paper .btn { border-color: rgba(59, 36, 18, .5); }
.btn.primary { background: #FBF5E8; border-color: #6B3D1B; color: #3B2412; box-shadow: 0 3px 0 #6B3D1B; font-family: var(--display); font-size: 18px; letter-spacing: .01em; }
.btn.primary:hover { background: #F6E3B3; border-color: #4A2E18; }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #6B3D1B; }
.btn:disabled, .btn.off { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; border-radius: 8px 9px 8px 10px; }
.btn.icon { width: 40px; padding: 0; }
.btn.on { background: var(--accent); border-color: #FFB070; color: #fff; }
.btn svg, .chip svg { width: 20px; height: 20px; flex: none; }
:focus-visible { outline: 3px solid #FFB84D; outline-offset: 2px; }
.paper :focus-visible { outline-color: #2C5F8A; }
@media (pointer: coarse) { .btn, .btn.sm { min-height: 44px; } .btn.icon { width: 44px; } }

/* top bar: a wooden shelf with chalk tiles */
#hud.glass {
  background: repeating-linear-gradient(90deg, rgba(0, 0, 0, .1) 0 2px, transparent 2px 11px), repeating-linear-gradient(0deg, rgba(255, 220, 160, .06) 0 3px, transparent 3px 9px), linear-gradient(180deg, #8A5A2B, #6B4020 60%, #4F2E14);
  border: 3px solid #3A200E; border-radius: 10px; box-shadow: inset 0 2px 0 rgba(255, 220, 160, .25), inset 0 -3px 0 rgba(0, 0, 0, .3), 0 8px 18px rgba(20, 8, 2, .5);
}
#hud { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px 12px; flex-wrap: wrap; }
#hud .brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--gold); white-space: nowrap; text-shadow: 0 2px 0 rgba(0, 0, 0, .45); }
#hud .brand svg { width: 34px; height: 34px; }
#hud .stats { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 11px; border-radius: 7px; background: linear-gradient(160deg, var(--board-hi), var(--board)); font-weight: 700; font-size: 15px; white-space: nowrap; border: 2px solid rgba(250, 243, 230, .35); box-shadow: inset 0 0 12px rgba(0, 0, 0, .3); font-variant-numeric: tabular-nums; }
.chip svg { color: var(--gold); width: 22px; height: 22px; }
.chip.neg { color: var(--bad); }
.chip .sub { color: var(--ink-mute); font-weight: 600; }
.stars { display: inline-flex; gap: 1px; } .stars svg { width: 17px; height: 17px; }
#hud .tools { display: flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; background: rgba(0, 0, 0, .28); border-radius: 9px; padding: 2px; gap: 2px; }
.seg .btn { min-height: 36px; padding: 0 10px; border: none; background: transparent; border-radius: 7px; font-size: 14px; }
.seg .btn.on { background: var(--accent); color: #fff; }
@media (pointer: coarse) { .seg .btn { min-height: 44px; min-width: 44px; } }
#hud .btn:not(.on):not(.primary) { background: rgba(0, 0, 0, .25); }
#clockbar { position: absolute; left: 10px; right: 10px; bottom: 1px; height: 4px; border-radius: 3px; background: rgba(0, 0, 0, .35); overflow: hidden; }
#clockbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #E6C27A, #FF7A1A); }

/* toasts: little paper slips */
#toasts { position: fixed; top: calc(var(--hudH) + 16px); left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(460px, calc(100% - 24px)); }
.toast.glass { padding: 9px 14px; border-radius: 4px; font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; animation: tin .22s ease-out; max-width: 100%; color: #3B2412; background: linear-gradient(180deg, #FFFAEE, #F5EBD4); border: 0; border-left: 6px solid var(--info); box-shadow: 0 6px 12px rgba(20, 8, 2, .45); }
.toast.good { border-left-color: #3E8A35; } .toast.bad { border-left-color: #C23A22; } .toast.info { border-left-color: #2C5F8A; }
.toast svg { width: 20px; height: 20px; flex: none; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: all .25s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px) rotate(-1deg); } }
@media (prefers-reduced-motion: reduce) {
  .toast.glass { animation: none; }
  .toast.out { transition: none; }
}

/* panels */
.panel { position: fixed; z-index: 15; padding: 14px; overflow: auto; scrollbar-width: thin; max-height: calc(100% - var(--hudH) - 92px); }
#side { top: calc(var(--hudH) + 16px); right: 8px; width: 330px; }
#sales { top: calc(var(--hudH) + 16px); left: 8px; width: 300px; }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--gold); line-height: 1.1; }
.panel h3, .modal h3 { margin: 12px 0 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); font-weight: 800; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
.row { display: flex; align-items: center; gap: 8px; } .row.sp { justify-content: space-between; } .row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-mute); font-size: 13px; }
.sub { color: var(--ink-dim); font-size: 13px; }
.close { margin-left: auto; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; font-size: 14px; align-items: center; }
.kv b { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13px; }
.bar { height: 9px; border-radius: 99px; background: var(--tint2); overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #E6C27A, #FF7A1A); border-radius: 99px; transition: width .25s; }
.card { padding: 10px; border-radius: 8px; background: var(--tint1); margin-bottom: 6px; font-size: 14px; border: 1px dashed var(--line); }
.card .t { font-weight: 800; display: flex; gap: 6px; align-items: center; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--tint2); display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); }
.tag.good { background: rgba(80, 150, 60, .22); color: #B8EBA0; } .tag.bad { background: rgba(240, 90, 60, .22); color: #FFC1B3; } .tag.warn { background: rgba(230, 194, 122, .22); color: var(--gold); }
.paper .tag.good { background: rgba(62, 138, 53, .16); color: #25601F; } .paper .tag.bad { background: rgba(194, 58, 34, .14); color: #8E2410; } .paper .tag.warn { background: rgba(184, 79, 16, .14); color: #7A3B08; }
.stepper { display: inline-flex; gap: 4px; align-items: center; }
.stepper b { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 14px; }
.chart { width: 100%; height: 96px; display: block; border-radius: 6px; background: #26332D; border: 2px solid #8A5A2B; box-shadow: inset 0 0 14px rgba(0, 0, 0, .45); }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--ink-mute); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.spotrow { display: grid; grid-template-columns: 1fr 70px auto; gap: 8px; align-items: center; font-size: 14px; padding: 4px 0; border-top: 1px dashed var(--line); }
.worker { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; }
select.sel { background: var(--tint2); border: 2px solid var(--line); border-radius: 8px; min-height: 36px; padding: 0 8px; color: var(--ink); cursor: pointer; }
select.sel option { background: #FBF5E8; color: #3B2412; }
@media (pointer: coarse) { select.sel { min-height: 44px; } }

/* world labels: small wooden signs on the street and over the stations */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 6px 8px 6px 8px; background: linear-gradient(180deg, #84552A, #5E3818); border: 2px solid #3A200E; font-size: 13px; font-weight: 800; color: #FFF6E4; min-height: 28px; box-shadow: inset 0 1px 0 rgba(255, 220, 160, .35), 0 3px 6px rgba(20, 8, 2, .45); text-shadow: 0 1px 0 rgba(0, 0, 0, .4); }
.lbl.sel { background: linear-gradient(180deg, #E0731F, #B84F10); border-color: #FFD7A0; }
.lbl .pip { width: 10px; height: 10px; border-radius: 50%; background: #9ED67A; border: 1px solid rgba(0, 0, 0, .45); }
.lbl .pip.warn { background: #FFD27A; } .lbl .pip.bad { background: #FF6B4A; }
.lbl svg { width: 15px; height: 15px; }
@media (pointer: coarse) { .lbl { min-height: 44px; padding: 6px 14px; } }

/* dock */
#dock { position: fixed; z-index: 18; bottom: 26px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 6px 8px; }
#dock .btn { min-height: 44px; }
#footer { position: fixed; left: 0; right: 0; bottom: 5px; text-align: center; font-size: 12.5px; color: #FFF1D6; z-index: 13; text-shadow: 0 1px 3px #000; pointer-events: none; }
#footer a { color: var(--gold); pointer-events: auto; }
#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 82px; z-index: 12; padding: 6px 12px; font-size: 13px; color: var(--ink-dim); pointer-events: none; text-align: center; max-width: calc(100% - 20px); }

/* screens + modals */
.screen { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 14px; }
.screen.dim { background: rgba(26, 12, 4, .6); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.modal { position: relative; width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 22px 24px; scrollbar-width: thin; }
.modal.wide { width: min(780px, 100%); }
.modal h1 { font-family: var(--display); font-weight: 400; font-size: 36px; margin: 0 0 4px; color: var(--gold); text-shadow: 0 2px 0 rgba(0, 0, 0, .35); line-height: 1.05; }
.paper h1 { text-shadow: none; }
.modal .menu { display: grid; gap: 10px; margin-top: 14px; }
.modal .menu .btn { min-height: 48px; font-size: 16px; }
.modal .menu .btn.primary { min-height: 52px; font-size: 22px; }
#title { background: radial-gradient(ellipse at 50% 40%, rgba(40, 18, 8, .1), rgba(22, 8, 2, .72)); }
#title .box { text-align: center; padding-top: 40px; }
#title .logo svg { width: 150px; height: 150px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .4)); }
#title h1 { font-size: 66px; margin: 2px 0 0; letter-spacing: .01em; line-height: 1; }
#title .tag1 { color: var(--ink-dim); margin: 6px 0 12px; font-size: 17px; font-weight: 600; }
#title .how { text-align: left; font-size: 14.5px; color: var(--ink-dim); background: var(--tint1); border-radius: 8px; border: 1px dashed var(--line); padding: 10px 14px 10px 32px; margin: 0; line-height: 1.5; }
#title .best { margin-top: 10px; font-size: 14px; color: var(--ink-mute); font-family: var(--display); }
.bunting { position: absolute; left: 0; right: 0; top: 0; height: 40px; pointer-events: none; }
.bunting svg { width: 100%; height: 100%; display: block; }
#loadmsg { margin-top: 8px; font-size: 13px; color: var(--ink-mute); min-height: 18px; }
.sliderrow { display: grid; grid-template-columns: 110px 1fr 42px; align-items: center; gap: 10px; margin: 6px 0; font-size: 15px; font-weight: 700; }
.sliderrow input[type=range] { width: 100%; accent-color: #FF7A1A; height: 32px; }
@media (pointer: coarse) { .sliderrow input[type=range] { height: 44px; } }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 8px; }
.tabs .btn { min-height: 38px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: right; color: var(--ink-mute); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 4px; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { padding: 6px 4px; text-align: right; border-top: 1px dashed var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.paper table.t td:not(:first-child) { font-family: var(--mono); font-size: 13px; }
.up { color: var(--bad); } .dn { color: var(--good); }
.big { font-family: var(--display); font-size: 30px; font-weight: 400; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
.stat { padding: 10px; border-radius: 8px; background: var(--tint1); border: 1px dashed var(--line); text-align: center; }
.stat .v { font-family: var(--display); font-size: 26px; font-weight: 400; }
.stat .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-mute); font-weight: 800; }
.newrec { color: var(--gold); font-weight: 800; }
#dbg { position: fixed; left: 8px; bottom: 28px; z-index: 90; font: 12px/1.35 ui-monospace, Consolas, monospace; background: rgba(0, 0, 0, .72); color: #9f9; padding: 6px 8px; border-radius: 8px; max-width: min(520px, 90vw); white-space: pre-wrap; pointer-events: none; }

@media (max-width: 900px) {
  #side { left: 8px; right: 8px; top: auto; bottom: 78px; width: auto; max-height: 42vh; }
  #sales { left: 8px; right: 8px; width: auto; max-height: 52vh; }
  #hud .brand span { display: none; }
  #hud .stats { order: 3; flex-basis: 100%; justify-content: flex-start; }
  #hud .tools { margin-left: auto; }
  #title h1 { font-size: 50px; } #title .logo svg { width: 110px; height: 110px; }
  #hint { display: none; }
  #dock { bottom: 22px; }
}
@media (max-height: 560px) { #title .how { display: none; } #title .logo svg { width: 80px; height: 80px; } #title h1 { font-size: 40px; } }
.modal { max-height: calc(100dvh - 16px); }
@media (max-height: 480px) {
  .screen { padding: 8px; }

function recordBest(res) {
  const b = store.get(KEY.best); let rec = false, nb = b;
  const cand = { won: res === 'won', day: S.day, lira: Math.round(S.lira) };
  if (!b) { rec = true; nb = cand; }
  else if (cand.won && (!b.won || cand.day < b.day || (cand.day === b.day && cand.lira > b.lira))) { rec = true; nb = cand; }
  else if (!cand.won && !b.won && cand.lira > b.lira) { rec = true; nb = cand; }

}

// ---------- action handling ----------
function afterChange() { hudUpdate(true); if (ui.planOpen) renderPlan(); renderSide(true); renderSales(true); updateLabels(true); }
function tryResult(r, okSfx) { if (!r || !r.ok) { toast(whyMsg(r && r.why || 'cash'), 'bad'); SFX.bad(); return false; } (okSfx || SFX.buy).call(SFX); return true; }
function handleAct(name, a, b) {
  audioInit(); audioResume();
  switch (name) {
    case 'tab': ui.planTab = a; SFX.click(); renderPlan(); return;
    case 'price': setPrice(a, S.sell[a] + +b); SFX.click(); break;
    case 'target': setTarget(a, S.target[a] + +b); SFX.click(); break;
    case 'recipe': if (tryResult(act('recipe', a), SFX.good)) { toast(t('p_' + a) + ' ✓', 'good'); } break;
    case 'order': if (tryResult(order(a, +b))) toast(t('tst_ordered'), 'info', 'van'); break;
    case 'stockup': { const before = S.lira; botOrders(0.9); if (S.lira < before) { SFX.buy(); toast(t('tst_ordered'), 'info', 'van'); } else SFX.bad(); break; }
    case 'sendSpot': { const w = S.workers.find(x => !x.assign); if (w) tryResult(assign(w.id, 'spot', a)); break; }
    case 'recallSpot': { const l = sellersAt(a); if (l.length) assign(l[l.length - 1].id, 'none'); SFX.click(); break; }
    case 'toSpot': tryResult(assign(+a, 'spot', b)); break;
    case 'toStation': tryResult(assign(+a, 'station', b)); break;
    case 'recallW': assign(+a, 'none'); SFX.click(); break;
    case 'fire': tryResult(act('fire', +a)); break;
    case 'hire': if (tryResult(act('hire', +a), SFX.good)) { const w = S.workers[S.workers.length - 1]; toast(t('tst_hire', w.name), 'good', 'people'); } break;
    case 'upg': { const kind = a, id = b; if (tryResult(act(kind, id || undefined), SFX.good)) toast(t('tst_upg'), 'good', 'up'); break; }
    case 'contract': if (tryResult(acceptContract(+a))) SFX.good(); break;
    case 'plan': openPlan(); return;
    case 'planclose': closePlan(); return;
    case 'open': beginDay(); return;
    case 'sales': ui.salesOpen = !ui.salesOpen; SFX.click(); break;
    case 'deselect': UI.select(null); return;
    case 'focusSpot': UI.select('spot', a); return;
    case 'resume': setPaused(false); return;
    case 'restart': if (confirm(t('confirm_restart'))) { setPaused(false); startNew(); } return;
    case 'settings': openSettings(); return;
    case 'mainmenu': setPaused(false); toTitle(); return;
    default: flowAct(name, a, b); return;
  }
  afterChange();
}
function onAssignSelect(wid, val) {
  audioInit();

  afterChange();
}
const UI = {
  select(kind, id) {
    if (kind === 'worker') { ui.selWorker = id; sel = null; }
    else if (!kind) { sel = null; ui.selWorker = 0; }
    else { sel = { kind, id }; ui.selWorker = 0; }

    if (sel && sel.kind === 'spot' && coarse) ui.salesOpen = false;
  },
  dropWorker(wid, hit) {
    const w = S.workers.find(x => x.id === wid); if (!w) return;
    if (!hit) return;
    let r;
    if (hit.kind === 'station') r = assign(wid, 'station', hit.id);
    else if (hit.kind === 'spot') r = hit.id === 'shop' ? assign(wid, 'none') : assign(wid, 'spot', hit.id);
    else if (hit.kind === 'rack') r = assign(wid, 'none');
    if (r) { if (tryResult(r)) toast(t('tst_assigned', w.name, hit.id === 'racks' ? t('idle') : hit.kind === 'station' ? t('st_' + hit.id) : t('sp_' + hit.id)), 'info', 'people'); }

}
function applyQuality() {
  if (!renderer) return; renderer.setPixelRatio(Math.min(devicePixelRatio || 1, lowQ() ? 1 : 1.5)); renderer.shadowMap.enabled = !lowQ(); sunL.castShadow = !lowQ();
  scene.traverse(o => { if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.needsUpdate = true; }); } }); resizeRenderer();
}
function setLang(l) { settings.lang = l; saveSettings(); applyLang(); }
function toggleFs() { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { /* unsupported */ } }

// ---------- summary + end ----------
function showSummary(L) {
  const net = L.net, tips = [];
  const tot = L.served + L.missed;
  if (L.sat < 0.7 && L.missed > 8) tips.push(t('tip_miss')); if (L.burnt > 2) tips.push(t('tip_burn')); if (L.wasted > L.sold * 0.35 && L.wasted > 10) tips.push(t('tip_stale')); if (S.lira < 150) tips.push(t('tip_cash')); if (!tips.length) tips.push(t('tip_ok'));
  const row = (k, v, cls) => '<tr><td>' + k + '</td><td class="' + (cls || '') + '">' + v + '</td></tr>';
  let h = '<h1>' + t('sum_title', L.day) + '</h1><div class="sub row">' + ic(weatherIcon(L.weather)) + t('wx_' + L.weather) + '</div>';
  h += '<table class="t" style="margin-top:8px">' + row(t('sum_rev'), money(L.rev)) + row(t('sum_contract'), money(L.contractRev)) + row(t('sum_buy'), '-' + money(L.bought), 'up') + row(t('sum_invest'), '-' + money(L.invest), 'up') + row(t('sum_fines'), '-' + money(L.fines), 'up') + row(t('sum_wages'), '-' + money(L.wages), 'up') + row(t('sum_rent'), '-' + money(L.rent), 'up') + row(t('sum_fuel'), '-' + money(L.fuel), 'up') + row('<b>' + t('sum_net') + '</b>', '<b class="' + (net >= 0 ? 'dn' : 'up') + '">' + (net >= 0 ? '+' : '') + money(net) + '</b>') + '</table>';
  h += '<div class="statgrid"><div class="stat"><div class="v">' + num(L.sold) + '</div><div class="k">' + t('sum_sold') + '</div></div><div class="stat"><div class="v">' + num(L.missed) + '</div><div class="k">' + t('sum_missed') + '</div></div><div class="stat"><div class="v">' + num(L.burnt) + '</div><div class="k">' + t('sum_burnt') + '</div></div><div class="stat"><div class="v">' + num(L.wasted) + '</div><div class="k">' + t('sum_wasted') + '</div></div></div>';
  h += '<div class="row sp"><span>' + t('sum_rep') + ' ' + starsHtml(L.rep) + ' <b class="' + (L.dRep >= 0 ? 'dn' : 'up') + '">' + (L.dRep >= 0 ? '+' : '') + L.dRep.toFixed(2) + '</b></span><span>' + t('sum_cash') + ' <b>' + money(L.lira) + '</b></span></div>';
  h += '<p class="sub">' + tips.map(x => ic('info') + ' ' + x).join('<br>') + '</p>';
  h += '<div class="menu"><button class="btn primary" data-act="nextday" data-k="nextday">' + ic('play') + t('next_day') + '</button></div>';
  $('suBody').innerHTML = h; show$('summary'); focusFirst('summary');
}
function showEnd(res) {
  const rec = recordBest(res);
  const title = res === 'won' ? t('win_title') : res === 'bankrupt' ? t('lose_title') : t('time_title');
  const text = res === 'won' ? t('win_text', S.day, money(S.lira), S.rep.toFixed(1)) : res === 'bankrupt' ? t('lose_text') : t('time_text', S.day, money(S.lira), S.rep.toFixed(1));
  let h = '<div style="text-align:center"><div class="logo">' + LOGO(res === 'won' ? 110 : 90) + '</div><h1>' + title + '</h1><p class="sub">' + text + '</p>' + (rec ? '<p class="newrec">' + ic('star') + ' ' + t('new_record') + '</p>' : '') + '</div>';
  h += '<div class="statgrid"><div class="stat"><div class="v">' + S.day + '</div><div class="k">' + t('days_played') + '</div></div><div class="stat"><div class="v">' + money(S.lira) + '</div><div class="k">' + t('lira') + '</div></div><div class="stat"><div class="v">' + S.rep.toFixed(1) + '</div><div class="k">' + t('stars') + '</div></div></div>';
  h += '<div class="menu">' + (res !== 'bankrupt' ? '<button class="btn primary" data-act="endless" data-k="endless">' + t('endless') + '</button>' : '') + '<button class="btn' + (res === 'bankrupt' ? ' primary' : '') + '" data-act="again" data-k="again">' + t('again') + '</button><button class="btn" data-act="mainmenu2" data-k="mm2">' + ic('home') + t('menu') + '</button></div>';
  $('enBody').innerHTML = h; show$('endM'); focusFirst('endM'); store.del(KEY.save); ui.finished = true; ui.endShown = true; $('bCont').classList.add('hidden');
  if (res === 'won') SFX.good(); else SFX.bad();
}
function onDayEnd(L) {
  if (ui.quiet) return;
  if (FLAGS.auto && S.phase === 'summary') return;
  S.phase === 'ended' ? showEnd(S.result) : showSummary(L);
}
function saveGame() { store.set(KEY.save, { v: 1, S }); }

// =============================================================================================
// MAIN: flow, events, input, loop, test hooks
// =============================================================================================
window.__t = t;
window.__bootTimer && clearTimeout(window.__bootTimer);
const assetsInfo = { mode: 'procedural', loaded: [], failed: [], note: 'All geometry, textures and sounds are generated in code; no external assets are used.' };

function setLoad(n) { ui.loadN = n; $('loadmsg').textContent = t('loading', n, 2); }
setLoad(0);
function resetVisual() {
  crowd.forEach((c, i) => { if (i >= 16) c.on = false; }); agents.clear(); van.t = -1; if (world.parts.van) world.parts.van.visible = false;
  sel = null; ui.selWorker = 0; hoverKey = '';
}
function hideOverlays() { for (const id of ['planM', 'summary', 'endM', 'pause', 'settings']) show$(id, false); ui.planOpen = false; ui.paused = false; ui.endShown = false; }
function enterGame() {
  ui.inGame = true; ui.finished = false; ui.lastHud = {}; ui.pausedByPlan = false; hideOverlays(); show$('title', false); show$('hud'); show$('dock'); show$('hint', false);
  ui.speed = FLAGS.speed || (FLAGS.auto ? 4 : 1); G_UI.labelsOn = true; resetVisual();
  if (!FLAGS.low) $('hud').classList.remove('hidden');
  resizeHudVar(); afterChange();
}
function startNew() {
  audioInit(); audioResume(); musicStart();
  newGame(FLAGS.seed || ((Date.now() % 90000) + 7)); enterGame(); saveGame();
  if (!FLAGS.auto) openPlan();
}
function continueGame() {
  audioInit(); audioResume(); musicStart();
  const sv = store.get(KEY.save); if (!(sv && sv.S && sv.S.v === 1)) { startNew(); return; }
  loadState(sv.S); fixOvens(); enterGame(); if (S.phase === 'day') S.phase = 'plan'; if (S.phase === 'plan') openPlan(); else if (S.phase === 'summary') nextDay();
  afterChange();
}
function toTitle() {
  ui.inGame = false; hideOverlays(); show$('hud', false); show$('dock', false); show$('side', false); show$('sales', false); show$('hint', false); show$('title');
  G_UI.labelsOn = false; updateLabels(false); newGame(7); S.phase = 'plan'; resetVisual(); applyLang(); focusFirst('title');
}
function flowAct(name) {
  switch (name) {
    case 'nextday': show$('summary', false); nextDay(); saveGame(); SFX.click(); toast(t('tst_saved'), 'info', 'check'); enterGameKeep(); openPlan(); break;
    case 'endless': show$('endM', false); ui.endShown = false; ui.finished = false; goEndless(); nextDay(); saveGame(); enterGameKeep(); openPlan(); break;
    case 'again': show$('endM', false); startNew(); break;
    case 'mainmenu2': show$('endM', false); toTitle(); break;
  }
}
function enterGameKeep() { ui.lastHud = {}; afterChange(); }

// ---------- sim events ----------
let lastCoin = 0, lastCall = 0, lastSlap = 0, lastKnead = 0, lastMiss = {};
listeners.push((type, d) => {
  if (!ui.inGame) return;
  switch (type) {
    case 'sale': {
      if (ui.quiet) return; const now = performance.now();
      if (rr() < 0.85) spawnCustomer(d.spot);
      if (now - lastCoin > 140) { lastCoin = now; SFX.coin(); }
      if (d.spot !== 'shop' && now - lastCall > 3500 && rr() < 0.5) { lastCall = now; SFX.call(); }
      break;
    }
    case 'burnt': toast(t('tst_burnt'), 'bad', 'flame'); SFX.burn(); break;
    case 'delivery': toast(t('tst_delivery', d.qty, t('i_' + d.k)), 'info', 'van'); if (!ui.quiet) { startVan(); SFX.van(); } break;
    case 'contractok': toast(t('tst_cok', money(d.pay)), 'good', 'check'); SFX.good(); break;
    case 'contractfail': toast(t('tst_cfail', money(d.fine)), 'bad', 'warn'); SFX.bad(); break;
    case 'skill': { const w = S.workers.find(x => x.id === d.id); if (w) toast(t('tst_skill', w.name), 'good', 'star'); break; }
    case 'dayend': onDayEnd(d); break;
  }
});
function watchProblems() {
  if (!ui.inGame || S.phase !== 'day') return;
  for (const st of STATION_IDS) { const s = S.stn[st]; if (s.flag === 'noing' && s.ing) { const k = st + s.ing; if (!lastMiss[k] || S.t - lastMiss[k] > 40) { lastMiss[k] = S.t; toast(t('tst_out', t('i_' + s.ing), t('st_' + st)), 'bad', 'warn'); SFX.bad(); } } }
  if (S.oven.flag === 'full' && (!lastMiss.full || S.t - lastMiss.full > 40)) { lastMiss.full = S.t; toast(t('tst_full'), 'info', 'rack'); }
  if (S.t - (lastMiss.oven || -99) > 40 && S.oven.ovens.some(o => o.slots.some(sl => sl.done && sl.wait > 4)) && !workersAt('station', 'oven').length) { lastMiss.oven = S.t; toast(t('tst_restock'), 'bad', 'flame'); }
  const kn = S.stn.knead.n || 0; if (kn !== lastKnead) { lastKnead = kn; const now = performance.now(); if (now - lastSlap > 420 && !ui.quiet) { lastSlap = now; SFX.slap(); } }
}

// ---------- auto bot + fast-forward ----------
function autoDrive() {
  if (!FLAGS.auto || !ui.inGame || ui.finished) return;
  if (S.phase === 'plan') { botPlan('good'); ui.lastBotHour = -1; closePlan(); }
  else if (S.phase === 'summary') { show$('summary', false); nextDay(); saveGame(); }
  else if (S.phase === 'day') { const hh = Math.floor(S.t / SEC_PER_HOUR); if (hh !== ui.lastBotHour) { ui.lastBotHour = hh; botHour(); } }
}
function fastForward(sec) {
  const wasQuiet = ui.quiet; ui.quiet = true; let rem = sec, guard = 0;
  while (rem > 1e-6 && guard++ < 400000) {
    if (S.phase === 'day') { const d = Math.min(0.1, rem); step(d); rem -= d; if (FLAGS.auto) autoDrive(); }
    else if (FLAGS.auto && ui.inGame && !ui.finished && S.phase !== 'ended') autoDrive();
    else break;
  }
  ui.quiet = wasQuiet;
  if (S.phase === 'ended' && !ui.endShown && ui.inGame) showEnd(S.result);
  else if (S.phase === 'summary' && !FLAGS.auto && !open$('summary') && S.last) showSummary(S.last);
  afterChange(); return stateSummary();
}
function stateSummary() { return { phase: S.phase, day: S.day, t: +S.t.toFixed(1), lira: Math.round(S.lira), rep: +S.rep.toFixed(2), result: S.result, workers: S.workers.length }; }
window.simitfiriniSim = fastForward;
window.simitfirini = {
  get S() { return S; }, DATA, FLAGS, assets: assetsInfo, ui, get result() { return S && S.result; }, get finished() { return ui.finished; }, stateSummary,
  get cam() { return cam; }, get fps() { return Math.round(fpsEma); }, get calls() { return renderer ? renderer.info.render.calls : 0; }, get tris() { return renderer ? renderer.info.render.triangles : 0; },
  get errors() { return window.__errors; }, get missingText() { return window.__missing || []; }, bot: botPlan,
};

// ---------- input ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) { handleAct(el.dataset.act, el.dataset.a, el.dataset.b); return; }
  const s = e.target.closest('[data-set]');
  if (s) {
    const k = s.dataset.set, v = s.dataset.v;
    if (k === 'lang') setLang(v); else if (k === 'quality') { settings.quality = v; saveSettings(); applyQuality(); renderSettings(); } else if (k === 'fs') toggleFs();
    SFX.click(); return;
  }
  const sp = e.target.closest('[data-speed]'); if (sp) { ui.speed = +sp.dataset.speed; hudUpdate(true); SFX.click(); }
});
document.addEventListener('change', e => { const t0 = e.target; if (t0.dataset && t0.dataset.sel === 'assign') onAssignSelect(t0.dataset.a, t0.value); });
function toggleMusic() { settings.musicOn = !settings.musicOn; saveSettings(); audioInit(); audioResume(); if (settings.musicOn) musicStart(); audioApply(); hudUpdate(true); toast(settings.musicOn ? t('mus_on') : t('mus_off'), 'info', 'music'); }
function toggleSfx() { settings.sfxOn = !settings.sfxOn; saveSettings(); audioInit(); audioResume(); audioApply(); hudUpdate(true); toast(settings.sfxOn ? t('sfx_on') : t('sfx_off'), 'info', 'speaker'); if (settings.sfxOn) SFX.click(); }
$('bMusic').addEventListener('click', toggleMusic); $('bSfx').addEventListener('click', toggleSfx); $('bLang').addEventListener('click', () => setLang(settings.lang === 'tr' ? 'en' : 'tr'));
$('bLangT').addEventListener('click', () => setLang(settings.lang === 'tr' ? 'en' : 'tr'));
$('bPause').addEventListener('click', () => { if (S.phase === 'day' || ui.paused) setPaused(!ui.paused); });
$('bPlay').addEventListener('click', () => startNew()); $('bCont').addEventListener('click', () => continueGame());
$('bSet').addEventListener('click', () => { audioInit(); openSettings(); }); $('sClose').addEventListener('click', closeSettings);
$('plClose').addEventListener('click', () => closePlan());
function onEscape() {
  if (open$('settings')) { closeSettings(); return; }
  if (!ui.inGame) return;
  if (open$('planM')) { closePlan(); return; }
  if (open$('summary') || open$('endM')) return;
  if (open$('pause')) { setPaused(false); return; }
  if (sel || ui.selWorker) { UI.select(null); return; }
  setPaused(true);
}
G_UI.blocked = modalBlocking;
window.addEventListener('keydown', e => {
  const tag = e.target.tagName; if ((tag === 'INPUT' || tag === 'SELECT') && e.key !== 'Escape') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'escape' || k === 'p') { e.preventDefault(); if (k === 'p' && (!ui.inGame || open$('planM') || open$('summary') || open$('endM') || open$('settings'))) return; onEscape(); return; }
  if (k === 'm') { toggleMusic(); return; } if (k === 'x') { toggleSfx(); return; } if (k === 'l') { setLang(settings.lang === 'tr' ? 'en' : 'tr'); return; }
  if (k === 'f') { toggleFs(); return; }
  if (!ui.inGame || modalBlocking()) return;
  if (k === '1' || k === '2' || k === '3') { ui.speed = [1, 2, 4][+k - 1]; hudUpdate(true); return; }
  if (k === '+' || k === '=') { zoomBy(0.88); return; } if (k === '-') { zoomBy(1.14); return; }
  const pan = { arrowleft: [60, 0], a: [60, 0], arrowright: [-60, 0], d: [-60, 0], arrowup: [0, 60], w: [0, 60], arrowdown: [0, -60], s: [0, -60] }[k];
  if (pan && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); panBy(pan[0], pan[1]); }
});
function resizeHudVar() { const h = $('hud').offsetHeight || 56; document.documentElement.style.setProperty('--hudH', h + 8 + 'px'); }
window.addEventListener('resize', () => { resizeRenderer(); fitCamera(); resizeHudVar(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && ui.inGame && S.phase === 'day' && !ui.paused) setPaused(true); });

// ---------- loop ----------
let last = performance.now(), fpsEma = 60, hudAcc = 0, ringAcc = 0, sideAcc = 0, dbgAcc = 0, titleAng = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min(0.1, (now - last) / 1000); last = now; if (dtReal > 0) fpsEma += (1 / Math.max(dtReal, 0.001) - fpsEma) * 0.05;
  simTime += dtReal;
  const running = ui.inGame && !ui.paused && !modalBlocking() && S.phase === 'day' && !(ui.planOpen);
  if (ui.inGame && FLAGS.auto && !ui.paused) autoDrive();
  if (running) { let rem = dtReal * ui.speed; while (rem > 1e-6 && S.phase === 'day') { const d = Math.min(rem, 0.1); step(d); rem -= d; } watchProblems(); }
  const vdt = ui.paused || (ui.inGame && modalBlocking() && !open$('title')) ? 0 : (running ? dtReal * Math.min(ui.speed, 2) : (ui.inGame ? dtReal : dtReal));
  if (!ui.inGame) { titleAng += dtReal; cam.az = 0.62 + Math.sin(titleAng * 0.12) * 0.12; placeCamera(); }
  updateScenery(vdt);
  updateStaff(dtReal, vdt);
  updateCrowd(vdt);
  ringAcc += dtReal; if (ringAcc > 0.1) { ringAcc = 0; updateRings(); }
  hudAcc += dtReal; if (hudAcc > 0.25) { hudAcc = 0; hudUpdate(false); updateLabels(true); renderSideFast(); }
  else updateLabels(false);
  audioAmbience(dtReal);
  renderer.render(scene, camera);
  dbgAcc += dtReal; if (FLAGS.debug && dbgAcc > 0.5) { dbgAcc = 0; showDebug(); }
}
function renderSideFast() { if (!ui.inGame) return; sideAcc++; if (sideAcc % 2 === 0) { renderSide(false); if (ui.salesOpen) renderSales(false); } if (ui.planOpen && S.phase === 'day' && sideAcc % 4 === 0) renderPlan(); }
function showDebug() {
  const d = $('dbg'); d.classList.remove('hidden'); const i = renderer.info;
  d.textContent = 'fps ' + Math.round(fpsEma) + '  calls ' + i.render.calls + '  tris ' + i.render.triangles + '  geo ' + i.memory.geometries + '  tex ' + i.memory.textures + '\nday ' + S.day + ' ' + S.phase + ' t ' + S.t.toFixed(0) + '  lira ' + Math.round(S.lira) + ' rep ' + S.rep.toFixed(2) + (S.result ? ' → ' + S.result : '') + '\nassets: ' + assetsInfo.mode + (window.__errors.length ? '\nERRORS:\n' + window.__errors.join('\n') : '\nerrors: 0') + ((window.__missing || []).length ? '\nmissing text: ' + window.__missing.join(',') : '');
}

// ---------- boot ----------
function boot() {
  setLoad(1);
  if (FLAGS.low) settings.quality = 'low';
  initWorld($('c')); initInput($('c')); initCrowd(); initLabels(); resizeRenderer(); fitCamera();
  newGame(7); S.phase = 'plan';
  applyLang(); ui.loadDone = true; $('loadmsg').textContent = ''; $('bPlay').disabled = false; $('bPlay').focus();
  if (FLAGS.shot) { /* reserved for screenshot helpers */ }
  requestAnimationFrame(frame);
  if (FLAGS.auto || FLAGS.sim) {
    startNew();
    if (FLAGS.sim) { if (!FLAGS.auto) { botOrders(0.9); closePlan(); startDay(); } fastForward(FLAGS.sim); }
  }
  updateLabels(true);
}
boot();
