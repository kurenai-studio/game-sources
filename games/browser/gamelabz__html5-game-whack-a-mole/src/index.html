<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whack-a-Mole</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🔨 Whack-a-Mole</h1>
      <p class="tagline">Bonk the moles before they duck. 30 seconds on the clock.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
      <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="time">30</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="480" height="480"></canvas>
      <p class="message" id="message">Press Start to play.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="start">Start</button>
      <button class="btn" id="restart">Restart</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
