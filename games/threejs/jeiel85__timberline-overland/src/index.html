<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Timberline Overland</title>
  <meta name="description" content="An alpine 4x4 expedition in your browser: crawl over boulders, ford a glacier tarn and climb switchbacks to a summit beacon. three.js + Rapier physics, no install." />
  <meta property="og:title" content="Timberline Overland · 수목한계선 원정" />
  <meta property="og:description" content="Drive an expedition 4x4 up a glacier-carved alpine valley. Low range, diff locks, real rigid-body physics — right in the browser." />
  <meta property="og:image" content="https://jeiel85.github.io/timberline-overland/docs/cover.jpg" />
  <meta name="theme-color" content="#2c2a26" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23e8622a'/><path d='M6 50 L24 20 L32 32 L40 18 L58 50 Z' fill='%23f4ecd9'/><path d='M36 24 L40 18 L44 25 Z' fill='%23ffffff'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f4ecd9;
      --paper-2: #e8dcc0;
      --ink: #2c2a26;
      --ink-soft: rgba(44, 42, 38, 0.62);
      --line: rgba(44, 42, 38, 0.18);
      --orange: #e8622a;
      --orange-hot: #ff6a1f;
      --forest: #3d6b3a;
      --glass: rgba(24, 24, 22, 0.52);
      --font: 'Archivo', 'Noto Sans KR', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1f1c; color: var(--ink); font-family: var(--font); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #app, #app > canvas { position: fixed; inset: 0; display: block; }
    .hidden { display: none !important; }
    button { font: inherit; color: inherit; }

    /* ---------- loading ---------- */
    #loading { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 80%, #4a5a45 0%, #1d1f1c 70%); color: var(--paper); transition: opacity 0.6s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .box { width: min(340px, 80vw); text-align: center; }
    #loading .mark { font-weight: 900; font-stretch: 75%; font-size: 40px; letter-spacing: 0.02em; line-height: 0.9; }
    #loading .mark span { color: var(--orange-hot); }
    #loading .bar { height: 4px; background: rgba(244, 236, 217, 0.15); border-radius: 2px; margin: 22px 0 12px; overflow: hidden; }
    #loading .bar i { display: block; height: 100%; background: var(--orange-hot); transform-origin: left; transform: scaleX(0); transition: transform 0.4s; }
    #load-step { font-size: 13px; color: rgba(244, 236, 217, 0.7); letter-spacing: 0.02em; }

    /* ---------- shared card ---------- */
    .card { background: var(--paper); border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28), inset 0 0 0 1px rgba(255, 255, 255, 0.4); }
    .eyebrow { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #hud > * { position: absolute; }
    #brand { top: 16px; left: 16px; display: flex; gap: 10px; align-items: center; color: #fffaf0; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45); }
    #brand .stamp { width: 40px; height: 40px; border-radius: 10px; background: var(--orange); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); }
    #brand b { display: block; font-weight: 900; font-stretch: 78%; font-size: 21px; letter-spacing: 0.03em; line-height: 1; }
    #brand small { display: block; margin-top: 3px; font-size: 11px; font-weight: 600; opacity: 0.85; letter-spacing: 0.04em; }

    #compass { top: 12px; left: 50%; transform: translateX(-50%); text-align: center; }
    #compass canvas { width: 360px; height: 36px; display: block; filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.5)); -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
    #heading-deg { display: inline-block; margin-top: 2px; padding: 2px 8px; border-radius: 6px; background: var(--glass); color: #fffaf0; font: 700 11px var(--mono); }

    #toolbar { top: 14px; right: 14px; display: flex; gap: 6px; pointer-events: auto; }
    #toolbar button { display: grid; justify-items: center; gap: 3px; min-width: 48px; padding: 7px 6px 5px; border: 0; border-radius: 11px; background: var(--glass); color: #fffaf0; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: background 0.15s, transform 0.15s; }
    #toolbar button:hover { background: rgba(232, 98, 42, 0.85); transform: translateY(-1px); }
    #toolbar button svg { width: 18px; height: 18px; }
    #toolbar button span { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
    #toolbar button kbd { font: 700 8px var(--mono); opacity: 0.6; }
    #tb-sound.off { opacity: 0.55; }
    #tb-sound.off svg path.wave { display: none; }

    #log { top: 84px; right: 14px; width: 272px; padding: 14px 16px 14px; }
    #log header { display: flex; justify-content: space-between; align-items: baseline; }
    #log-count { font: 700 12px var(--mono); color: var(--ink); }
    #log .track { height: 4px; border-radius: 2px; background: var(--line); margin: 8px 0 10px; overflow: hidden; }
    #log .track i { display: block; height: 100%; background: var(--forest); transform-origin: left; transform: scaleX(0); transition: transform 0.6s; }
    #log-label { font-size: 11px; font-weight: 700; color: var(--orange); letter-spacing: 0.04em; }
    #log-name { margin-top: 2px; font-size: 19px; font-weight: 900; letter-spacing: -0.01em; line-height: 1.2; }
    #log-desc { margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: var(--ink-soft); }
    #log-nav { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
    #log-arrow { width: 22px; height: 22px; display: grid; place-items: center; transition: transform 0.15s; }
    #log-dist { font: 700 14px var(--mono); }
    #log-dots { display: flex; gap: 4px; margin-left: auto; }
    #log-dots i { width: 9px; height: 9px; transform: rotate(45deg); border: 1.5px solid var(--ink); border-radius: 1px; }
    #log-dots i.on { background: var(--forest); border-color: var(--forest); }

    #minimap { left: 16px; bottom: calc(16px + var(--safe-b)); width: 184px; padding: 6px; border-radius: 50%; }
    #minimap canvas { display: block; width: 172px; height: 172px; border-radius: 50%; }
    #minimap .elev { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); padding: 3px 10px; border-radius: 999px; background: var(--ink); color: var(--paper); font: 700 11px var(--mono); white-space: nowrap; }
    #minimap .elev small { font-family: var(--font); font-weight: 600; opacity: 0.7; margin-right: 4px; }

    #cluster { right: 14px; bottom: calc(14px + var(--safe-b)); padding: 12px 14px 10px; display: grid; grid-template-columns: auto auto auto; gap: 4px 16px; align-items: center; }
    #cluster .spd { display: grid; }
    #speed { font: 700 52px/0.9 var(--mono); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    #cluster .unit { font: 700 10px var(--mono); color: var(--ink-soft); letter-spacing: 0.1em; }
    #cluster .rpm { height: 4px; width: 110px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 7px; }
    #rpm-bar { display: block; height: 100%; background: linear-gradient(90deg, var(--forest), #c9a43a 70%, var(--orange)); transform-origin: left; transform: scaleX(0); }
    #cluster .modes { display: grid; gap: 6px; justify-items: center; }
    #range { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--ink); color: var(--paper); font: 800 22px var(--mono); transition: background 0.2s; }
    #range.low { background: var(--orange); color: #fff; }
    #gear { font: 700 13px var(--mono); }
    #lock { display: flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 6px; border: 1.5px solid var(--line); font-size: 10px; font-weight: 800; color: var(--ink-soft); letter-spacing: 0.04em; white-space: nowrap; }
    #lock.on { background: #f2c230; border-color: #f2c230; color: var(--ink); }
    #cluster .gauges { display: flex; gap: 6px; align-items: center; }
    #incl-canvas { width: 150px; height: 84px; }
    #wheels-canvas { width: 64px; height: 84px; }
    #cluster .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 6px; font-size: 11px; color: var(--ink-soft); font-weight: 600; }
    #cluster .foot b { color: var(--ink); font-weight: 800; margin-left: 6px; }

    #toasts { top: 74px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; }
    .toast { padding: 8px 14px; border-radius: 999px; background: rgba(28, 28, 26, 0.78); color: #fffaf0; font-size: 13px; font-weight: 700; letter-spacing: 0.01em; animation: toastIn 0.25s ease-out; transition: opacity 0.5s, transform 0.5s; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap; }
    .toast.warn { background: rgba(196, 58, 32, 0.9); }
    .toast.out { opacity: 0; transform: translateY(-6px); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }

    #discovery { top: 30%; left: 50%; transform: translate(-50%, -50%); width: min(440px, 88vw); text-align: center; opacity: 0; pointer-events: none; }
    #discovery.show { animation: disc 4.8s ease forwards; }
    #discovery .inner { padding: 16px 22px 18px; }
    #discovery small { font: 700 11px var(--mono); letter-spacing: 0.16em; color: var(--orange); text-transform: uppercase; }
    #discovery b { display: block; margin: 4px 0 6px; font-size: 30px; font-weight: 900; letter-spacing: -0.01em; }
    #discovery p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
    @keyframes disc { 0% { opacity: 0; transform: translate(-50%, -40%) scale(0.96); } 8% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -54%); } }

    #hint { bottom: calc(190px + var(--safe-b)); left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 10px; background: rgba(28, 28, 26, 0.7); color: #fffaf0; font-size: 12.5px; font-weight: 600; opacity: 0; transition: opacity 0.4s; white-space: nowrap; }
    #hint.show { opacity: 1; }

    #markers { inset: 0; }
    .marker { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 3px; margin: -14px 0 0 -60px; width: 120px; color: #fffaf0; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); will-change: transform; }
    .marker i { width: 13px; height: 13px; transform: rotate(45deg); background: #fffaf0; border: 2px solid var(--ink); }
    .marker b { font-size: 12px; font-weight: 800; letter-spacing: 0.01em; }
    .marker span { font: 700 10px var(--mono); opacity: 0.85; }
    .marker.next i { background: var(--orange-hot); width: 16px; height: 16px; }
    .marker.found { opacity: 0.6; }
    .marker.found i { background: var(--forest); }

    /* ---------- touch controls ---------- */
    #touch { position: fixed; inset: auto 0 0 0; height: 0; z-index: 11; display: none; }
    body.touch.driving #touch { display: block; }
    #touch button { position: absolute; border: 0; background: rgba(24, 24, 22, 0.5); color: #fffaf0; border-radius: 18px; font-weight: 800; pointer-events: auto; touch-action: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    #touch button.on { background: rgba(232, 98, 42, 0.85); }
    #touch .steer { bottom: calc(18px + var(--safe-b)); width: 70px; height: 70px; font-size: 24px; }
    #t-left { left: 16px; }
    #t-right { left: 94px; }
    #touch .pedal { right: 16px; width: 80px; font-size: 14px; }
    #t-gas { bottom: calc(18px + var(--safe-b)); height: 104px; }
    #t-brake { bottom: calc(130px + var(--safe-b)); height: 62px; }
    #touch .small { width: 48px; height: 40px; font-size: 11px; border-radius: 12px; }
    #t-range { left: 16px; bottom: calc(98px + var(--safe-b)); }
    #t-lock { left: 70px; bottom: calc(98px + var(--safe-b)); }
    #t-hb { left: 124px; bottom: calc(98px + var(--safe-b)); }
    #t-reset { left: 16px; bottom: calc(146px + var(--safe-b)); }
    #t-cam { left: 70px; bottom: calc(146px + var(--safe-b)); }
    body.touch #minimap, body.touch #cluster .foot, body.touch #cluster .gauges, body.touch #hint, body.touch #gear { display: none; }
    body.touch #cluster { right: 16px; bottom: calc(204px + var(--safe-b)); width: 80px; padding: 8px 6px; gap: 6px; grid-template-columns: 1fr; justify-items: center; }
    body.touch #cluster .spd { justify-items: center; }
    body.touch #speed { font-size: 30px; }
    body.touch #cluster .rpm { width: 56px; margin-top: 5px; }
    body.touch #cluster .modes { grid-auto-flow: column; gap: 4px; align-items: center; }
    body.touch #range { width: 26px; height: 26px; font-size: 14px; border-radius: 7px; }
    body.touch #lock { padding: 3px; font-size: 0; gap: 0; }

    /* ---------- overlays ---------- */
    .overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 20, 18, 0.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); color: var(--ink); }
    .sheet { width: min(460px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px 24px; }
    .sheet h2 { margin: 2px 0 14px; font-size: 26px; font-weight: 900; letter-spacing: -0.01em; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 22px; border: 0; border-radius: 12px; background: var(--orange); color: #fff; font-weight: 800; font-size: 15px; letter-spacing: 0.02em; cursor: pointer; box-shadow: 0 8px 22px rgba(232, 98, 42, 0.38); transition: transform 0.12s, filter 0.12s; }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
    .btn.dark { background: var(--ink); color: var(--paper); box-shadow: none; }
    .stack { display: grid; gap: 10px; }

    #title { justify-content: flex-start; background: linear-gradient(90deg, rgba(18, 18, 16, 0.78) 0%, rgba(18, 18, 16, 0.35) 52%, rgba(18, 18, 16, 0) 100%); backdrop-filter: none; -webkit-backdrop-filter: none; color: #fffaf0; }
    #title .panel { width: min(470px, 100%); margin-left: clamp(0px, 6vw, 90px); }
    #title .kicker { font: 700 12px var(--mono); letter-spacing: 0.18em; color: var(--orange-hot); text-transform: uppercase; }
    #title h1 { margin: 10px 0 0; font-weight: 900; font-stretch: 72%; font-size: clamp(56px, 12vw, 104px); line-height: 0.84; letter-spacing: 0.005em; }
    #title h1 span { display: block; color: var(--paper-2); }
    #title .ko { margin-top: 10px; font-size: 16px; font-weight: 700; color: rgba(255, 250, 240, 0.8); letter-spacing: 0.12em; }
    #title .tag { margin: 16px 0 22px; max-width: 42ch; font-size: 14.5px; line-height: 1.65; color: rgba(255, 250, 240, 0.85); }
    #title .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    #title-progress { margin-top: 10px; font: 700 12px var(--mono); color: rgba(255, 250, 240, 0.7); }
    #title .settings { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 26px; padding-top: 16px; border-top: 1px solid rgba(255, 250, 240, 0.18); font-size: 12px; color: rgba(255, 250, 240, 0.75); align-items: center; }
    #title .settings label { display: flex; gap: 8px; align-items: center; }
    #title select { background: rgba(255, 250, 240, 0.12); color: #fffaf0; border: 1px solid rgba(255, 250, 240, 0.3); border-radius: 8px; padding: 6px 8px; font: 600 12px var(--font); }
    #title select option { color: var(--ink); }
    .seg { display: inline-flex; border: 1px solid rgba(255, 250, 240, 0.3); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; background: transparent; color: #fffaf0; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .seg button.on { background: #fffaf0; color: var(--ink); }
    #title .keys { margin-top: 18px; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12px; color: rgba(255, 250, 240, 0.75); }
    body.touch #title .keys { display: none; }
    kbd { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 5px; border: 1px solid currentColor; font: 700 11px var(--mono); text-align: center; opacity: 0.9; }

    #help table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #help td { padding: 7px 4px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
    #help td:first-child { white-space: nowrap; width: 1%; padding-right: 14px; }
    #help .tip { margin: 14px 0 16px; font-size: 12.5px; line-height: 1.6; color: var(--ink-soft); }

    #mapview .sheet { width: min(760px, 100%); padding: 16px; }
    #mapview header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    #mapview h2 { margin: 0; font-size: 20px; }
    #map-canvas { display: block; width: 100%; aspect-ratio: 1; max-height: calc(100vh - 140px); object-fit: contain; border-radius: 10px; background: #d8d0bd; }
    #mapview .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--ink-soft); }
    #mapview .legend i { display: inline-block; width: 10px; height: 10px; transform: rotate(45deg); margin-right: 6px; border: 1.5px solid var(--ink); }

    #done .sheet { text-align: center; }
    #done .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 20px; }
    #done .stats div { padding: 12px; border-radius: 10px; background: var(--paper-2); }
    #done .stats small { display: block; font-size: 11px; color: var(--ink-soft); font-weight: 700; }
    #done .stats b { font: 700 22px var(--mono); }

    /* ---------- photo mode ---------- */
    #photo { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
    #photo .top { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px; background: var(--glass); color: #fffaf0; font-size: 12px; font-weight: 700; white-space: nowrap; }
    #photo .bar { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 16px; background: var(--glass); pointer-events: auto; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    #photo .bar button { border: 0; border-radius: 10px; padding: 9px 12px; background: rgba(255, 250, 240, 0.12); color: #fffaf0; font-size: 12px; font-weight: 700; cursor: pointer; }
    #photo .bar button.on { background: #fffaf0; color: var(--ink); }
    #photo .bar .shot { background: var(--orange); padding: 9px 18px; }
    #postcard-frame { position: fixed; inset: 0; z-index: 19; pointer-events: none; box-shadow: inset 0 0 0 clamp(10px, 2.2vw, 26px) #f7f0e1; }

    @media (max-width: 860px) {
      #toolbar button span, #toolbar button kbd { display: none; }
      #toolbar button { min-width: 38px; padding: 9px 8px; }
      #log { width: 220px; top: 66px; padding: 10px 12px; }
      #log-desc { display: none; }
      #log-name { font-size: 16px; }
      #compass { display: none; }
      #brand b { font-size: 17px; }
      #brand small { display: none; }
    }
    @media (max-width: 560px) {
      #brand > div:last-child { display: none; }
      #log { left: 16px; right: 16px; width: auto; top: 64px; }
      #brand .stamp { width: 34px; height: 34px; }
      #discovery b { font-size: 24px; }
      #title .panel { margin-left: 0; }
      #title { align-items: flex-end; background: linear-gradient(0deg, rgba(18, 18, 16, 0.85) 0%, rgba(18, 18, 16, 0.4) 70%, rgba(18, 18, 16, 0) 100%); }
      #toasts { top: 150px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="loading">
    <div class="box">
      <div class="mark">TIMBERLINE<br /><span>OVERLAND</span></div>
      <div class="bar"><i id="load-fill"></i></div>
      <div id="load-step">…</div>
    </div>
  </div>

  <!-- ===================== HUD ===================== -->
  <div id="hud" class="hidden">
    <div id="brand">
      <div class="stamp"><svg width="26" height="26" viewBox="0 0 64 64"><path d="M4 52 L24 18 L33 32 L41 20 L60 52 Z" fill="#f4ecd9" /><path d="M37 26 L41 20 L46 28 Z" fill="#fff" /></svg></div>
      <div><b>TIMBERLINE OVERLAND</b><small data-i18n="title.kicker"></small></div>
    </div>

    <div id="compass"><canvas id="compass-canvas" width="720" height="72"></canvas><span id="heading-deg">000°</span></div>

    <div id="toolbar">
      <button data-act="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg><span data-i18n="tb.cam"></span><kbd>C</kbd></button>
      <button data-act="time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg><span data-i18n="tb.time"></span><kbd>T</kbd></button>
      <button data-act="weather"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H8a5 5 0 1 1 .9-9.9A6 6 0 0 1 20 11.5a3.75 3.75 0 0 1-2.5 7.5z" /></svg><span data-i18n="tb.weather"></span><kbd>G</kbd></button>
      <button data-act="photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" /><circle cx="12" cy="13" r="4" /></svg><span data-i18n="tb.photo"></span><kbd>F</kbd></button>
      <button data-act="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z" /><path d="M9 4v14M15 6v14" /></svg><span data-i18n="tb.map"></span><kbd>M</kbd></button>
      <button data-act="sound" id="tb-sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg><span data-i18n="tb.sound"></span><kbd>V</kbd></button>
      <button data-act="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01" /></svg><span data-i18n="tb.help"></span><kbd>?</kbd></button>
    </div>

    <div id="log" class="card">
      <header><span class="eyebrow" data-i18n="hud.log"></span><span id="log-count">0 / 8</span></header>
      <div class="track"><i id="log-fill"></i></div>
      <div id="log-label"></div>
      <div id="log-name"></div>
      <p id="log-desc"></p>
      <div id="log-nav">
        <span id="log-arrow"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2 L19 20 L12 16 L5 20 Z" fill="#e8622a" stroke="#2c2a26" stroke-width="1.5" stroke-linejoin="round" /></svg></span>
        <span id="log-dist">—</span>
        <span id="log-dots"></span>
      </div>
    </div>

    <div id="minimap" class="card">
      <canvas id="minimap-canvas" width="344" height="344"></canvas>
      <div class="elev"><small data-i18n="hud.elev"></small><span id="elev">—</span></div>
    </div>

    <div id="cluster" class="card">
      <div class="spd">
        <span id="speed">00</span>
        <span class="unit">KM/H</span>
        <span class="rpm"><i id="rpm-bar"></i></span>
      </div>
      <div class="modes">
        <span id="range" title="L">H</span>
        <span id="gear">N</span>
        <span id="lock"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>LOCK</span>
      </div>
      <div class="gauges">
        <canvas id="incl-canvas" width="300" height="168"></canvas>
        <canvas id="wheels-canvas" width="128" height="168"></canvas>
      </div>
      <div class="foot"><span><span data-i18n="hud.surface"></span><b id="surface">—</b></span><span><kbd>L</kbd> H/L · <kbd>X</kbd> LOCK</span></div>
    </div>

    <div id="toasts"></div>
    <div id="discovery" class="card"><div class="inner"><small></small><b></b><p></p></div></div>
    <div id="hint"></div>
    <div id="markers"></div>
  </div>

  <div id="touch">
    <button class="steer" id="t-left" data-touch="left">◀</button>
    <button class="steer" id="t-right" data-touch="right">▶</button>
    <button class="pedal" id="t-gas" data-touch="gas">GAS</button>
    <button class="pedal" id="t-brake" data-touch="brake">BRAKE</button>
    <button class="small" id="t-hb" data-touch="hb">HB</button>
    <button class="small" id="t-range" data-action="range">H/L</button>
    <button class="small" id="t-lock" data-action="lock">LOCK</button>
    <button class="small" id="t-reset" data-action="recover">↺</button>
    <button class="small" id="t-cam" data-action="cam">CAM</button>
  </div>

  <!-- ===================== title ===================== -->
  <div id="title" class="overlay">
    <div class="panel">
      <div class="kicker" data-i18n="title.kicker"></div>
      <h1>TIMBERLINE<span>OVERLAND</span></h1>
      <div class="ko">수목한계선 원정</div>
      <p class="tag" data-i18n="title.tag"></p>
      <div class="row">
        <button class="btn" id="btn-start" data-i18n="btn.start"></button>
        <button class="btn hidden" id="btn-continue" data-i18n="btn.continue"></button>
        <button class="btn ghost hidden" id="btn-new" style="color:#fffaf0;box-shadow:inset 0 0 0 2px rgba(255,250,240,.6)" data-i18n="btn.new"></button>
        <button class="btn ghost" id="btn-title-help" style="color:#fffaf0;box-shadow:inset 0 0 0 2px rgba(255,250,240,.35)" data-i18n="btn.help"></button>
      </div>
      <div id="title-progress"></div>
      <div class="keys">
        <span><kbd>W</kbd> <kbd>S</kbd></span><span data-i18n="help.drive"></span>
        <span><kbd>A</kbd> <kbd>D</kbd></span><span data-i18n="help.steer"></span>
        <span><kbd>L</kbd></span><span data-i18n="help.range"></span>
        <span><kbd>X</kbd></span><span data-i18n="help.lock"></span>
        <span><kbd>R</kbd></span><span data-i18n="help.recover"></span>
      </div>
      <div class="settings">
        <label><span data-i18n="set.quality"></span>
          <select id="quality">
            <option value="high" data-i18n="q.high"></option>
            <option value="medium" data-i18n="q.medium"></option>
            <option value="low" data-i18n="q.low"></option>
          </select>
        </label>
        <label><span data-i18n="set.lang"></span>
          <span class="seg"><button data-lang="ko">한국어</button><button data-lang="en">EN</button></span>
        </label>
      </div>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="sheet card stack">
      <h2 data-i18n="pause.title"></h2>
      <button class="btn" id="btn-resume" data-i18n="btn.resume"></button>
      <button class="btn dark" id="btn-pause-help" data-i18n="btn.help"></button>
      <button class="btn ghost" id="btn-to-title" data-i18n="btn.title"></button>
    </div>
  </div>

  <div id="help" class="overlay hidden">
    <div class="sheet card">
      <h2 data-i18n="help.title"></h2>
      <table>
        <tr><td><kbd>W</kbd> <kbd>S</kbd> · <kbd>↑</kbd> <kbd>↓</kbd></td><td data-i18n="help.drive"></td></tr>
        <tr><td><kbd>A</kbd> <kbd>D</kbd> · <kbd>←</kbd> <kbd>→</kbd></td><td data-i18n="help.steer"></td></tr>
        <tr><td><kbd>Space</kbd></td><td data-i18n="help.hb"></td></tr>
        <tr><td><kbd>L</kbd></td><td data-i18n="help.range"></td></tr>
        <tr><td><kbd>X</kbd></td><td data-i18n="help.lock"></td></tr>
        <tr><td><kbd>C</kbd></td><td data-i18n="help.cam"></td></tr>
        <tr><td><kbd>R</kbd> · <kbd>Shift</kbd>+<kbd>R</kbd></td><td data-i18n="help.recover"></td></tr>
        <tr><td><kbd>H</kbd></td><td data-i18n="help.lights"></td></tr>
        <tr><td><kbd>T</kbd> <kbd>G</kbd> <kbd>F</kbd> <kbd>M</kbd></td><td data-i18n="help.misc"></td></tr>
        <tr><td><kbd>V</kbd> · <kbd>Esc</kbd></td><td data-i18n="help.pause"></td></tr>
      </table>
      <p class="tip" data-i18n="help.tip"></p>
      <button class="btn" id="help-back" data-back="drive" data-i18n="btn.close"></button>
    </div>
  </div>

  <div id="mapview" class="overlay hidden">
    <div class="sheet card">
      <header><h2 data-i18n="map.title"></h2><button class="btn dark" id="map-close" data-i18n="btn.close"></button></header>
      <canvas id="map-canvas" width="1024" height="1024"></canvas>
      <div class="legend">
        <span><i style="background:#ff6a1f"></i><span data-i18n="hud.next"></span></span>
        <span><i style="background:#3d6b3a"></i><span data-i18n="map.found"></span></span>
        <span><i style="background:#fffaf0"></i><span data-i18n="map.unknown"></span></span>
      </div>
    </div>
  </div>

  <div id="done" class="overlay hidden">
    <div class="sheet card">
      <div class="eyebrow">TIMBERLINE OVERLAND</div>
      <h2 data-i18n="done.title"></h2>
      <p data-i18n="done.sub" style="margin:0;color:var(--ink-soft);font-size:14px"></p>
      <div class="stats">
        <div><small data-i18n="done.time"></small><b id="done-time">—</b></div>
        <div><small data-i18n="done.dist"></small><b id="done-dist">—</b></div>
        <div><small data-i18n="done.tilt"></small><b id="done-tilt">—</b></div>
        <div><small data-i18n="done.recover"></small><b id="done-recover">—</b></div>
      </div>
      <button class="btn" id="btn-free" data-i18n="btn.free"></button>
    </div>
  </div>

  <div id="photo" class="hidden">
    <div class="top"><span data-i18n="photo.title"></span> · <span data-i18n="photo.hint"></span></div>
    <div class="bar">
      <button data-filter="natural" class="on" data-i18n="filter.natural"></button>
      <button data-filter="film" data-i18n="filter.film"></button>
      <button data-filter="mono" data-i18n="filter.mono"></button>
      <button data-filter="postcard" data-i18n="filter.postcard"></button>
      <button class="shot" id="photo-shot" data-i18n="photo.shot"></button>
      <button id="photo-exit" data-i18n="photo.exit"></button>
    </div>
  </div>
  <div id="postcard-frame" class="hidden"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
