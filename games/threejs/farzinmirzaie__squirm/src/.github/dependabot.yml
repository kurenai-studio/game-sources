version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # one PR for all action bumps instead of one per action
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # pinned on purpose: newer three.js changes color management and the game's look
      - dependency-name: three
