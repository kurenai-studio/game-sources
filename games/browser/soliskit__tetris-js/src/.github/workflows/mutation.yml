name: Mutation testing

# A full run takes about 40 minutes. It runs weekly and on demand, and pull
# requests that change the game logic or its tests run mutation-pr.yml. It
# fails if any mutant survives.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run test:mutation
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
