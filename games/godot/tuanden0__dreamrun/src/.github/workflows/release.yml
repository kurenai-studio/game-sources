name: Release

# Builds Dreamrun for Windows, Linux and macOS.
#   - push a tag such as v1.0.0  : tests, builds, and publishes a GitHub release with the three downloads
#   - run it by hand (Actions tab): tests and builds, and keeps the downloads as workflow artifacts only
# Godot exports every platform from Linux, so one runner does all three.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ env.GODOT_VERSION }}

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates templates.tpz

      - name: Tests (a release is never built from a red tree)
        run: bash tools/test.sh

      - name: Export
        run: |
          mkdir -p build/windows build/linux build/macos
          godot --headless --path game --import
          godot --headless --path game --export-release "Windows Desktop" ../build/windows/Dreamrun.exe
          godot --headless --path game --export-release "Linux" ../build/linux/Dreamrun.x86_64
          godot --headless --path game --export-release "macOS" ../build/macos/Dreamrun.zip
          ls -lh build/*

      - name: Check that the exported Linux build starts
        run: |
          chmod +x build/linux/Dreamrun.x86_64
          out=$(timeout 120 build/linux/Dreamrun.x86_64 --headless --quit-after 120 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Failed loading resource"; then echo "the exported game logged errors"; exit 1; fi

      - name: Package
        run: |
          name="Dreamrun-${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          (cd build/windows && zip -q -9 "../../dist/${name}-windows.zip" Dreamrun.exe)
          tar -C build/linux -czf "dist/${name}-linux-x86_64.tar.gz" Dreamrun.x86_64
          cp build/macos/Dreamrun.zip "dist/${name}-macos.zip"
          cp LICENSE dist/LICENSE.txt
          ls -lh dist

      - name: Keep the downloads as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dreamrun-builds
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            Dreamrun, a learning project (not a product). Unzip and run.

            - **Windows**: unzip, run `Dreamrun.exe`. Windows SmartScreen may warn because the build is not signed: choose "More info", then "Run anyway".
            - **Linux**: `tar xzf Dreamrun-*-linux-x86_64.tar.gz && ./Dreamrun.x86_64`
            - **macOS**: unzip, then right-click `Dreamrun.app` and choose Open (the build is not signed or notarised), or run `xattr -cr Dreamrun.app` first.
