[zone]
id = "z2"
name = "The Linked Marshes"
order = 2
structure = "linked_list"
color = [70, 205, 170]
map_pos = [0.32, 0.55]
requires = ["z1"]
intro = "Stepping stones joined by rope bridges. Each stone only knows the way to the next one."

[lesson]
initial = [3, 8, 5]

[[lesson.beat]]
say = "Each node holds a value and a pointer to the next node. The list itself only remembers the head."

[[lesson.beat]]
say = "To reach a node you have to walk from the head, following the pointers: O(n)."
do = ["visit 0", "visit 1", "visit 2"]
code = "ll_traverse"

[[lesson.beat]]
say = "Inserting at the head is O(1). Nothing shifts: one new node and one pointer."
do = ["insert_head 1"]
code = "ll_insert_head"

[[lesson.beat]]
say = "To insert after a node, walk to it, then relink two pointers."
do = ["insert_after 1 4"]
code = "ll_insert_after"

[[lesson.beat]]
say = "To delete a node, point the node before it past it."
do = ["delete 2"]
code = "ll_delete"

[[puzzle]]
id = "z2_p1"
title = "Walk the Bridge"
type = "trace"
stage = "guided"
brief = "Visit every node, in the order you would reach them by following the next pointers."
initial = [6, 2, 9, 4]
ops = ["visit"]
goal = { kind = "traverse" }
code = "ll_traverse"
hints = ["You can't jump. Where does every walk begin?", "Start at the head and follow each arrow."]

[[puzzle]]
id = "z2_p2"
title = "New Head"
type = "build"
stage = "guided"
brief = "Make the list read 1, 3, 5, 7 using insert at the head."
initial = [5, 7]
tray = [3, 1]
ops = ["insert_head"]
goal = { kind = "target", state = [1, 3, 5, 7] }
code = "ll_insert_head"
hints = ["Click the slot before the head to insert there.", "Next: {next}."]
outro = "Inserting at the head was instant, however long the list was. Arrays can't do that."

[[puzzle]]
id = "z2_p3"
title = "Mend the Chain"
type = "repair"
stage = "guided"
brief = "A stone is missing. Insert the Tray value where it belongs so the list reads 1 to 5."
initial = [1, 2, 4, 5]
tray = [3]
ops = ["insert_head", "insert_after"]
goal = { kind = "target", state = [1, 2, 3, 4, 5] }
code = "ll_insert_after"
hints = ["Find the node the missing value should come after.", "Click the slot just after that node."]

[[puzzle]]
id = "z2_p4"
title = "Cut the Rot"
type = "repair"
stage = "challenge"
brief = "One node is corrupted. Delete it so the list counts up by tens."
initial = [10, 20, 99, 30, 40]
ops = ["delete"]
goal = { kind = "target", state = [10, 20, 30, 40] }
code = "ll_delete"
hints = ["Which value doesn't belong?", "Select the corrupted node, then press Delete."]

[[puzzle]]
id = "z2_p5"
title = "Find the Frog"
type = "trace"
stage = "challenge"
brief = "Search for 7, visiting nodes the only way a linked list allows."
initial = [3, 9, 7, 1]
ops = ["visit"]
goal = { kind = "search", value = 7 }
code = "ll_traverse"
hints = ["Even if you can see {target}, the computer can't until it walks there.", "Start at the head and follow the arrows."]

[[puzzle]]
id = "z2_p6"
title = "Reassemble"
type = "repair"
stage = "challenge"
brief = "Nodes can't be swapped, only added and removed. Make the list read 2, 4, 6, 8 in as few Moves as you can."
initial = [2, 8, 6]
tray = [4, 8]
ops = ["insert_head", "insert_after", "delete"]
goal = { kind = "target", state = [2, 4, 6, 8] }
code = "ll_insert_after"
hints = ["One node is in the wrong place. Remove it, and put a fresh copy where it belongs.", "Next: {next}."]

[[puzzle]]
id = "z2_boss"
title = "The Marsh Hydra"
type = "repair"
stage = "boss"
brief = "Make the list read 1 to 5. The Hydra will spawn a rotten node partway through."
initial = [1, 7, 3, 5]
tray = [2, 4]
ops = ["insert_after", "delete"]
goal = { kind = "target", state = [1, 2, 3, 4, 5] }
code = "ll_delete"
hints = ["Get rid of anything that doesn't belong, then fill the gaps from the Tray.", "When a rotten node appears, cut it out like the first one."]
intro = "The water churns. Something with many heads lives here..."
outro = "The Hydra sinks back into the marsh. The bridges hold."

[[puzzle.disruption]]
after = 1
do = ["insert_after 1 99"]
say = "The Hydra spawns a rotten node!"
