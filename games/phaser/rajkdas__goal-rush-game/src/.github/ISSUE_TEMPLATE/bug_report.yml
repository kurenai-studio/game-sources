name: Bug report
description: Report a broken feature or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug — please fill in the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the ball with Space
        2. Capture it in the SPIN saucer
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pinball physics (flippers / bumpers / loop)
        - Slot machine (reels / jackpot / multipliers)
        - Leaderboard / API
        - Controls (touch / keyboard / gamepad)
        - Deploy (Render) / startup
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS & browser
      placeholder: e.g. Windows 11, Chrome 141
    validations:
      required: true
  - type: input
    id: instance
    attributes:
      label: URL / instance
      description: Local dev URL or the Render demo URL where you saw it
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console output, `?debug=1` wireframe screenshot, etc.
