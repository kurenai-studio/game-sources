[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PLW"]
ignore = ["E501", "UP031"]

[tool.mypy]
python_version = "3.12"
mypy_path = ".:zh_map:zh_parity:audio"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
