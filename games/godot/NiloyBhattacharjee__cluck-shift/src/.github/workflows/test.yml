name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -sSfL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 "$RUNNER_TEMP/godot"
      - name: Import project
        run: '"$RUNNER_TEMP/godot" --headless --path . --import'
      - name: Run tests
        run: |
          for t in tests/test_*.gd; do
            echo "::group::$t"
            "$RUNNER_TEMP/godot" --headless --path . --fixed-fps 60 -s "$t"
            echo "::endgroup::"
          done
