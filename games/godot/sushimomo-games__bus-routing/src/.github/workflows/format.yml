name: Lint

on:
    pull_request:
    push:
        branches: [ main, master ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Format
        run: dotnet format bus-routing.csproj