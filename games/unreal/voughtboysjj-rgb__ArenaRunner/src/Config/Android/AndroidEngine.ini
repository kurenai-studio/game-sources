; Android-only rendering overrides for Arena Runner.
; The project uses the mobile forward renderer with as few features as possible,
; which is what keeps it playable on mid-range phones.

[SystemSettings]
; HDR gives the emissive cores their glow on mobile; disable if you need the last few fps.
r.MobileHDR=True
; 0 = off, 1 = FXAA. FXAA is cheap and hides the dithered edges on phones.
r.Mobile.AntiAliasing=1
; Uncomment on low-end devices (0.75 - 0.85 renders fewer pixels and upscales).
; r.MobileContentScaleFactor=0.8
; Shadows are the most expensive thing in the arena on mobile; keep them modest.
r.Shadow.MaxResolution=1024
r.Mobile.AllowDeferredShadingOpenGL=False
