name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and check the bundle
        run: node build.mjs --check
      - name: Fail if the build output is out of date
        run: |
          if ! git diff --quiet -- index.html dist; then
            echo "The build output is stale — run 'npm run build' and commit the result."
            git --no-pager diff --stat -- index.html dist
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: castellan
          path: dist/castellan.html
