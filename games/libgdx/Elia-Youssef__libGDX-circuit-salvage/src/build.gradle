// Root build script. Circuit Salvage is an asset-free top-down arcade game (grid + generated
// shapes + generated text only) built on libGDX 1.14.2, Java 17, lwjgl3 desktop backend. Two
// modules: core (GL-free game logic + the ApplicationAdapter render/input layer) and lwjgl3
// (desktop launcher).

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

allprojects {
    version = '1.0'
    ext {
        appName = 'CircuitSalvage'
        gdxVersion = '1.14.2'
    }
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
}
