// Core module: the GL-free MissionWorld simulation (headlessly testable, only depends on
// com.badlogic.gdx.math) plus the Game / Screen render + input layer. Depends only on libGDX core;
// the default BitmapFont comes from the gdx jar's classpath, not from a project asset.

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
