name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - run: dotnet publish project-puzzle/project-puzzle.csproj -c Release -r win-x64 --self-contained -o publish/windows

      - name: Zip build
        run: cd publish/windows && zip -r ../../project-puzzle-windows-x64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: project-puzzle-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - run: dotnet publish project-puzzle/project-puzzle.csproj -c Release -r osx-x64 --self-contained -o publish/macos

      - name: Zip build
        run: cd publish/macos && zip -r ../../project-puzzle-macos-x64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: project-puzzle-macos-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish for Linux
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
        run: dotnet publish project-puzzle/project-puzzle.csproj -c Release -r linux-x64 --self-contained -o publish/linux

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/com.github.kris.projectpuzzle.yml
          bundle: project-puzzle-linux-x64.flatpak
          upload-artifact: true

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            artifacts/project-puzzle-windows-x64.zip \
            artifacts/project-puzzle-linux-x64.flatpak \
            artifacts/project-puzzle-macos-x64.zip
