[/Script/Engine.InputSettings]
; This project uses the classic Input Manager pipeline so it can be configured from
; C++ + ini only (no Input Action / Input Mapping Context assets required).
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=True
bEnableFOVScaling=True
FOVScale=0.011110
DoubleClickTime=0.200000
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
; The project draws its own touch controls (see AArenaHUD::DrawMobileControls),
; so the engine's built-in virtual joystick widget is disabled.
DefaultTouchInterface=None

+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.250000,Exponent=1.000000,Sensitivity=1.000000))
+AxisConfig=(AxisKeyName="Gamepad_LeftY",AxisProperties=(DeadZone=0.250000,Exponent=1.000000,Sensitivity=1.000000))
+AxisConfig=(AxisKeyName="Gamepad_RightX",AxisProperties=(DeadZone=0.250000,Exponent=1.000000,Sensitivity=1.000000))
+AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.250000,Exponent=1.000000,Sensitivity=1.000000))
+AxisConfig=(AxisKeyName="Gamepad_RightTrigger",AxisProperties=(DeadZone=0.000000,Exponent=1.000000,Sensitivity=1.000000))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.000000,Exponent=1.000000,Sensitivity=1.000000))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.000000,Exponent=1.000000,Sensitivity=1.000000))

