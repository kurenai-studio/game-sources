name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  godot-check:
    name: godot-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Tests (smoke check + every tests/test_*.gd)
        run: GODOT="$HOME/godot/godot" bash tools/run_tests.sh

      - name: Run the main scene for a few frames
        run: ~/godot/godot --headless --path . --quit-after 60
