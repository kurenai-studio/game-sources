plugins {
    id 'base'
}

allprojects {
    group = 'com.projectenigma'
    version = '1.3.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    // The core module exposes libGDX types through its public API, so it needs
    // the `api` configuration supplied by the Java Library plugin.
    apply plugin: 'java-library'

    java {
        // Compile Java 17-compatible bytecode while allowing Gradle itself to
        // run on any installed JDK 17 or newer. An exact Java 17 toolchain
        // would unnecessarily fail on machines that only have JDK 21/25.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
