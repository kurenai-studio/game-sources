name: Hamurapi
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202610042011"
targets:
  Hamurapi:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # Icon Composer bundle; Xcode builds every icon size from it
      - path: Hamurapi.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.hamurabi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hamurapi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 Joshua Trommel. MIT License.
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Hamurapi-macOS.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.strategy-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"  # iPhone for 1.0; an iPad layout is on the roadmap
        ASSETCATALOG_COMPILER_APPICON_NAME: Hamurapi
        DEVELOPMENT_TEAM: QMM486NPYC
  HamurapiTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies: [{target: Hamurapi}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.hamurabi.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Hamurapi.app/Contents/MacOS/Hamurapi
schemes:
  Hamurapi:
    build: {targets: {Hamurapi: all, HamurapiTests: [test]}}
    test: {targets: [HamurapiTests]}
    shared: true
