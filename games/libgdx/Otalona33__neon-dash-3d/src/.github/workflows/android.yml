name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Download and prepare free game assets
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/fetch_game_assets.py

      - name: Build debug APK
        run: gradle --no-daemon :android:assembleDebug

      - name: Check APK size
        run: test "$(stat -c%s android/build/outputs/apk/debug/android-debug.apk)" -ge 314572800

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r android/build/outputs/apk/debug/android-debug.apk
            adb logcat -c
            adb shell am start -W -n com.otalona.neondash/.AndroidLauncher
            sleep 10
            adb logcat -d -b crash -v threadtime > launch-crash.log
            cat launch-crash.log
            ! grep -Eq "FATAL EXCEPTION|Fatal signal" launch-crash.log
            adb shell pidof com.otalona.neondash
            adb shell input tap 1230 530
            sleep 1
            adb shell input tap 540 2450
            sleep 1
            mkdir -p artifacts
            adb exec-out screencap -p > artifacts/neon-dash-garage.png

      - name: Store APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Dash-3D-debug-APK
          path: |
            android/build/outputs/apk/debug/*.apk
            artifacts/neon-dash-garage.png
          if-no-files-found: error
          retention-days: 14
