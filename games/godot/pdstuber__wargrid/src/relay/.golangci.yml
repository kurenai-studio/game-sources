version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gocritic:
      enabled-tags: [diagnostic, performance]
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout churn for no gain at this size
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
