name: Headless tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot 4.7.1
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Import assets
        run: Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import

      - name: Run tests
        run: |
          for test in smoke expansion talent_rules healing_affix endless_mode; do
            echo "::group::$test"
            Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script "tests/${test}_test.gd"
            echo "::endgroup::"
          done
