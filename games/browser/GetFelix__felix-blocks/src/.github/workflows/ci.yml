name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The version is pinned here, in core/Cargo.toml and in Cargo.lock; change all three together.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # core/ in WebAssembly, which the tests and the type check import.
      - run: npm run core
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Every tile and character loads in headless Chromium, and none on disk is left unloaded.
      - name: The assets load
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          up=0
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:4173/" >/dev/null && up=1 && break; sleep 1; done
          [[ $up -eq 1 ]] || { echo "nothing is serving on port 4173" >&2; exit 1; }
          npm run assets -- http://127.0.0.1:4173/
      # Every tile at a distance, cut out of the atlas, against the same tile on its own; and an atlas with no padding,
      # which must bleed, so the check is known to see it. Screenshots are in the artifact.
      - name: The atlas does not bleed
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort &
          up=0
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:4174/atlas.html" >/dev/null && up=1 && break; sleep 1; done
          [[ $up -eq 1 ]] || { echo "nothing is serving on port 4174" >&2; exit 1; }
          npm run atlas -- http://127.0.0.1:4174/atlas.html frames
      # A made-up world meshed in workers and drawn while the camera walks, and a merged quad against the separate
      # blocks it replaces; with the wrong shader the second must fail, so the check is known to see seams.
      - name: Chunks mesh and draw
        run: |
          npx vite preview --host 127.0.0.1 --port 4175 --strictPort &
          up=0
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:4175/chunks.html" >/dev/null && up=1 && break; sleep 1; done
          [[ $up -eq 1 ]] || { echo "nothing is serving on port 4175" >&2; exit 1; }
          npm run chunks -- http://127.0.0.1:4175/chunks.html frames
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: web/frames
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  rust-fmt:
    name: rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  rust-clippy:
    name: rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p felix-blocks-core --lib --target wasm32-unknown-unknown --locked -- -D warnings

  rust-test:
    name: rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # Felix, its control plane and the gateway from dev/compose.yml, and a join through the gateway: sign in, read and
  # write a chunk key conditionally, see another player's change.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dev/up.sh
      - run: node dev/check-join.mjs
      - if: failure()
        run: docker compose -f dev/compose.yml logs
      - if: always()
        run: dev/down.sh

  # The one check main requires, so a job added later is covered without changing the ruleset.
  ci-ok:
    name: CI ok
    if: always()
    needs: [web, rust-fmt, rust-clippy, rust-test, stack]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "${{ join(needs.*.result, ' ') }}" =~ ^(success\ ?)+$ ]]
