<!doctype html>
<html lang="en" class="h-full w-full">
  <head>
    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1, maximum-scale=1"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="🏎️ Drift, shift, drive." />

    <!--
      manifest.webmanifest provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="icon" href="logo.svg" />
    <link rel="apple-touch-icon" href="logo.svg" />

    <!--
      GitHub Corners. See https://github.com/remarkablemark/github-corners
    -->
    <% if (process.env.BUNDLE !== 'true') { %>
    <script
      src="https://unpkg.com/github-corners/dist/embed.min.js"
      data-href="https://github.com/remarkablegames/drift-shift"
      data-target="_blank"
      async
      defer
    ></script>
    <style>
      @media (max-width: 600px) {
        .github-corner {
          display: none;
        }
      }
      .github-corner > svg {
        opacity: 0.6;
        transition: opacity 0.4s;
      }
      .github-corner:hover > svg {
        opacity: 1;
      }
    </style>
    <% } %>

    <title>Drift Shift | remarkablegames</title>
  </head>
  <body class="h-full w-full select-none">
    <noscript>You need to enable JavaScript to play this game.</noscript>
    <div
      id="spinner"
      role="progressbar"
      aria-label="Loading"
      class="pointer-events-none fixed inset-0 m-auto h-28 w-28 animate-spin rounded-full border-4 border-neutral-300 border-t-blue-500"
    ></div>
    <canvas class="h-full w-full outline-none"></canvas>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
