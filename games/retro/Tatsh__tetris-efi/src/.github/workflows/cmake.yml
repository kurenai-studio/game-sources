---
concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref }}'
  queue: 'max'
jobs:
  build:
    name: 'Build'
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        run: sudo apt-get update -y && sudo apt-get install -y gnu-efi mtools ninja-build xorriso
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Configure
        run: cmake -B "${GITHUB_WORKSPACE}/build" -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build" --config "${BUILD_TYPE}"
      - name: Upload artifacts
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: error
          name: tetris-efi-${{ matrix.build-type }}
          path: |
            ${{github.workspace}}/build/tetris.efi
            ${{github.workspace}}/build/tetris.iso
      - name: Attest
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: |
            ${{github.workspace}}/build/tetris.efi
            ${{github.workspace}}/build/tetris.iso
      - env:
          REF_NAME: '${{ github.ref_name }}'
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Stage versioned release assets
        run: |
          cp build/tetris.efi "build/tetris-efi-${REF_NAME}.efi"
          cp build/tetris.iso "build/tetris-efi-${REF_NAME}.iso"
      - env:
          GH_TOKEN: '${{ github.token }}'
          REF_NAME: '${{ github.ref_name }}'
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          assets=("build/tetris-efi-${REF_NAME}.efi" "build/tetris-efi-${REF_NAME}.iso")
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Release asset '${asset}' was not found."
              exit 1
            fi
          done
          if gh release view "$REF_NAME" > /dev/null 2>&1; then
            gh release upload --clobber "$REF_NAME" "${assets[@]}"
          else
            gh release create "$REF_NAME" --draft --notes '' --title "$REF_NAME" "${assets[@]}"
          fi
    strategy:
      matrix:
        build-type: [Debug, Release]
name: Build
'on':
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
permissions: {}
