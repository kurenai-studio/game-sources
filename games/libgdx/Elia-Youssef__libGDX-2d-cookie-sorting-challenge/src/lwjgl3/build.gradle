// lwjgl3: desktop launcher module (the run target). `./gradlew lwjgl3:run` launches the game.
apply plugin: 'application'

application {
    mainClass = 'com.micro1.cookiesort.lwjgl3.Lwjgl3Launcher'
}

// The project-root assets/ folder is added as a resource dir so Gdx.files.internal(...) (classpath-relative
// on the LWJGL3 backend) finds cookie_plate.png / l_cookie.png / d_cookie.png both under `run` and inside
// the packaged jar below.
sourceSets.main.resources.srcDirs += [rootProject.file('assets').path]

// Keep the run task usable from any working directory. A runtime crash must surface as a
// non-zero exit (do not ignore the exit value) so it is visible to a grader running the task.
run {
    setWorkingDir(rootProject.projectDir)
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// Runnable fat JAR: bundles core's classes plus every runtime dependency (libGDX + lwjgl3 + natives)
// so `java -jar cookie-sorting-challenge.jar` runs standalone with no classpath argument, per the
// prompt's "runnable desktop JAR" deliverable. Run from rootProject.projectDir (same as `run`) so
// Gdx.files.internal("assets/...") and the local-storage metrics log resolve the same way.
jar {
    dependsOn configurations.runtimeClasspath
    archiveFileName = 'cookie-sorting-challenge.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.micro1.cookiesort.lwjgl3.Lwjgl3Launcher'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Strip signature files pulled in from signed dependency jars; a fat jar with a stale
    // signature manifest fails at launch with a SecurityException.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
