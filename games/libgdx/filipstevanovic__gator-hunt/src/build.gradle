buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.4.0"
    }
}

allprojects {
    version = "1.0"

    ext {
        gdxVersion = "1.14.2"
    }

    repositories {
        mavenCentral()
        google()
    }
}
