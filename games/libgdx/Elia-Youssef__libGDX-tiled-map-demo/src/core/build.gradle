// Core module: platform-independent game code. The Tiled map loader (TmxMapLoader) and
// OrthogonalTiledMapRenderer are part of gdx core, so no extra map dependency is needed.
// map.tmx + cave_tileset.png + player_move_spritesheet.png live in the root assets/ folder.

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
}
