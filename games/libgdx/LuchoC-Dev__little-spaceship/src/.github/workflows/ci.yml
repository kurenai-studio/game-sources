name: CI

on:
  push:
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repository, it never publishes anything.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The per-level documents are generated from assets/data/ and this is what keeps them
      # honest. Phase 11d's decision, and the reason it is a script rather than a convention:
      # a convention has to survive a tired agent at the end of a long phase and does not, which
      # is the failure mode docs/plan/10a-honest-documentation/mechanism.md is about.
      #
      # It regenerates and fails if the working tree changed, rather than calling the generator's
      # own --check, because `git status` also catches a stray file nobody generates — and because
      # "regenerate and fail if the tree changes" is the acceptance criterion as written.
      #
      # First, and before the JDK: it takes about a second and it needs nothing installed. Node is
      # already on ubuntu-latest and tools/build-level-docs.js has no dependency, deliberately.
      - name: Check the generated level documents against assets/data/
        run: |
          node tools/build-level-docs.js
          if [ -n "$(git status --porcelain docs/levels/)" ]; then
            echo
            echo "The level documents do not match assets/data/."
            echo
            echo "docs/levels/ is generated by tools/build-level-docs.js and must never be edited"
            echo "by hand. Either the content changed without the documents being regenerated, or a"
            echo "document was edited directly. Run:"
            echo
            echo "    node tools/build-level-docs.js"
            echo
            echo "and commit the result. What differs:"
            echo
            git status --porcelain docs/levels/
            git --no-pager diff -- docs/levels/
            exit 1
          fi
          echo "the generated level documents match assets/data/"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # sourceCompatibility/targetCompatibility are pinned to 17 in the root build.gradle.kts
          # because TeaVM cannot digest bytecode from newer Java versions. The local dev machine
          # builds with a newer JDK and lets javac downcompile, but CI has no reason to do the same
          # gymnastics: running the whole build on 17 is the direct way to get 17-shaped bytecode,
          # with no risk of a --release-flag edge case TeaVM has never been tested against.
          java-version: '17'

      # Handles both the Gradle wrapper distribution cache and the dependency/build cache. The
      # TeaVM build in particular is slow enough that an uncached run would cost real CI minutes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test (core, game, desktop, web JVM sources)
        run: ./gradlew build

      - name: Build the web target (TeaVM/JavaScript)
        # Not part of the `build` lifecycle task: the gdx-teavm plugin registers it separately.
        # This is the target that ships, per docs/planning/11-technical-prototype-results.md.
        # CI only proves this compiles — it cannot prove the result runs in a browser. Headless
        # Chrome fails under SwiftShader even when the real thing works, so no browser smoke test
        # is added here; a human verifies the web build by hand, every time.
        run: ./gradlew gdx_teavm_web_js_build
