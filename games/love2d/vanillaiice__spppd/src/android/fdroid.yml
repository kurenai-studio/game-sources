# The F-Droid build recipe, as sent to fdroiddata (metadata/xyz.spppd.yml).
# F-Droid builds each new v* tag from source with it, so a release needs only
# VERSION and VERSION_CODE bumped together in src/config.lua, and a changelog in
# fastlane/metadata/android/en-US/changelogs/<VERSION_CODE>.txt. F-Droid's copy is
# the one that counts once it's merged there.

Categories:
  - Action Game
License: GPL-3.0-only
AuthorName: vanillaiice
AuthorEmail: vanillaiice1@proton.me
WebSite: https://spppd.xyz
SourceCode: https://github.com/vanillaiice/spppd
IssueTracker: https://github.com/vanillaiice/spppd/issues
Changelog: https://github.com/vanillaiice/spppd/blob/HEAD/CHANGELOG.md

AutoName: SPPPD

RepoType: git
Repo: https://github.com/vanillaiice/spppd.git

Builds:
  - versionName: 3.2.2
    versionCode: 30202
    commit: a7dc0cb53608c0ae1d86ea702afbefddc0cd0045
    subdir: android/love-android/app
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
      - apt-get install -y gcc-multilib make zip
    gradle:
      - embedNoRecord
    rm:
      - android/love-android/love/src/jni/mpg123-1.17.0/src/libmpg123/.libs
      - android/love-android/love/src/jni/SDL2/Xcode
      - android/love-android/love/src/jni/libvorbis-1.3.5/macos
    prebuild: ../../prepare.sh
    scandelete:
      - android/love-android/love/src/jni/LuaJIT-2.1/android
    build: ../../luajit.sh $$NDK$$
    ndk: 27.1.12297006

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: src/config.lua|VERSION_CODE = (\d+)|src/config.lua|VERSION = "(.*)"
CurrentVersion: 3.2.2
CurrentVersionCode: 30202
