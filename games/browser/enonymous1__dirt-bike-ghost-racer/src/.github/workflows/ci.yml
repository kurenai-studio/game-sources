name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check game syntax
        run: node --check game.js
      - name: Check required files exist
        run: test -f index.html && test -f style.css && test -f game.js && test -f README.md && test -f LICENSE
