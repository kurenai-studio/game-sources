name: Feature request
description: A new capability or a change in behavior
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The project is small, and "no" is a normal answer here: v1 has an
        explicitly drawn boundary (see CONTRIBUTING.md, "What to ask about
        first"). Describing the problem helps more than proposing a
        ready-made solution. **Please write in English** — the repository's
        issues are kept in English.
  - type: textarea
    id: problem
    attributes:
      label: What problem is behind this
      description: What you cannot do today, and what it costs you.
      placeholder: There is no way to compare two cars' braking distance without driving them by hand.
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What you would like to see
      description: The behavior, not the implementation. How would you measure that the wish came true?
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: v1 boundary
      description: These are explicitly outside v1 — the issue will likely be declined.
      options:
        - label: I understand networking, AI traffic, falling-off parts and photorealism are out of v1
          required: true
