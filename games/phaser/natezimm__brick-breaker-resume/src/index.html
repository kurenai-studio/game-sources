<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive resume presented as a brick-breaker game—play to explore projects, skills, and experience."
    />

    <!-- Canonical URL for SEO -->
    <link rel="canonical" href="https://resume.nathanzimmerman.com/" />

    <!-- Open Graph meta tags -->
    <meta
      property="og:title"
      content="Resume Brick Breaker | Nathan Zimmerman"
    />
    <meta
      property="og:description"
      content="An interactive resume presented as a brick-breaker game—play to explore projects, skills, and experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resume.nathanzimmerman.com/" />

    <!-- Security: Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
    font-src 'self' https://cdnjs.cloudflare.com;
    img-src 'self' data: blob:;
    media-src 'self';
    connect-src 'self';
    object-src 'none';
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
  "
    />
    <!-- Security: Prevent MIME type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Security: Referrer Policy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Resume Brick Breaker</title>

    <!-- Set the saved look before first paint so the page never flashes the other one -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('brickBreakerTheme') === 'light') {
            theme = 'light';
          }
        } catch (e) {
          // Storage is unavailable; keep the default look.
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <!-- Preconnect to CDNs for faster resource fetching -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <!-- CSS loaded directly to avoid @import chaining -->
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/themes.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/messages.css" />

    <!-- Preload critical JS modules to flatten dependency chain -->
    <link rel="modulepreload" href="./main.js" />
    <link rel="modulepreload" href="./src/config.js" />
    <link rel="modulepreload" href="./src/constants.js" />
    <link rel="modulepreload" href="./src/game.js" />
    <link rel="modulepreload" href="./src/bricks.js" />
    <link rel="modulepreload" href="./src/brickLayout.js" />
    <link rel="modulepreload" href="./src/brickDom.js" />
    <link rel="modulepreload" href="./src/typeset.js" />
    <link rel="modulepreload" href="./src/overlay.js" />
    <link rel="modulepreload" href="./src/ui.js" />
    <link rel="modulepreload" href="./src/settings.js" />
    <link rel="modulepreload" href="./src/state.js" />

    <link rel="icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Font Awesome with Subresource Integrity (SRI) for security -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
      />
    </noscript>
  </head>

  <body>
    <main id="app">
      <!--
        The start screen shows the résumé in both looks at once, split down the
        middle. Each pane is laid out for the full window and clipped to its
        side, so the two halves line up as one page in two materials.
      -->
      <div id="startOverlay">
        <section
          class="look-pane look-pane--light"
          data-look="light"
          aria-label="Paper look"
        >
          <div
            id="brickContainerLight"
            class="look-resume"
            data-mode="typeset"
          ></div>
          <div class="look-card">
            <p class="look-name">Paper</p>
            <p class="look-line">The résumé, set in type.</p>
            <button
              id="startLight"
              class="look-start"
              type="button"
              data-theme-choice="light"
            >
              Play on Paper
            </button>
          </div>
        </section>
        <section
          class="look-pane look-pane--dark"
          data-look="dark"
          aria-label="Glass look"
        >
          <div
            id="brickContainerDark"
            class="look-resume"
            data-mode="wall"
          ></div>
          <div class="look-card">
            <p class="look-name">Glass</p>
            <p class="look-line">The résumé, lit from within.</p>
            <button
              id="startDark"
              class="look-start"
              type="button"
              data-theme-choice="dark"
            >
              Play on Glass
            </button>
          </div>
          <div class="overlay-attribution">
            <span>Made by</span>
            <a
              href="https://nathanzimmerman.com"
              target="_blank"
              rel="noopener noreferrer"
              class="brick-link"
              >Nathan Zimmerman</a
            >
          </div>
        </section>
        <div class="look-seam" aria-hidden="true"></div>
        <div class="overlay-title">
          <h1>Resume Brick Breaker</h1>
          <p>Break through what I’ve built. Pick a side.</p>
        </div>
      </div>

      <div id="hud">
        <div id="hudLives" class="hud-group hud-lives" role="img">
          <span class="hud-label">Lives</span>
          <span class="hud-pips"></span>
        </div>
        <div id="controls" class="hud-group">
          <button
            id="highScoreButton"
            type="button"
            aria-label="Show high score"
            title="High score"
          >
            <i class="fas fa-trophy" aria-hidden="true"></i>
          </button>
          <button
            id="pauseButton"
            type="button"
            aria-label="Pause game"
            aria-pressed="false"
            title="Pause"
          >
            <i class="fas fa-pause" aria-hidden="true"></i>
          </button>
          <button
            id="settingsButton"
            type="button"
            aria-label="Open settings"
            title="Settings"
          >
            <i class="fas fa-cog" aria-hidden="true"></i>
          </button>
        </div>
        <div id="hudScore" class="hud-group hud-score">
          <span class="hud-best">Best <span id="hudBestValue">0</span></span>
          <span class="hud-label">Score</span>
          <span id="hudScoreValue" class="hud-value">0</span>
        </div>
      </div>

      <div id="settingsModal" class="modal">
        <div
          class="modal-content settings-content"
          role="dialog"
          aria-modal="true"
          aria-labelledby="settingsTitle"
        >
          <div class="modal-header">
            <h2 id="settingsTitle">Settings</h2>
            <button
              id="closeModal"
              class="close-button"
              type="button"
              aria-label="Close settings"
            >
              &times;
            </button>
          </div>
          <div class="modal-body">
            <fieldset class="setting-section theme-picker">
              <legend>Theme</legend>
              <div class="theme-options">
                <label class="theme-option">
                  <input
                    type="radio"
                    name="theme"
                    id="themeDark"
                    value="dark"
                  />
                  <span
                    class="theme-swatch theme-swatch--dark"
                    aria-hidden="true"
                    ><span></span><span></span><span></span
                  ></span>
                  <span class="theme-option-text">
                    <strong>Dark</strong>
                    <small>Glass</small>
                  </span>
                </label>
                <label class="theme-option">
                  <input
                    type="radio"
                    name="theme"
                    id="themeLight"
                    value="light"
                  />
                  <span
                    class="theme-swatch theme-swatch--light"
                    aria-hidden="true"
                    ><span></span><span></span><span></span
                  ></span>
                  <span class="theme-option-text">
                    <strong>Light</strong>
                    <small>Paper</small>
                  </span>
                </label>
              </div>
            </fieldset>

            <section class="setting-section">
              <div class="setting-section-head">
                <h3>Ball and Paddle</h3>
                <button id="resetColors" class="text-button" type="button">
                  Reset colors
                </button>
              </div>
              <div class="settings-preview" aria-hidden="true">
                <span class="preview-ball"></span>
                <span class="preview-paddle"></span>
              </div>
              <div class="setting-item">
                <label for="ballColorPicker">Ball Color</label>
                <span class="color-field">
                  <span id="ballColorValue" class="color-value">#ffffff</span>
                  <input type="color" id="ballColorPicker" value="#ffffff" />
                </span>
              </div>
              <div class="setting-item">
                <label for="paddleColorPicker">Paddle Color</label>
                <span class="color-field">
                  <span id="paddleColorValue" class="color-value">#ffffff</span>
                  <input type="color" id="paddleColorPicker" value="#ffffff" />
                </span>
              </div>
              <div class="setting-item">
                <label for="paddleWidthSlider">Paddle Width</label>
                <span class="range-field">
                  <input
                    type="range"
                    id="paddleWidthSlider"
                    min="20"
                    max="200"
                    value="100"
                    step="5"
                  />
                  <span class="range-value"
                    ><span id="paddleWidthValue">100</span>px</span
                  >
                </span>
              </div>
              <div class="setting-item">
                <label for="ballSpeedSlider">Ball Speed</label>
                <span class="range-field">
                  <input
                    type="range"
                    id="ballSpeedSlider"
                    min="0.5"
                    max="2.0"
                    value="1.0"
                    step="0.1"
                  />
                  <span class="range-value"
                    ><span id="ballSpeedValue">1.0</span>×</span
                  >
                </span>
              </div>
            </section>

            <section class="setting-section">
              <h3>Sound</h3>
              <div class="setting-item">
                <label for="soundToggle">Sound Effects</label>
                <label class="toggle-switch">
                  <input type="checkbox" id="soundToggle" checked />
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </section>
          </div>
        </div>
      </div>

      <div id="highScoreModal" class="modal">
        <div
          class="modal-content high-score-content"
          role="dialog"
          aria-modal="true"
          aria-labelledby="highScoreTitle"
        >
          <div class="modal-header high-score-header">
            <h2 id="highScoreTitle">High Score</h2>
            <button
              id="closeHighScoreModal"
              class="close-button"
              type="button"
              aria-label="Close high score"
            >
              &times;
            </button>
          </div>
          <div class="modal-body">
            <div class="high-score-body">
              <i class="fas fa-trophy high-score-icon" aria-hidden="true"></i>
              <span id="highScoreValue">0</span>
            </div>
          </div>
        </div>
      </div>
      <div id="gameMessageOverlay" class="game-message-overlay hidden"></div>
    </main>

    <!-- Phaser game engine - bundled by Vite now -->
    <!-- <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script> -->
    <!-- Mammoth loaded on-demand in parser.js for better initial load -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
