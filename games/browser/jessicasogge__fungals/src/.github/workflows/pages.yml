# Publish the game to GitHub Pages whenever something lands on main.
# The game is just the files in public/ (HTML, CSS and JavaScript), so Pages
# can serve it with no server. The tests run first; if they fail, or leave
# too much of the game untested (see vitest.config.js), nothing is published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you rerun it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel one that's already going.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage # the tests, plus a check that they cover the game
      # Browsers keep a copy of styles.css for a while, so after a change they
      # can show new pages with old styles. Stamping each page's link with a
      # fingerprint of the file (styles.css?v=1a2b3c4d) makes them fetch the
      # new copy whenever it changes, with nothing to remember to bump.
      - name: Stamp the stylesheet link
        run: |
          v=$(sha256sum public/styles.css | cut -c1-8)
          sed -i "s#href=\"./styles.css\"#href=\"./styles.css?v=$v\"#" public/*.html
          # Fail if a page links styles.css some other way and missed the stamp.
          for f in $(grep -l 'styles.css' public/*.html); do
            grep -q "styles.css?v=$v" "$f" || { echo "$f wasn't stamped"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
