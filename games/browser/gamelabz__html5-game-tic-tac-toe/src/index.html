<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>⭕ Tic-Tac-Toe</h1>
      <p class="tagline">You are X. Beat the unbeatable AI (or tie).</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">You</span><span class="stat-value" id="you">0</span></div>
      <div class="stat"><span class="stat-label">Draws</span><span class="stat-value" id="draws">0</span></div>
      <div class="stat"><span class="stat-label">AI</span><span class="stat-value" id="ai">0</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="420" height="420"></canvas>
      <p class="message" id="message">Your move — click a square.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="restart">New Game</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
