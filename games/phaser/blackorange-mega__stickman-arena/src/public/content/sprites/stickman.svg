<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200">
  <!--
    A plain white stickman so Phaser's per-character `tint` can recolor it.
    To use your own art, point a character's "sprite" field at a PNG/SVG
    placed anywhere under public/ and (optionally) remove its "tint".
  -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="60" cy="28" r="22" fill="#ffffff" stroke="none" />
    <!-- spine -->
    <line x1="60" y1="50" x2="60" y2="125" />
    <!-- arms -->
    <line x1="60" y1="70" x2="26" y2="100" />
    <line x1="60" y1="70" x2="94" y2="100" />
    <!-- legs -->
    <line x1="60" y1="125" x2="32" y2="180" />
    <line x1="60" y1="125" x2="88" y2="180" />
  </g>
</svg>
