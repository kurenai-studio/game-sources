<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="28" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Perspective grid converging lines -->
  <path d="M 30 220 L 128 140 L 226 220" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  <path d="M 60 220 L 128 140 L 196 220" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  <path d="M 90 220 L 128 140 L 166 220" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  
  <!-- Ortho parallel projection box -->
  <!-- Isometric Cube -->
  <g transform="translate(128, 105)">
    <!-- Top Face -->
    <polygon points="0,-45 42,-22 0,0 -42,-22" fill="#00f2fe" fill-opacity="0.85" stroke="#ffffff" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-42,-22 0,0 0,50 -42,28" fill="#0072ff" fill-opacity="0.9" stroke="#ffffff" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="0,0 42,-22 42,28 0,50" fill="#00c6ff" fill-opacity="0.95" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Text Label -->
  <text x="128" y="205" text-anchor="middle" fill="#00f2fe" font-family="monospace, sans-serif" font-size="18" font-weight="bold" letter-spacing="4">SHIFT: ORTHO</text>
  <text x="128" y="228" text-anchor="middle" fill="#88a0c0" font-family="monospace, sans-serif" font-size="10" letter-spacing="2">DEPTH COLLAPSE PUZZLER</text>
</svg>
