<style>
/* Redesign 2026-11: toy diorama UI, wooden signposts with cream boards and pastel buttons */
:root{
  --wood:#A9703F; --wood2:#6B4428; --wood3:#C98F5E; --board:#FFF4E3; --board2:#F4E3C9; --ink:#4A2E1E; --ink2:#5A3E2B;
  --accent:#D32F2F; --accentH:#E53935; --accentD:#8E1C1C; --moss:#7FA36B; --mossD:#4F7F45; --sky:#9AD1F5; --skyD:#6FB4E6;
  --mint:#BFE8C8; --blush:#F6C3C3; --lemon:#FFE7A3; --lilac:#C9B8E8; --gold:#FFD166; --focus:#8B3213; --bg:#9AD1F5;
  --line:rgba(107,68,40,.22);
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:400 700;font-display:swap;src:url(assets/fonts/fredoka-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:400 700;font-display:swap;src:url(assets/fonts/fredoka-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Fredoka',"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;
  touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
/* wooden sign: a wood frame (border-box layer with grain) around a cream board (padding-box layer) */
.glass{border:8px solid transparent;border-radius:24px;
  background:linear-gradient(var(--board),var(--board)) padding-box,
    repeating-linear-gradient(90deg,rgba(60,30,10,.09) 0 2px,transparent 2px 9px) border-box,
    linear-gradient(180deg,var(--wood3),var(--wood)) border-box;
  box-shadow:0 7px 0 var(--wood2),0 16px 28px rgba(60,30,10,.22),inset 0 0 0 2px rgba(107,68,40,.25)}
.serif{font-family:inherit}
svg{display:block}

/* top bar: a hanging plank */
.topbar{position:fixed;top:calc(8px + var(--sa-t));left:8px;right:8px;min-height:60px;display:flex;align-items:center;gap:8px;
  padding:3px 8px;z-index:20;border-width:6px;border-radius:18px;box-shadow:0 5px 0 var(--wood2),0 12px 22px rgba(60,30,10,.22),inset 0 0 0 2px rgba(107,68,40,.22)}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;color:var(--accent);white-space:nowrap}
.topbar .brand span{font-size:19px}
.topbar .stats{flex:1;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--ink2);min-width:0}
.topbar .stats b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.topbar .acts{display:flex;gap:5px}
.ibtn{width:44px;height:44px;border-radius:14px;border:2px solid transparent;background:var(--board2);display:inline-flex;align-items:center;
  justify-content:center;color:var(--ink);font-weight:700;font-size:14px;transition:background .18s,border-color .18s,transform .12s}
.ibtn:hover{background:var(--lemon);border-color:var(--wood2)}
.ibtn:active{transform:translateY(1px)}
.ibtn.on{background:var(--lemon);border-color:var(--wood2)}
.ibtn svg{width:24px;height:24px}
@media (max-width:700px){
  .topbar{flex-wrap:wrap;padding:3px 6px;min-height:0}
  .topbar .brand span{display:none}
  .topbar .stats{gap:10px;font-size:14px;order:3;flex-basis:100%;justify-content:space-around;padding:2px 0 4px}
  .topbar .acts{margin-left:auto}
}

/* toasts: little wooden tags */
.toasts{position:fixed;top:calc(84px + var(--sa-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;
  align-items:center;z-index:25;pointer-events:none;width:max-content;max-width:92vw}
@media (max-width:700px){.toasts{top:calc(118px + var(--sa-t))}}
.toast{padding:7px 16px;border-radius:14px;font-weight:600;font-size:15px;animation:tin .25s ease-out;color:var(--ink);background:var(--lemon);
  border:2px solid var(--wood2);box-shadow:0 3px 0 var(--wood2)}
.toast.good{background:var(--mint)} .toast.bad{background:var(--blush)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}

/* power meter (a wooden ruler) + hint */
.power{position:fixed;left:14px;bottom:calc(18px + var(--sa-b));width:22px;height:170px;border-radius:10px;overflow:hidden;z-index:15;
  background:var(--board);border:3px solid var(--wood2);box-shadow:0 3px 0 var(--wood2)}
.power i{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(to top,var(--moss),var(--lemon),var(--accentH))}
.power b{position:absolute;left:0;right:0;top:0;bottom:0;background:repeating-linear-gradient(to top,transparent 0 24%,rgba(107,68,40,.35) 24% 25%)}
.hint{position:fixed;bottom:calc(20px + var(--sa-b));left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:14px;font-size:15px;
  color:var(--ink);background:var(--board);border:2px solid var(--wood2);box-shadow:0 3px 0 var(--wood2);z-index:15;pointer-events:none;text-align:center;max-width:90vw}
.intro{position:fixed;top:calc(92px + var(--sa-t));left:50%;transform:translateX(-50%);padding:14px 26px 12px;text-align:center;z-index:22;min-width:260px;animation:tin .3s ease-out}
.intro::after{content:'';position:absolute;left:50%;top:100%;width:16px;height:40px;margin-left:-8px;margin-top:7px;
  background:linear-gradient(90deg,var(--wood2),var(--wood) 40%,var(--wood2));border-radius:0 0 6px 6px}
.intro h2{margin:0;font-size:28px;color:var(--accent);font-weight:700}
.intro p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.intro small{display:block;margin-top:6px;color:var(--ink2);font-size:13px}
@media (max-width:700px){.intro{top:calc(126px + var(--sa-t))}}
/* phone landscape: compact single-row HUD so it never overlaps the play area or touch controls */
@media (max-height:500px){
  .topbar{top:calc(4px + var(--sa-t));left:6px;right:6px;min-height:36px;flex-wrap:nowrap;padding:2px 6px;gap:6px;border-width:3px;border-radius:12px;
    box-shadow:0 3px 0 var(--wood2),0 6px 12px rgba(60,30,10,.18)}
  .topbar .brand span{display:none}
  .topbar .brand svg{width:22px;height:22px}
  .topbar .stats{order:0;flex-basis:auto;gap:10px;font-size:13px;padding:0;justify-content:center}
  .topbar .stats b{font-size:14px}
  .topbar .acts{margin-left:0;gap:3px}
  .ibtn{width:30px;height:30px;border-radius:8px;font-size:12px}
  .ibtn svg{width:17px;height:17px}
  .toasts{top:calc(46px + var(--sa-t))}
  .toast{padding:4px 10px;font-size:13px;border-radius:10px}
  .power{left:8px;bottom:calc(8px + var(--sa-b));width:16px;height:96px;border-width:2px;pointer-events:none}
  .hint{bottom:calc(6px + var(--sa-b));padding:3px 10px;font-size:12px;border-width:3px;border-radius:10px;box-shadow:0 2px 0 var(--wood2)}
  .intro{top:calc(46px + var(--sa-t));padding:6px 14px;border-width:4px;border-radius:14px;min-width:180px;pointer-events:none}
  .intro::after{display:none}
  .intro h2{font-size:18px}
  .intro p{font-size:12px;margin-top:2px}
  .intro small{font-size:11px;margin-top:2px}
}

/* overlays + panels */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(154,209,245,.42);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:30;padding:12px;overflow:auto}
.panel{padding:20px 22px;width:min(94vw,460px);max-height:calc(100vh - 24px);overflow:auto}
.panel h2{margin:0 0 12px;font-size:26px;color:var(--accent);font-weight:700}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{min-height:46px;padding:0 20px;border-radius:16px;border:2px solid var(--wood2);background:var(--mint);color:var(--ink);
  font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 var(--wood2);
  transition:transform .14s,box-shadow .14s,background .18s}
.btn:hover{background:#d2f0d9}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood2)}
.btn.primary{background:var(--accent);border-color:var(--accentD);color:#fff;box-shadow:0 4px 0 var(--accentD)}
.btn.primary:hover{background:var(--accentH)}
.btn.primary:active{box-shadow:0 1px 0 var(--accentD)}
/* warm Cappadocia tuff/lemon buttons instead of generic blue */
.btn.sky{background:#F3D5A5} .btn.sky:hover{background:var(--lemon)}
.btn.lemon{background:var(--lemon)} .btn.lemon:hover{background:#ffefc0}
.btn.blush{background:var(--blush)} .btn.blush:hover{background:#f9d4d4}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.w{width:100%}
.btn svg{width:20px;height:20px}
label.sl{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2)}
label.sl span{width:92px}
input[type=range]{flex:1;accent-color:var(--mossD);height:44px;margin:0}
.seg{display:inline-flex;border:2px solid var(--wood2);border-radius:14px;overflow:hidden;background:var(--board2);box-shadow:0 3px 0 var(--wood2)}
.seg button{min-height:42px;min-width:64px;padding:0 14px;border:0;background:transparent;font-weight:600;color:var(--ink2);transition:background .18s}
.seg button.on{background:var(--lemon);color:var(--ink)}
.footer{margin-top:14px;font-size:13px;color:var(--ink2);text-align:center}
.footer a{color:var(--accent);text-decoration:none;font-weight:600}

/* title */
.title{text-align:center;width:min(94vw,520px)}
.title .logo{width:104px;height:104px;margin:0 auto 4px;filter:drop-shadow(0 4px 0 rgba(107,68,40,.35))}
.title h1{margin:0;font-size:48px;color:var(--accent);letter-spacing:.02em;line-height:1.05;font-weight:700;text-shadow:0 3px 0 var(--lemon)}
.title .sub{margin:6px 0 10px;color:var(--ink2);font-size:16px}
.title .how{font-size:14px;color:var(--ink2);margin:0 0 14px;line-height:1.45}
.title .best{font-size:15px;margin:10px 0 4px;color:var(--ink)}
.holes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 4px}
.holes button{min-height:46px;border-radius:12px;border:2px solid var(--wood2);background:var(--lemon);font-weight:700;font-size:15px;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;box-shadow:0 3px 0 var(--wood2);transition:transform .12s,box-shadow .12s}
.holes button:hover{background:#ffefc0}
.holes button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood2)}
.holes button .stars svg{width:10px;height:10px}
.holes button.locked{opacity:.45;background:var(--board2);box-shadow:none;cursor:default}
.holes button.done{background:var(--mint)}
.lbl{font-size:13px;color:var(--ink2);text-align:left;margin-top:6px}
@media (max-height:600px){.title .logo{width:64px;height:64px}.title h1{font-size:36px}.title .how{display:none}}

/* scorecard */
table.card{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.card th,table.card td{padding:3px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.card th{color:var(--ink2);font-weight:600;font-size:12px}
table.card td.n{color:var(--accent);font-weight:700}
table.card td.r{font-size:12px}
table.card .birdie{color:var(--mossD);font-weight:600} table.card .bogey{color:var(--accent)} table.card .ace{color:#a66a00;font-weight:700}
.stars{display:inline-flex;gap:2px}
.stars svg{width:16px;height:16px}
.stars svg,.bigstars svg,.starlist svg{fill:transparent;stroke:rgba(107,68,40,.45);stroke-width:1.5}
.stars svg.on,.bigstars svg.on,.starlist li.on svg{fill:var(--gold);stroke:var(--wood2)}
.bigstars{display:flex;justify-content:center;gap:8px;margin:8px 0}
.bigstars svg{width:44px;height:44px}
.bigstars svg.on{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.bigstars svg.on:nth-child(2){animation-delay:.12s} .bigstars svg.on:nth-child(3){animation-delay:.24s}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{padding:10px;border-radius:14px;background:var(--sky);border:2px solid var(--wood2);text-align:center}
.kv div:nth-child(2n){background:var(--mint)}
.kv b{display:block;font-size:26px;color:var(--ink);font-weight:700}
.kv span{font-size:13px;color:var(--ink2)}
/* short desktop viewports: the course-complete board must fit without clipping its buttons */
@media (max-height:760px){.kv{grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}.kv div{padding:6px 4px}.kv b{font-size:20px}
  #ov-end .panel{padding:14px 18px}#ov-end table.card th,#ov-end table.card td{padding:1px 4px;font-size:13px}}
.rec{color:var(--mossD);font-weight:700;text-align:center;margin:4px 0;font-size:17px}
.starlist{list-style:none;margin:8px 0 0;padding:0;font-size:15px;color:var(--ink2);text-align:left}
.starlist li{display:flex;align-items:center;gap:8px;padding:3px 0}
.starlist svg{width:18px;height:18px}
.starlist li.on{color:var(--ink);font-weight:600}

#dbg{position:fixed;left:8px;bottom:calc(8px + var(--sa-b));font:12px/1.4 ui-monospace,Consolas,monospace;color:#9f9;background:rgba(0,0,0,.6);
  padding:6px 8px;white-space:pre;pointer-events:none;z-index:60;border-radius:6px;max-width:92vw;overflow:hidden}
#dbg .err{color:#f66}
#loadmsg{color:var(--ink2);font-size:14px;margin:6px 0}
@media (prefers-reduced-motion: reduce){
  .toast{animation:none}
  .toast.out{transition:none;opacity:0}
  .bigstars svg.on{animation:none}
  .intro{animation:none}
}
</style>

</svg>

<div id="ui">
  <!-- HUD -->
  <div class="topbar glass" id="hud" hidden>
    <div class="brand"><svg width="30" height="30"><use href="#i-logo"/></svg><span>Peri Golf</span></div>
    <div class="stats">
      <div><span data-t="hole">Delik</span> <b id="s-hole">1</b>/12</div>
      <div><span data-t="par">Par</span> <b id="s-par">3</b></div>
      <div><span data-t="strokes">Vuruş</span> <b id="s-str">0</b></div>
      <div><span data-t="total">Toplam</span> <b id="s-tot">0</b></div>

// ---------------------------------------------------------------------------
// Frame: visuals follow the state; render; debug
// ---------------------------------------------------------------------------
const previewTrace = [];
let lastBurner = 0, rollAxis = new THREE.Vector3(), ballQuat = new THREE.Quaternion(), _tmpq = new THREE.Quaternion();
view.sync = function (dt = 0) {
  const b = game.ball, course = game.course; if (!course) return;
  // keyboard aim
  if (game.aim.kb && canAim()) {
    if (keys.has('ArrowLeft')) game.aim.angle -= 1.6 * dt; if (keys.has('ArrowRight')) game.aim.angle += 1.6 * dt;
    if (keys.has('ArrowUp')) cam.dist = clamp(cam.dist - 2 * dt, 2.2, 9); if (keys.has('ArrowDown')) cam.dist = clamp(cam.dist + 2 * dt, 2.2, 9);
  }

  else { ballMesh.position.set(b.x, b.y, b.z); ballMesh.visible = true; }

  if (sp > 0.01 && dt > 0) { rollAxis.set(b.vz, 0, -b.vx).normalize(); _tmpq.setFromAxisAngle(rollAxis, sp * dt / BALL_R); ballQuat.premultiply(_tmpq); ballMesh.quaternion.copy(ballQuat); }
  const gh = course.height(b.x, b.z); ballShadowRing.visible = gh !== null && !b.sunk; if (gh !== null) ballShadowRing.position.set(b.x, gh + 0.006, b.z);

  if (!b.rest && !b.sunk && sp > 0.9 && Math.random() < dt * 42) fx('spark', b.x + (Math.random() - 0.5) * 0.1, b.y + (Math.random() - 0.3) * 0.1, b.z + (Math.random() - 0.5) * 0.1, 1); // fairy sparkle trail
  // the hole pops onto the table like a toy piece at the start of the intro
  { const u = game.phase === 'intro' ? clamp(game.introT / 0.65, 0, 1) : 1, c1 = 1.70158, s = Math.max(0.001, 1 + (c1 + 1) * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2));

    const arr = previewGeo.attributes.position.array; const n = Math.min(400, previewTrace.length / 3);
    for (let i = 0; i < n * 3; i++) arr[i] = previewTrace[i] + (i % 3 === 1 ? 0.01 : 0);
    previewGeo.setDrawRange(0, n); previewGeo.attributes.position.needsUpdate = true; previewLine.visible = true;
    hitRing.visible = r.firstHit > 0; if (hitRing.visible) hitRing.position.set(r.b.x, r.b.y - BALL_R + 0.012, r.b.z);
    const pl = pullGeo.attributes.position.array; const L = 0.3 + game.aim.power * 1.4;
    pl[0] = b.x; pl[1] = b.y; pl[2] = b.z; pl[3] = b.x - Math.sin(game.aim.angle) * L; pl[4] = b.y; pl[5] = b.z + Math.cos(game.aim.angle) * L; pullGeo.attributes.position.needsUpdate = true; pullLine.visible = true;
    ui.power(game.aim.power, true);
  } else { previewLine.visible = false; hitRing.visible = false; pullLine.visible = false; ui.power(0, game.aim.kb && canAim()); }
  if (game.phase === 'play' && !game.hintShown && !FLAG.auto && b.rest) ui.hint(aiming ? t('hintCam') : t('hintAim'));
  // obstacles
  for (const { o, m } of obstacleMeshes) {
    if (o.type === 'wheel') (m.userData.spin || m).rotation.y = -o.ang;
    else if (o.type === 'door') { m.position.x = o.ox; m.rotation.z = -o.roll; }
    else if (o.type === 'lantern') { if (o.dir === 'x') m.rotation.z = -o.theta; else m.rotation.x = o.theta; }
    else if (o.type === 'donkey') { m.position.x = o.ox; m.rotation.y = o.dirx > 0 ? 0 : Math.PI; m.position.y = (course.height(o.x0 + 1, o.z) || 0) + (o.vx ? Math.abs(Math.sin(o.walk)) * 0.035 : 0);
      if (m.userData.legs) { const sw = o.vx ? Math.sin(o.walk) * 0.5 : 0; m.userData.legs.forEach((l, k) => { l.rotation.z = (k === 0 || k === 3) ? sw : -sw; }); }
      if (o.vx && Math.abs(o.ox) < 1.5 && !o.brayed) { o.brayed = true; audio.donkey(); } if (Math.abs(o.ox) > 4) o.brayed = false; }
  }

  if (grapeMesh && grapeMesh.visible) { grapeMesh.rotation.y = game.time * 1.4; grapeMesh.position.y = (course.height(grapeMesh.position.x, grapeMesh.position.z) ?? 0) + 0.08 + Math.sin(game.time * 2.5) * 0.04; }

  if (game.time - lastBurner > 6 + Math.random() * 5 && audio.ok()) { lastBurner = game.time; const k = Math.floor(Math.random() * BALLOON_N), s = balloonState[k]; audio.burner(camera.position.distanceTo(_p.set(s.x, s.y, s.z))); }
};

// ---- debug overlay ----
const dbg = $('dbg'); let fps = 60, frameN = 0, fpsAcc = 0, callsNow = 0, gpuName = '';
if (FLAG.debug) {

  try { const gl = renderer.getContext(); const ext = gl.getExtension('WEBGL_debug_renderer_info'); gpuName = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : ''; } catch (e) { gpuName = ''; }

  dbg.innerHTML = `fps ${fps.toFixed(0)} · calls ${i.calls} · tris ${(i.triangles / 1000).toFixed(1)}k · ${gpuName.slice(0, 48)}\nassets ${as} · env ${envOn() ? 'on' : 'off'}\n` +
    `phase ${game.phase} · hole ${game.holeIndex + 1} · strokes ${game.strokes} · total ${totalStrokes()} · ball ${game.ball ? game.ball.x.toFixed(2) + ',' + game.ball.z.toFixed(2) + ' ' + (game.ball.rest ? 'rest' : 'moving') : '-'}` +
    (window.__errs.length ? `\n<span class="err">errors ${window.__errs.length}: ${window.__errs.slice(-3).join(' | ').replace(/</g, '&lt;')}</span>` : '\nerrors 0');
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
applyQuality();
camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
{ // title backdrop before any hole is loaded: sunrise sky, camera over the chimney field
  const fogCol = tintSky(sky.geometry, 0.55, Math.atan2(20, 30), 0.25); scene.fog.color.copy(fogCol); renderer.setClearColor(fogCol);
  sun.position.set(20, 9, 30); sun.target.position.set(0, 0, 0);
  scene.environmentRotation.set(0, Math.atan2(20, 30) - Math.PI / 2, 0); scene.environmentIntensity = (FLAG.env || 0.22) * 0.75;
  camera.position.set(6, 3, 12); camera.lookAt(-4, 1, -6);
}
ui.applyLang(); ui.soundBtn();
$('loadmsg').textContent = ''; $('b-play').disabled = false;
if (FLAG.auto) startRun(FLAG.hole ? clamp(FLAG.hole - 1, 0, 11) : 0);
else if (FLAG.hole) startRun(clamp(FLAG.hole - 1, 0, 11));
if (FLAG.sim > 0) simulate(FLAG.sim);
let last = performance.now(), assetsStarted = false;
function frame(now) {
  requestAnimationFrame(frame);

    audio.update(game.paused || game.phase === 'title' || game.hidden);

}
