name: Bug report
description: Something does not work as expected — a crash, graphics, physics, sound, interface
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Below is the minimum needed to reproduce the defect without
        a follow-up conversation. If you are missing some detail, say so
        directly: an honest "I did not check" is more useful than a guess.
        **Please write in English** — the repository's issues are kept in
        English.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A fact, not a conclusion. "The body turned black after painting with metallic=0", not "materials are broken".
      placeholder: The car stayed on its roof after a crash and no restart hint appears.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps from launching the game to the failure, with the map and car named.
      placeholder: |
        1. Start simulation on the Arena with the sedan
        2. Accelerate into the wall
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
      description: What the game should have done instead.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Version and platform
      description: A release tag (v*) or `git describe --tags`, the OS and the GPU. From the Help menu of the export, or from the console output of `node tools/project.mjs run`.
      placeholder: v0.1.0, Windows 11, Intel UHD 730
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, recordings, the settings.cfg contents (without personal data). Attach images by dragging them here.
