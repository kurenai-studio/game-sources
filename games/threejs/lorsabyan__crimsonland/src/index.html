<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0706" />
    <title>Crimsonland</title>
    <meta name="description" content="An unofficial, open source web version of the top-down horde shooter. Free to play in the browser." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Crimsonland" />
    <meta property="og:description" content="An unofficial, open source web version of the top-down horde shooter. Free to play in the browser." />
    <meta property="og:url" content="https://lorsabyan.github.io/crimsonland/" />
    <meta property="og:image" content="https://lorsabyan.github.io/crimsonland/preview.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23b0121f'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" hidden></div>
    <div id="floats" aria-hidden="true"></div>
    <div id="cross" hidden aria-hidden="true">
      <svg width="120" height="120" viewBox="-60 -60 120 120">
        <circle class="ring" r="16"></circle>
        <circle class="reload" r="16" pathLength="100" transform="rotate(-90)"></circle>
        <path class="tick" d="M0 -5V-2M0 5V2M-5 0H-2M5 0H2"></path>
      </svg>
    </div>
    <div id="touch" hidden></div>
    <div id="perks" hidden></div>
    <div id="pause" hidden></div>
    <div id="over" hidden></div>
    <div id="menu" hidden></div>
    <div id="loader"><div><b>CRIMSON<i>LAND</i></b><span>digging the graves</span></div></div>
    <div id="error" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
