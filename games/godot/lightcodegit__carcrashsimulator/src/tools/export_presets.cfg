; Portable release presets. Renderer comes from project.godot (GL Compatibility).
; No machine paths, signing identities, encryption keys, or deployment settings.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
custom_features=""
export_filter="all_resources"
include_filter="assets/*.txt,assets/**/*.txt,LICENSE"
exclude_filter="tests/*,docs/*,tools/*,.github/*,artifacts/*,*.md"
export_path=""
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
application/icon="res://assets/ui/logo_emblem.ico"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=true

