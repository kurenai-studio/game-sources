name: Smoke run the exported build

# Exporting counts as success only when Godot says so? No: when the built game
# actually starts. A headless boot for a few frames catches an empty or corrupt
# embedded .pck, a missing main scene and initialization crashes — things the
# headless source tests cannot see, because they live in a different environment.

description: 'Launch the exported binary headless and fail if it does not boot'
inputs:
  platform:
    description: 'windows or linux'
    required: true

runs:
  using: composite
  steps:
    - name: Boot the exported build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $platform = '${{ inputs.platform }}'
        $dir = Join-Path 'artifacts/build' $platform
        if (-not (Test-Path -LiteralPath $dir)) { throw "No build directory $dir." }
        # The .pck is embedded into the executable, so the directory holds one
        # binary per platform. Names come from the export presets: "Car Crash
        # Simulator.exe" on Windows, "Car Crash Simulator.x86_64" on Linux.
        $exe = Get-ChildItem -LiteralPath $dir -File |
          Where-Object { $_.Name -eq 'Car Crash Simulator.exe' -or $_.Name -eq 'Car Crash Simulator.x86_64' } |
          Select-Object -First 1
        if (-not $exe) { throw "No exported binary under $dir — the export presets embed the .pck into the executable." }
        if ($exe.Length -lt 30mb) { throw "Suspiciously small executable: $($exe.Length) bytes — the embedded .pck is missing." }
        if (-not $IsWindows) {
          chmod +x $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Could not mark the exported binary executable.' }
        }
        New-Item -ItemType Directory -Force artifacts/logs | Out-Null
        & $exe.FullName --headless --quit-after 120 2>&1 | Tee-Object -FilePath "artifacts/logs/smoke-$platform.log"
        if ($LASTEXITCODE -ne 0) { throw "Exported build exited with $LASTEXITCODE." }
