[/Script/EngineSettings.GameMapsSettings]
; The project ships no map. /Engine/Maps/Entry is an empty map that comes with the engine; the game mode
; (ACoinRunGameMode) builds the floor, lights and everything else at start-up.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/CoinRun.CoinRunGameMode

[/Script/Engine.RendererSettings]
; Keep the arena brightness steady instead of letting auto exposure adapt to a mostly dark scene.
r.DefaultFeature.AutoExposure=False
