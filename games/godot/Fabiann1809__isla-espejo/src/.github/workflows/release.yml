name: Build and release

# Tag a version to publish a playable Windows build as a GitHub Release:
#   git tag v0.1.0 && git push origin v0.1.0
# "Run workflow" (manual) builds the same zip and keeps it as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: windows-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}

      - name: Download Godot and Windows export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o ~/godot/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o ~/godot/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j ~/godot/templates.tpz 'templates/windows_*' 'templates/version.txt' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm ~/godot/templates.tpz ~/godot/godot.zip

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Run the tests before building
        run: GODOT="$HOME/godot/godot" bash tools/run_tests.sh

      - name: Export Windows build
        run: |
          mkdir -p builds
          ~/godot/godot --headless --path . --export-release "Windows Desktop" builds/IslaEspejo.exe
          test -f builds/IslaEspejo.exe

      - name: Package
        run: |
          name="IslaEspejo-${GITHUB_REF_NAME//\//-}-windows"
          cp README.md CREDITS.md LICENSE builds/
          (cd builds && zip -q -r "../${name}.zip" .)
          echo "ZIP=${name}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
