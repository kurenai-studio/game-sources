// Root build script. RunningWheel is a libGDX 1.14.1, Box2D, Java 8 project, lwjgl3 desktop
// backend only (gdx-liftoff-style, no android/ios/html modules). Two modules: core (Box2D
// side-scroller simulation + render/input) + lwjgl3 (desktop launcher). Java 8 is a task
// requirement (prompt + rubric); the build targets the Java 8 platform exactly via --release 8.

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

allprojects {
    version = '1.0'
    ext {
        appName = 'RunningWheel'
        gdxVersion = '1.14.1'
    }
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Java 8 source + target (task requirement), pinned via --release so the build
        // targets the Java 8 platform exactly (compiles cleanly on a newer build JDK).
        options.release = 8
    }

    repositories {
        mavenCentral()
    }
}
