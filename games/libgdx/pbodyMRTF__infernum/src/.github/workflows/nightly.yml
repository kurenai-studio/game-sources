name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    name: Build Nightly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build client and server
        run: |
          ./gradlew clean dist serverDist \
            -PbuildLabel="Nightly $(date +'%Y.%m.%d')"

      - name: List build artifacts
        run: |
          ls -lah build/dist/

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: nightly-${{ github.run_number }}
          name: "Nightly ${{ github.run_number }}"
          body: |
            ## Infernum Nightly

            Automated nightly build.

            **Commit:** `${{ github.sha }}`

            ⚠️ Nightly builds are development versions and may contain bugs or incomplete features.
          prerelease: true
          files: |
            build/dist/infernum-*-dist.jar
            build/dist/infernum-server-*-dist.jar

      - name: Delete old nightly releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keep = 7;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const nightlies = releases
              .filter(release => release.tag_name.startsWith("nightly-"))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            console.log(`Found ${nightlies.length} nightly releases.`);
            console.log(`Keeping the newest ${keep}.`);

            for (const release of nightlies.slice(keep)) {
              console.log(`Deleting release: ${release.tag_name}`);

              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });

              try {
                console.log(`Deleting tag: ${release.tag_name}`);

                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
              } catch (error) {
                console.log(
                  `Could not delete tag ${release.tag_name}: ${error.message}`
                );
              }
            }

            console.log("Nightly cleanup completed.");
