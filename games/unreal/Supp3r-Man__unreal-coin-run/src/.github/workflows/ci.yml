name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules-tests:
    # The game rules (Source/CoinRun/Rules) have no Unreal dependency, so they build and test without the engine.
    # This does NOT compile the Unreal-facing classes in Source/CoinRun/Game; see README ("What is verified").
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S Tests/rules -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build (warnings are errors)
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
